<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>UI 테스트</title>
<style>
/* 토큰 · 규칙은 .interface-design/system.md. 색은 여기 토큰으로만 쓰고 다크는 값만 바꾼다 */
:root{--paper:#eef0f4;--sheet:#ffffff;--well:#f5f6f9;--rule:rgba(20,28,46,.10);--rule-strong:rgba(20,28,46,.18);--ink:#141a29;--ink-2:#566077;--ink-3:#8a93a6;--probe:#2d4fd6;--probe-wash:#eef1fd;--probe-ring:rgba(45,79,214,.28);--pass:#167a3f;--pass-wash:#e4f5ea;--bad:#c0332b;--bad-wash:#fdecea;--warn:#8a5200;--warn-wash:#fff6e8;--scrim:rgba(18,22,30,.5);--lift:0 0 0 1px rgba(20,28,46,.06),0 2px 4px -1px rgba(20,28,46,.06),0 24px 48px -12px rgba(20,28,46,.28);--lift-sm:0 0 0 1px rgba(20,28,46,.06),0 2px 4px -1px rgba(20,28,46,.06),0 16px 32px -10px rgba(20,28,46,.26);--ease:cubic-bezier(.23,1,.32,1);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#0e1118;--sheet:#161b26;--well:#1b2130;--rule:rgba(255,255,255,.08);--rule-strong:rgba(255,255,255,.16);--ink:#e9ecf4;--ink-2:#a2abc0;--ink-3:#6e788f;--probe:#8fa4ff;--probe-wash:#1f2745;--probe-ring:rgba(143,164,255,.35);--pass:#63d28f;--pass-wash:#15301f;--bad:#f2928b;--bad-wash:#3a1e1c;--warn:#f0a53a;--warn-wash:rgba(240,165,58,.14);--scrim:rgba(0,0,0,.62);--lift:0 0 0 1px rgba(255,255,255,.08),0 24px 48px -12px rgba(0,0,0,.7);--lift-sm:0 0 0 1px rgba(255,255,255,.08),0 16px 32px -10px rgba(0,0,0,.7);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;gap:14px;padding:16px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible,.pick label:focus-within{outline:2px solid var(--probe);outline-offset:2px}
code{font-family:var(--mono);font-size:11.5px}
svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 단추 — 종류는 기본 · 강조(primary: 하는 일 하나) · 옅은 강조(tint) · 투명(ghost) · 위험(danger · solid-bad) · 글자(link) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border:0;border-radius:8px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule-strong);font-size:12.5px;font-weight:600;white-space:nowrap;transition:transform .12s var(--ease),background-color .15s,box-shadow .15s,filter .15s,color .15s}
.btn:hover{background:var(--well)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;background:var(--sheet)}
.btn.icon{width:30px;padding:0}
.btn.primary{background:var(--probe);color:var(--sheet);box-shadow:none}
.btn.primary:hover{background:var(--probe);filter:brightness(1.1)}
.btn.primary:disabled{background:var(--probe);filter:none}
.btn.tint{background:var(--probe-wash);color:var(--probe);box-shadow:inset 0 0 0 1px var(--probe-ring)}
.btn.tint:hover{background:var(--probe-wash);box-shadow:inset 0 0 0 1px var(--probe)}
.btn.ghost{background:none;box-shadow:none;color:var(--ink-2);font-weight:500}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.btn.ghost:disabled:hover{background:none;color:var(--ink-2)}
.btn.danger{color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 45%,var(--rule))}
.btn.danger:hover{background:var(--bad-wash)}
.btn.danger:disabled:hover{background:var(--sheet)}
.btn.solid-bad{background:var(--bad);color:var(--sheet);box-shadow:none}
.btn.solid-bad:hover{background:var(--bad);filter:brightness(1.08)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.back{padding-left:6px}
.link{border:0;background:none;padding:0 2px;min-height:28px;color:var(--probe);font-size:12px;font-weight:500;text-align:left;border-radius:4px}
.link:hover{text-decoration:underline;text-underline-offset:2px}
.link:active{opacity:.7}

/* 머리 · 주소창 줄 */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:0;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.018em;display:flex;align-items:center;gap:8px}
.beta{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:1px 7px;border-radius:99px;color:var(--probe);background:var(--probe-wash)}
.acts{display:flex;gap:6px;align-items:center}
.addr{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--well);box-shadow:inset 0 0 0 1px var(--rule)}
.addr .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--pass);box-shadow:0 0 0 3px var(--pass-wash)}
.addr .dot.off{background:var(--ink-3);box-shadow:0 0 0 3px var(--rule)}
.addr .url{flex:1;min-width:0;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr .via{flex:none;color:var(--ink-3);font-size:12px}
.where{margin:-6px 2px 0;color:var(--ink-3);font-size:12px}
.where code{color:var(--ink-2)}
.listhead{margin:4px 2px -4px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}

/* 알림 — 한 줄 + ✕. 성공(ok)은 8초 뒤 저절로 사라지고(아래 가는 선이 줄어든다) 오류(bad)는 닫을 때까지 남는다 */
.flash{position:relative;display:flex;align-items:flex-start;gap:10px;padding:4px 4px 4px 10px;border-radius:10px;background:var(--sheet);box-shadow:var(--lift-sm);font-size:12.5px;overflow:hidden}
.flash.fresh{animation:pop .25s var(--ease)}
.flash .mk{flex:none;width:18px;height:18px;margin-top:6px;border-radius:50%;display:grid;place-items:center;background:var(--pass-wash);color:var(--pass)}
.flash.bad .mk{background:var(--bad-wash);color:var(--bad)}
.flash.info .mk{background:var(--well);color:var(--ink-2)}
.flash .t{flex:1;min-width:0;padding:6px 0;overflow-wrap:anywhere;white-space:pre-wrap;text-wrap:pretty}
.flash.bad .t{color:var(--bad);font-weight:500}
.flash .btn.icon{width:26px;height:26px;margin-top:3px}
.flash.ok::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--pass);opacity:.5;transform-origin:left;animation:drain 8s linear forwards;animation-delay:var(--age,0ms)}
@keyframes drain{to{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}

/* 카드 */
.card{position:relative;background:var(--sheet);border-radius:12px;box-shadow:0 0 0 1px var(--rule);transition:opacity .2s,box-shadow .2s}
.card.menu-open{z-index:3}
.card.dim{opacity:.52}
.card.live{box-shadow:0 0 0 1.5px var(--probe),0 0 0 4px var(--probe-wash)}
.sh{position:relative;padding:14px 14px 13px;display:grid;gap:11px}
.hit{position:absolute;inset:0;border:0;background:none;border-radius:12px;transition:background-color .15s}
.hit:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.hit:focus-visible{outline-offset:-2px}
.sh>:not(.hit){position:relative;pointer-events:none}
.sh .acts,.sh .acts *{pointer-events:auto}
.sh-top{display:flex;align-items:flex-start;gap:8px}
.chv{flex:none;margin:3px 0 0 -4px;color:var(--ink-3);transition:transform .15s var(--ease)}
.exp-on .chv{transform:rotate(90deg)}
.sh-name{flex:1;min-width:0}
.sh-name h2{margin:0;font-size:14.5px;line-height:1.3;font-weight:650;letter-spacing:-.005em;overflow-wrap:anywhere}
.meta{margin:1px 0 0;font-size:12px;color:var(--ink-3);text-wrap:pretty}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:36px;z-index:4;width:228px;background:var(--sheet);border-radius:12px;box-shadow:var(--lift-sm);padding:4px;display:flex;flex-direction:column;animation:pop .15s var(--ease)}
.menu button{height:34px;border:0;background:none;text-align:left;padding:0 10px;border-radius:8px;font-size:12.5px;display:flex;align-items:center;gap:8px;transition:background-color .12s}
.menu button:hover{background:var(--well)}
.menu button:active{background:var(--probe-wash)}
.menu button:disabled{opacity:.4;cursor:not-allowed;background:none}
.menu button .n{margin-left:auto;color:var(--ink-3)}
.menu .sep{margin:6px 10px 2px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.menu .rad{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--rule-strong);display:grid;place-items:center;flex:none}
.menu [aria-checked="true"] .rad{box-shadow:inset 0 0 0 1.5px var(--probe)}
.menu [aria-checked="true"] .rad::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--probe)}

/* 카드 요약 — 글 한 줄: [실패 n 칩] 성공 n · 안 돌림 n …… 규칙 a/b 다룸 */
.sumline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--ink-2)}
.sumline .none{color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700}
.chip.bad{background:var(--bad-wash);color:var(--bad)}
.chip.ok{background:var(--pass-wash);color:var(--pass)}
.cov{margin-left:auto;color:var(--ink-3);font-size:12px}

/* 수행 중 — 글 + 가는 진행선. 깜박이는 연출 없음 */
.prog{display:grid;gap:8px}
.prog .bar{height:3px;border-radius:2px;background:var(--rule-strong);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--probe);transition:width .4s var(--ease)}
.prog .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prog .big b{font-size:19px;line-height:1.2;font-weight:700;letter-spacing:-.018em}
.prog .big span{font-size:12.5px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.live-chip{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--probe-wash);color:var(--probe);font-size:11px;font-weight:600;vertical-align:2px}
.live-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* 시나리오 줄 */
.exp{border-radius:0 0 12px 12px;overflow:hidden;box-shadow:inset 0 1px 0 var(--rule)}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;min-height:48px;padding:9px 14px;border:0;border-top:1px solid var(--rule);border-radius:0;background:none;text-align:left;transition:background-color .12s}
.exp>.row:first-child{border-top:0}
.row:hover{background:var(--well)}
.row:active{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.row:focus-visible{outline-offset:-2px}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);opacity:.55;grid-row:1;align-self:start;margin-top:6px}
.row .dot.ok{background:var(--pass);opacity:1}
.row .dot.bad{background:var(--bad);opacity:1;box-shadow:0 0 0 3px var(--bad-wash)}
.row .dot.run{background:var(--probe);opacity:1;box-shadow:0 0 0 3px var(--probe-wash)}
.row .name{font-size:13px;font-weight:550;overflow-wrap:anywhere;grid-column:2}
.row .name small{color:var(--ink-3);font-size:inherit;font-weight:400}
.row .sub{grid-column:2;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.row .sub:empty{display:none}
.row .end{grid-column:3;grid-row:1/span 2;display:flex;align-items:center;gap:4px;color:var(--ink-3)}
.row.dimrow .name{color:var(--ink-2)}
.kind{padding:0 7px;border-radius:99px;font-size:11px;font-weight:500;background:var(--well);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.row .tag{padding:0 7px;border-radius:99px;font-size:10.5px;font-weight:600;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.row .tag.warn{color:var(--warn);background:var(--warn-wash);box-shadow:none}
.st{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{background:var(--pass-wash);color:var(--pass)}
.st.bad{background:var(--bad-wash);color:var(--bad)}
.st.run{background:var(--probe-wash);color:var(--probe)}
.st.wait{background:var(--well);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}

.rules{padding:11px 14px 12px;background:var(--well);box-shadow:inset 0 1px 0 var(--rule);display:grid;gap:2px}
.rules h3,.pick h3{margin:0 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.rules .link{display:flex;align-items:center;gap:6px}
.rules .link::after{content:"→";color:var(--ink-3)}
.rules .note{margin:4px 0 0;font-size:11.5px;color:var(--ink-3);text-wrap:pretty}
.pick{padding:10px 14px 12px;background:var(--well);box-shadow:inset 0 1px 0 var(--rule);display:grid;gap:2px}
.pick h3{margin-bottom:4px}
.pick label{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 6px;margin:0 -6px;border-radius:8px;cursor:pointer}
.pick label:hover{background:var(--sheet)}
.pick input{width:16px;height:16px;margin:0;accent-color:var(--probe)}
.pick .foot{display:flex;justify-content:flex-end;gap:6px;padding-top:8px}

/* 확인 상자 — 위험은 상태색(bad)만 */
.confirm{margin:0 12px 12px;padding:12px;border-radius:8px;background:var(--bad-wash);display:grid;gap:10px;font-size:12.5px}
.confirm.free{margin:0;border-radius:12px;box-shadow:0 0 0 1px color-mix(in srgb,var(--bad) 35%,transparent)}
.confirm b{display:block;color:var(--bad);font-size:13.5px;font-weight:650;margin-bottom:2px}
.confirm p{margin:0;color:var(--ink);text-wrap:pretty}
.confirm .acts{justify-content:flex-end}

/* 빈 화면 · 불러오는 중 · 오류 */
.empty{background:var(--sheet);border-radius:12px;box-shadow:0 0 0 1px var(--rule);padding:22px 16px 18px;display:grid;gap:18px}
.empty h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.018em;text-wrap:balance}
.empty .lead{margin:4px 0 0;color:var(--ink-2);font-size:12.5px;text-wrap:pretty}
.say{padding:12px 14px;border-radius:12px;background:var(--probe-wash);box-shadow:inset 0 0 0 1px var(--probe-ring)}
.say small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin-bottom:3px}
.say q{display:block;font-size:14.5px;font-weight:650;color:var(--probe);quotes:"\201C" "\201D";letter-spacing:-.005em}
.quiet-card{padding:14px;border-radius:12px;background:var(--sheet);box-shadow:0 0 0 1px var(--rule);color:var(--ink-2);font-size:12.5px}
.errcard{padding:14px;border-radius:12px;background:var(--bad-wash);box-shadow:0 0 0 1px color-mix(in srgb,var(--bad) 35%,transparent);display:grid;gap:10px;justify-items:start}
.errcard b{color:var(--bad);font-size:13.5px;font-weight:650}
.errcard p{margin:2px 0 0;color:var(--ink);font-size:12.5px;overflow-wrap:anywhere;text-wrap:pretty}
.foot-note{margin:0 2px;font-size:12px;color:var(--ink-3);text-wrap:pretty}

/* 상세 */
.dtop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.dtop .acts{flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.title h2{margin:0;font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-.018em;text-wrap:balance;overflow-wrap:anywhere}
.title p{margin:3px 0 0;color:var(--ink-2);font-size:12.5px}
.title p i{font-style:normal;color:var(--ink-3);margin:0 5px}
.warnbox{padding:9px 12px;border-radius:10px;background:var(--warn-wash);color:var(--warn);font-size:12.5px;font-weight:500;text-wrap:pretty;overflow-wrap:anywhere}
.warnbox.bad{background:var(--bad-wash);color:var(--bad)}
.sum{padding:14px;display:grid;gap:12px}
.sum-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sum-l{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;flex:1 1 220px;min-width:0}
.sum-l .when{font-size:12.5px;color:var(--ink-2)}
.cmp{font-size:12px;color:var(--ink-3);display:inline-flex;flex-wrap:wrap;gap:2px 8px}
.cmp>span+span::before{content:"·";margin-right:8px;color:var(--ink-3)}
.cmp b{font-weight:650}
.cmp .nf,.cmp .fx{color:var(--ink-2)}
.cmp .nf b{color:var(--bad)}
.cmp .fx b{color:var(--pass)}
.fail{padding:12px;border-radius:8px;background:var(--bad-wash);display:grid;gap:9px}
.fail .h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12.5px}
.fail .kd{padding:1px 8px;border-radius:99px;background:var(--bad);color:var(--sheet);font-size:11px;font-weight:650}
.fail .where2{color:var(--ink);font-weight:550;overflow-wrap:anywhere}
.fail pre{margin:0;padding:8px 10px;border-radius:6px;background:color-mix(in srgb,var(--sheet) 60%,transparent);color:var(--ink);font:11.5px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.fail .do{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.fail .do span{font-size:12px;color:var(--ink-2);flex:1;min-width:140px;text-wrap:pretty}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px 4px;font-size:14px;font-weight:650;letter-spacing:-.005em}
.sec-h small{font-size:12px;font-weight:400;color:var(--ink-3);text-align:right}
.scn{margin:0;padding:6px 14px 12px;list-style:none;counter-reset:n;display:grid;gap:7px}
.scn li{counter-increment:n;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;text-wrap:pretty;overflow-wrap:anywhere}
.scn li::before{content:counter(n);width:20px;height:20px;border-radius:50%;background:var(--well);box-shadow:inset 0 0 0 1px var(--rule);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-2);margin-top:1px}
.cl{display:inline-block;margin-right:6px;padding:0 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--well);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule);vertical-align:1px}
.cl.db{background:var(--probe-wash);color:var(--probe);box-shadow:none}
.dat{padding:4px 14px 12px;display:grid;gap:6px}
.dat .cap{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:12px;color:var(--ink-3)}
.dat .md{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.tw{overflow-x:auto;border-radius:8px;box-shadow:inset 0 0 0 1px var(--rule)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--well);color:var(--ink-3);font-size:11.5px;font-weight:600;text-align:left;padding:6px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--rule)}
td:first-child,th:first-child{color:var(--ink-3);width:1%}
details.how{box-shadow:inset 0 1px 0 var(--rule);font-size:12.5px;color:var(--ink-2)}
details.how summary{list-style:none;display:flex;align-items:center;gap:6px;padding:10px 14px;cursor:pointer;font-weight:600;border-radius:0 0 12px 12px;transition:background-color .12s}
details.how summary:hover{background:var(--well)}
details.how summary::-webkit-details-marker{display:none}
details.how summary .i{color:var(--ink-3);transition:transform .15s var(--ease)}
details.how[open] summary .i{transform:rotate(90deg)}
details.how ul{margin:0;padding:0 14px 12px 32px;display:grid;gap:4px;text-wrap:pretty}
.tl{padding:4px 0 8px}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 0;padding:6px 14px;background:var(--well);font-size:12px;font-weight:600;box-shadow:inset 0 1px 0 var(--rule),inset 0 -1px 0 var(--rule)}
.rowhead:first-child{margin-top:2px}
.step{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:6px 14px;font-size:12.5px}
.step::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:1px;background:var(--rule-strong)}
.step.first::before{top:17px}
.step.last::before{bottom:calc(100% - 17px)}

.node{position:relative;z-index:1;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--pass-wash);color:var(--pass);box-shadow:0 0 0 3px var(--sheet)}
.node .i{width:11px;height:11px;stroke-width:2.4}
.node.bad{background:var(--bad);color:var(--sheet)}
.node.db,.node.run{background:var(--probe-wash);color:var(--probe)}
.node.nr{background:var(--well);color:var(--ink-3);box-shadow:0 0 0 3px var(--sheet),inset 0 0 0 1px var(--rule-strong)}
.step .tx{padding-top:1px;min-width:0;text-wrap:pretty;overflow-wrap:anywhere}
.step .tx .sub{color:var(--ink-3)}
.step.is-bad .tx{font-weight:600}
.err{margin-top:4px;padding:6px 9px;border-radius:6px;background:var(--bad-wash);color:var(--bad);font:11.5px/1.5 var(--mono);overflow-wrap:anywhere;white-space:pre-wrap}
.nr-note{padding:4px 14px 14px;color:var(--ink-2);font-size:12.5px;text-wrap:pretty}
.stline{padding:6px 14px 2px;display:flex;align-items:center;gap:8px}
.hist{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 14px;border-top:1px solid var(--rule);font-size:12px}
.hist.first{border-top:0}
.hist .w{color:var(--ink-2)}
.hist .c{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--ink-2)}
.hist .c .f{color:var(--bad);font-weight:650}
.hist .c .z{color:var(--ink-3)}
.hists{padding-bottom:4px}

/* [환경] 팝업 — 규칙은 .interface-design/system.md. 위의 같은 토큰을 쓴다 */
:where(.dialog) button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;height:30px;padding:0 11px;border-radius:8px;white-space:nowrap}
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:5;color:var(--ink)}
.dialog{width:100%;max-width:468px;background:var(--sheet);border-radius:20px;box-shadow:var(--lift);overflow:hidden}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 4px 22px}
.dlg-head h2{margin:0;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.018em}
.dlg-head p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.dlg-close{flex:none;width:32px;height:32px;margin:-4px -6px 0 0;padding:0;justify-content:center;border:0;border-radius:10px;background:none;color:var(--ink-3);transition:background-color .15s,color .15s}
.dlg-close:hover{background:var(--well);color:var(--ink)}
.dlg-body{padding:14px 20px 20px;display:grid;gap:22px}
.dialog .addr{padding:6px 6px 6px 12px}
.dialog .addr button{flex:none;height:30px;padding:0 12px;border:0;border-radius:8px;background:var(--sheet);color:var(--probe);font-weight:600;box-shadow:0 0 0 1px var(--rule-strong);transition:transform .12s var(--ease),box-shadow .15s}
.dialog .addr button:hover{background:var(--sheet);box-shadow:0 0 0 1px var(--probe)}
.dialog .addr button:active{transform:scale(.97)}
.dialog .where{margin:8px 2px 0}
.dialog .where code{font-size:11.5px;color:var(--ink-2);background:none;border:0;padding:0}
.eyebrow{margin:0 0 10px 2px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.pgroup+.pgroup{margin-top:18px}
.pq{margin:0 2px 8px}
.pq b{display:block;font-size:14px;font-weight:650;letter-spacing:-.005em}
.pq span{display:block;color:var(--ink-2);font-size:12.5px;text-wrap:pretty}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;display:grid;gap:10px;height:auto;padding:12px;text-align:left;border:0;border-radius:12px;background:var(--well);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule);font-weight:400;white-space:normal;transition:transform .12s var(--ease),box-shadow .15s,background-color .15s}
.tile:hover{background:var(--well);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.tile:active{transform:scale(.985)}
.tile[aria-checked=true]{background:var(--probe-wash);box-shadow:inset 0 0 0 1.5px var(--probe),0 0 0 3px var(--probe-wash)}
.tile:focus-visible{outline:2px solid var(--probe);outline-offset:3px}
.tile .pic{display:grid;place-items:center;height:58px;border-radius:8px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-3)}
.tile[aria-checked=true] .pic{color:var(--probe)}
.tile .lab{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:650;font-size:13.5px}
.tile .desc{display:block;margin-top:1px;font-weight:400;font-size:12px;color:var(--ink-2);text-wrap:pretty}
.tile .tick{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--probe);color:var(--sheet);opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s var(--ease)}
.tile[aria-checked=true] .tick{opacity:1;transform:none}
.tile .tag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:99px;font-size:10.5px;font-weight:600;letter-spacing:.02em;background:var(--sheet);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule);vertical-align:1px}
.pfile{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--rule)}
.pfile .ico{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--well);color:var(--ink-2)}
.pfile .meta{flex:1;min-width:0;margin:0;color:var(--ink);font-size:inherit}
.pfile .meta b{display:block;font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfile .meta span{display:block;color:var(--ink-3);font-size:12px}
.pfile .quiet{height:30px;padding:0 11px;border:0;background:none;color:var(--ink-2);font-weight:600;transition:background-color .15s,color .15s,transform .12s var(--ease)}
.pfile .quiet:hover{background:var(--well);color:var(--ink)}
.pfile .quiet:active{transform:scale(.97)}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 22px;background:var(--well);box-shadow:inset 0 1px 0 var(--rule);color:var(--ink-3);font-size:12px}
.dlg-foot .saved{display:inline-flex;align-items:center;gap:6px;color:var(--pass);font-weight:600}
.dlg-foot .saved.bad{color:var(--bad)}
.dlg-foot .saved i{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--pass-wash)}
@media (max-width:470px){.tiles{grid-template-columns:1fr}.tile{grid-template-columns:76px 1fr;align-items:center}.tile .pic{height:52px}.dialog .addr .via{display:none}.pfile{flex-wrap:wrap}.hist{grid-template-columns:78px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.flash::after{display:none}}
</style>
</head>
<body>
<div id="app"><main><p class="quiet-card" role="status">불러오는 중…</p></main></div>
<script>
// UI 테스트 패널 — 두 화면: 목록(묶음 · 시나리오 줄) → 시나리오 상세(지난 수행 · 단계 · 실패 · 보강 · 다시 수행). 머리의 [환경] 은 팝업(연결 · 기본값 · 프로젝트 프롬프트).
// 서비스(service.mjs)에 service.call 로만 묻는다: list(json) · run · progress · stop · openFile · ask · prefs. 서비스가 이 프로젝트의 MCP 서버를 부른다 — 묶음 · 이력도 이 프로젝트 것만.
// 수행 중의 진행은 서비스가 밀어 보낸다(service.progress 소식) — 폴링하지 않는다. 스크린샷은 패널에 싣지 않는다 — 결과서에만 있다.
// [보강] · [AI 에게 맡기기] · 안 다룬 규칙 · [프롬프트 다시 만들기] 는 ask(새 대화에 요청 글을 바로 보낸다)로 — 고르기 · 고치기는 대화에서 스킬이 한다.
// 앱과는 통로로만 말한다: parent.postMessage({ litecode: 1, id, method, params })
// 겉모습 규칙(토큰 · 단추 · 카드 · 위계)은 .interface-design/system.md.

let seq = 0
const waiting = new Map()
addEventListener('message', (event) => {
  const data = event.data
  if (event.source === parent && data && data.litecode === 1 && data.event) return onEvent(data.event, data.data)
  if (event.source !== parent || !data || data.litecode !== 1 || !waiting.has(data.id)) return
  const done = waiting.get(data.id)
  waiting.delete(data.id)
  done(data)
})
function call(method, params) {
  const id = ++seq
  return new Promise((resolve, reject) => {
    waiting.set(id, (reply) => (reply.ok ? resolve(reply.result) : reject(new Error(reply.error))))
    parent.postMessage({ litecode: 1, id, method, params }, '*')
  })
}
/** 서비스의 메서드 — 서버 도구의 글을 그대로 돌려준다. 실패면 Error(글) */
const tool = (name, args = {}) => call('service.call', { name, params: args })
const ERRORS = { 'no-project': '열린 프로젝트가 없습니다', 'mcp-failed': '플러그인 서버를 띄우지 못했습니다', 'not-on': '이 프로젝트에서 UI 테스트가 꺼져 있습니다', 'service-off': 'UI 테스트 서비스가 꺼져 있습니다 — 설정 › 기능 › 플러그인에서 켜 주세요', 'service-failed': 'UI 테스트 서비스가 오류로 멈췄습니다', 'no-window': '설정 화면을 열 수 없습니다 — 이 플러그인 탭이 보일 때 눌러 주세요' }
const errorText = (error) => ERRORS[error?.message] || error?.message || String(error)

const state = {
  data: undefined, // list json
  error: '',
  view: { name: 'list' }, // { name: 'list' } | { name: 'detail', suite, id }
  menu: '', // 열린 [수행 ▾] 의 묶음
  open: new Set(), // 펼친 묶음 — 기본은 접힘
  picking: undefined, // { suite, chosen: Set }
  headed: false, // 기본값(환경 팝업에서 저장) — 기본은 화면 없이. 메뉴에서 이번만 바꿀 수 있다
  output: 'report', // 수행 뒤 산출물 기본값(환경 팝업): report(결과서만) | both(결과서 + 가이드)
  env: undefined, // 환경 팝업 { headed, saved }
  progress: undefined,
  message: '',
  messageTone: 'bad', // ok(성공 · 저절로 사라짐) | info | bad(오류 · 닫을 때까지)
  messageAt: 0,
  messageFile: '', // 메시지 옆 [열기] 로 열 파일(가이드)
  confirmDel: undefined, // 삭제 확인 중 { suite, id? } — id 가 없으면 묶음 전체
}
/** 다시 그린 뒤 포커스를 둘 곳(data-fk) — 다시 그려도 키보드 위치를 잃지 않게 */
let pendingFocus = ''

const pad = (n) => String(n).padStart(2, '0')
const when = (ms) => {
  const d = new Date(ms)
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`
  return d.toDateString() === new Date().toDateString() ? `오늘 ${time}` : `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${time}`
}
const sec = (ms) => `${((ms || 0) / 1000).toFixed(1)}초`
/** 만든 날짜 — 올해면 연도를 뺀다 */
const shortDate = (text) => String(text).replace(new RegExp(`^${new Date().getFullYear()}-`), '')

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(attrs)) {
    if (value === undefined || value === false) continue
    if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
    else node.setAttribute(key, value === true ? '' : value)
  }
  for (const child of children.flat(Infinity)) if (child !== undefined && child !== null && child !== false) node.append(child instanceof Node ? child : String(child))
  return node
}
/** 단추 — class 를 주지 않으면 기본 단추(.btn). 종류는 'btn primary' 처럼 붙인다 */
const btn = (label, onclick, attrs = {}) => el('button', { type: 'button', onclick, ...attrs, class: attrs.class ?? 'btn' }, label)

const ICONS = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  back: '<path d="m15 6-6 6 6 6"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  play: '<path d="M7 5v14l12-7z"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',
  flow: '<rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h4a3 3 0 0 1 3 3v4"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
}
function icon(name, size) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('class', 'i')
  svg.setAttribute('viewBox', '0 0 24 24')
  svg.setAttribute('aria-hidden', 'true')
  if (size) svg.style.cssText = `width:${size}px;height:${size}px`
  svg.innerHTML = ICONS[name]
  return svg
}
const iconBtn = (name, label, onclick, attrs = {}) => el('button', { type: 'button', onclick, ...attrs, class: attrs.class ?? 'btn' }, icon(name), label)

async function load() {
  try {
    state.data = JSON.parse(await tool('list', { json: true }))
    state.data.suites.sort((a, b) => latest(b) - latest(a))
    state.error = ''
    const view = state.view
    if (view.name === 'detail' && !findScenario(view.suite, view.id)) state.view = { name: 'list' }
  } catch (error) {
    state.error = errorText(error)
  }
  render()
}
/** 묶음의 최근 활동 시각 — 마지막 수행, 없으면 만든 날짜. 목록은 이 값이 큰(최신) 묶음부터 */
function latest(suite) {
  return Math.max(suite.runs[0]?.startedAt ?? 0, Date.parse(suite.created) || 0)
}
function findScenario(suiteId, id) {
  const suite = state.data?.suites.find((item) => item.id === suiteId)
  const item = suite?.scenarios.find((scenario) => scenario.id === id)
  return item ? { suite, item } : undefined
}

/** 알림을 띄운다 — 성공(ok)·안내(info)·오류(bad). 시각은 사라지는 선(drain)이 이어서 줄어들게 적어 둔다 */
function setMessage(text, tone = 'bad', file = '') {
  state.message = text
  state.messageTone = tone
  state.messageFile = file
  state.messageAt = Date.now()
}

/** 결과서 열기 — 프로젝트 안이면 오른쪽 패널의 파일 미리보기(HTML 20MB 까지), 밖(공유 드라이브)이면 경로만 보인다 */
async function openReport(report) {
  if (report.startsWith('/') || /^[A-Za-z]:/.test(report)) {
    setMessage(`결과서: ${report}`, 'info')
    return render()
  }
  await tool('openFile', { path: report }).catch((error) => (setMessage(errorText(error)), render()))
}

/** 가이드형 결과물 만들기 — 서버가 guide.html 을 쓰고 경로를 돌려준다. openNow 면 바로 연다, 아니면 메시지 옆 [열기] */
async function makeGuide(suite, run, openNow) {
  try {
    const text = await tool('guide', { suite, ...(run && { run }) })
    const file = /가이드:\s*(\S+)/.exec(text)?.[1]
    if (!file) throw new Error(text)
    if (openNow) return await openReport(file)
    flash('가이드를 만들었습니다', file)
  } catch (error) {
    setMessage(errorText(error))
  }
  render()
}
/** 알림 — 닫을 수 있다. 성공 안내(flash)는 몇 초 뒤 저절로 사라지고, 오류는 닫을 때까지 남는다 */
let flashTimer = 0
function flash(text, file = '') {
  setMessage(text, 'ok', file)
  clearTimeout(flashTimer)
  flashTimer = setTimeout(() => { if (state.message === text) clearMessage() }, 8000) // 그 사이 다른 메시지(오류)로 바뀌었으면 지우지 않는다
}
const clearMessage = () => (clearTimeout(flashTimer), (state.message = ''), (state.messageFile = ''), render())
function messageBox() {
  if (!state.message) return ''
  const tone = state.messageTone
  const age = Date.now() - state.messageAt // 다시 그려도 사라지는 선 · 나타나는 연출이 처음부터 다시 돌지 않게
  return el(
    'div',
    { class: `flash ${tone}${age < 400 ? ' fresh' : ''}`, role: tone === 'bad' ? 'alert' : 'status', style: `--age:-${age}ms` },
    el('span', { class: 'mk', 'aria-hidden': 'true' }, icon(tone === 'bad' ? 'x' : tone === 'info' ? 'doc' : 'check', 10)),
    el('span', { class: 't' }, state.message, state.messageFile ? [' ', btn('열기', () => openReport(state.messageFile), { class: 'link' })] : ''),
    btn(icon('x', 13), clearMessage, { class: 'btn ghost icon sm', 'aria-label': '알림 닫기' }),
  )
}

/** 진행을 받아 그린다 — 서비스가 밀어 보내거나(service.progress) 패널을 열 때 한 번 읽는다. 끝났으면 묶음 · 이력을 다시 읽는다 */
function applyProgress(progress) {
  const wasRunning = state.progress?.running
  state.progress = progress
  render()
  if (wasRunning && !progress?.running) {
    void load()
    // 산출물 기본값이 "결과서 + 가이드" 면 수행이 끝난 그 수행의 가이드도 만든다
    if (state.output === 'both' && progress?.suite && progress?.runId && !progress?.error) void makeGuide(progress.suite, progress.runId, false)
  }
}
async function refreshProgress() {
  try {
    applyProgress(JSON.parse(await tool('progress')))
  } catch {
    // 서버가 다시 뜨는 중
  }
}
/** 서비스 소식 — progress(수행 진행) · runError(수행 시작·진행 실패) */
function onEvent(event, data) {
  if (event === 'service.progress') return data?.stale ? void refreshProgress() : applyProgress(data)
  if (event === 'service.runError') {
    setMessage(data?.message ?? '')
    render()
  }
}

async function rerun(suite, scenarios) {
  state.menu = ''
  state.picking = undefined
  state.message = ''
  state.messageFile = ''
  const args = { suite, headed: state.headed, ...(scenarios && { scenarios }) }
  // 서비스가 수행을 시작하고 진행을 밀어 보낸다 — 여기서는 시작이 막혔을 때만 알린다
  tool('run', args).then(
    () => undefined,
    (error) => (setMessage(errorText(error)), render()),
  )
  render()
}
async function stop() {
  await tool('stop').catch(() => undefined)
}

/** 삭제 — 확인을 받은 뒤 서버의 delete(패널 전용 도구). 결과서 · 이력은 남는다 */
async function deleteNow() {
  const target = state.confirmDel
  if (!target) return
  state.confirmDel = undefined
  try {
    await tool('delete', { suite: target.suite, ...(target.id && { scenario: target.id }) })

/** 상태 → [글, 색] — 용어는 "안 돌림"(한 번도 안 돌렸거나 멈춘 것은 성공도 실패도 아니다) */
const TONE = { passed: ['성공', 'ok'], failed: ['실패', 'bad'], stopped: ['멈춤', 'wait'], none: ['안 돌림', 'wait'], running: ['수행 중', 'run'], waiting: ['대기', 'wait'], 'no-code': ['코드 없음', 'wait'] }

/** 규칙 덮임 — 검증 + 업무를 한 숫자로(어림값). 규칙이 없으면 undefined */
function coverageText(suite) {
  const c = suite.coverage
  const total = (c?.validation?.total ?? 0) + (c?.business?.total ?? 0)
  return total ? `규칙 ${(c.validation.covered ?? 0) + (c.business.covered ?? 0)}/${total} 다룸` : undefined
}

/** 카드 요약 — 글 한 줄: [실패 n 칩] 성공 n · 안 돌림 n …… 규칙 a/b 다룸 */
function summaryLine(suite) {
  const count = (status) => suite.scenarios.filter((item) => item.lastStatus === status).length
  const ok = count('passed')
  const bad = count('failed')
  const rest = suite.scenarios.length - ok - bad
  const lead = bad ? el('span', { class: 'chip bad' }, `실패 ${bad}`) : ok && !rest ? el('span', { class: 'chip ok' }, '모두 성공') : ''
  const tail = [ok && (bad || rest) && `성공 ${ok}`, rest && ok + bad && `안 돌림 ${rest}`].filter(Boolean)
  const cov = coverageText(suite)
  return el(
    'div',
    { class: 'sumline' },
    lead,
    tail.length ? el('span', {}, tail.join(' · ')) : '',
    !ok && !bad ? el('span', { class: 'none' }, suite.scenarios.length ? '아직 안 돌림' : '시나리오 없음') : '',
    cov ? el('span', { class: 'cov', title: 'AI 가 코드에서 뽑은 규칙 중 시나리오가 다루는 수(어림값, 코드 커버리지 아님)' }, cov) : '',
  )
}

  if (!state.env || state[key] === value) return
  const before = state[key]
  state[key] = value
  state.env.saved = ''
  state.env.focus = key
  render()
  try {

    state.headed = prefs.headed === true

    if (!state.env) return
    state.env.failed = false
    state.env.saved = '저장했습니다'
  } catch (error) {
    state[key] = before

    state.env.failed = true
    state.env.saved = errorText(error)

      pendingFocus = 'env'

    }
    if (state.menu) {
      pendingFocus = `menu:${state.menu}`
      state.menu = ''
      return render()

    if (state.confirmDel) return cancelDelete()
  }
  if (state.menu && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
    const items = [...document.querySelectorAll('.menu button:not(:disabled)')]
    if (!items.length) return
    event.preventDefault()
    const down = event.key === 'ArrowDown'
    const index = items.indexOf(document.activeElement)
    items[index < 0 ? (down ? 0 : items.length - 1) : (index + (down ? 1 : -1) + items.length) % items.length].focus()
  }
})

void (async () => {
  try { await call('events.subscribe', { events: ['service.progress', 'service.runError'] }) } catch { /* 권한 없음 */ }
  try {
    const prefs = await tool('prefs')
    state.headed = prefs.headed === true
    state.output = prefs.output === 'both' ? 'both' : 'report'
  } catch { /* 저장된 값 없음 — 화면 없이 · 결과서만 */ }
  await load()
  await refreshProgress()
})()
</script>
</body>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI 테스트</title>
<style>
/* 토큰 · 규칙은 .interface-design/system.md. 색은 여기 토큰으로만 쓰고 다크는 값만 바꾼다 */
:root{--paper:#eef0f4;--sheet:#ffffff;--well:#f5f6f9;--rule:rgba(20,28,46,.10);--rule-strong:rgba(20,28,46,.18);--ink:#141a29;--ink-2:#566077;--ink-3:#8a93a6;--probe:#2d4fd6;--probe-wash:#eef1fd;--probe-ring:rgba(45,79,214,.28);--pass:#167a3f;--pass-wash:#e4f5ea;--bad:#c0332b;--bad-wash:#fdecea;--bad-ring:rgba(192,51,43,.35);--warn:#8a5200;--warn-wash:#fff6e8;--on-fill:#ffffff;--scrim:rgba(18,22,30,.5);--lift:0 0 0 1px rgba(20,28,46,.06),0 2px 4px -1px rgba(20,28,46,.06),0 24px 48px -12px rgba(20,28,46,.28);--lift-sm:0 1px 2px rgba(20,28,46,.08),0 8px 20px -6px rgba(20,28,46,.22);--ease:cubic-bezier(.23,1,.32,1);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#0e1118;--sheet:#161b26;--well:#1b2130;--rule:rgba(255,255,255,.08);--rule-strong:rgba(255,255,255,.16);--ink:#e9ecf4;--ink-2:#a2abc0;--ink-3:#6e788f;--probe:#8fa4ff;--probe-wash:#1f2745;--probe-ring:rgba(143,164,255,.35);--pass:#63d28f;--pass-wash:#15301f;--bad:#f2928b;--bad-wash:#3a1e1c;--bad-ring:rgba(242,146,139,.4);--warn:#f0a53a;--warn-wash:rgba(240,165,58,.14);--on-fill:#0e1118;--scrim:rgba(0,0,0,.62);--lift:0 0 0 1px rgba(255,255,255,.08),0 24px 48px -12px rgba(0,0,0,.7);--lift-sm:0 1px 2px rgba(0,0,0,.4),0 8px 20px -6px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums;word-break:keep-all}
#app{display:flex;flex-direction:column;min-height:100%}
main{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 14px}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:11.5px}
:focus-visible{outline:2px solid var(--probe);outline-offset:2px}
svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 단추 — 기본 · pri(하는 일 하나) · tint(행동 안내) · ghost(투명) · danger(삭제 진입) · sbad(확인 상자 안의 삭제) · link(줄 안의 글자 단추) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;height:30px;padding:0 11px;border-radius:8px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule-strong);font-size:12.5px;font-weight:550;white-space:nowrap;transition:transform .12s var(--ease),background-color .12s,filter .12s}
.btn:hover{background:var(--well)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;background:var(--sheet)}
.btn.pri{background:var(--probe);color:var(--on-fill);box-shadow:none;font-weight:650}
.btn.pri:hover{background:var(--probe);filter:brightness(1.1)}
.btn.pri:disabled{background:var(--probe)}
.btn.tint{background:var(--probe-wash);color:var(--probe);box-shadow:inset 0 0 0 1px var(--probe-ring);font-weight:650}
.btn.tint:hover{background:var(--probe-wash);box-shadow:inset 0 0 0 1px var(--probe)}
.btn.tint:disabled{background:var(--probe-wash)}
.btn.ghost{background:none;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.btn.danger{background:none;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-ring)}
.btn.danger:hover{background:var(--bad-wash)}
.btn.sbad{background:var(--bad);color:var(--on-fill);box-shadow:none;font-weight:650}
.btn.sbad:hover{background:var(--bad);filter:brightness(1.08)}
.btn.back{padding-left:6px}
.link{border:0;background:none;color:var(--probe);font-size:12px;min-height:28px;padding:0 6px;border-radius:6px;display:inline-flex;align-items:center;white-space:nowrap}
.link:hover{text-decoration:underline;text-underline-offset:2px}
.link.dis{color:var(--ink-3);opacity:.55;cursor:not-allowed;text-decoration:none!important}
.ico{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);flex:none;transition:transform .12s var(--ease),background-color .12s,color .12s}
.ico:hover{color:var(--bad);background:var(--bad-wash)}
.ico.neutral:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.ico:active{transform:scale(.94)}
.ico:disabled{opacity:.45;cursor:not-allowed}
.ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* 머리 · 보기 · 검색 */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.018em;text-wrap:balance}
.top p{margin:2px 0 0;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--well);border-radius:8px;padding:2px;box-shadow:inset 0 0 0 1px var(--rule)}
.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:6px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--sheet);color:var(--ink);font-weight:650;box-shadow:0 0 0 1px var(--rule-strong)}
.search{flex:1;min-width:120px;height:34px;border:0;border-radius:8px;padding:0 10px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule-strong);color:var(--ink);font:inherit}
.search::placeholder{color:var(--ink-3)}

/* 목록 — 그룹 카드와 줄 */
.stack{display:grid;gap:12px}
.grp{background:var(--sheet);border-radius:12px;box-shadow:0 0 0 1px var(--rule);overflow:hidden}
.gh{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 4px}
.gt{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;text-align:left;padding:4px 6px;border-radius:8px;min-height:40px}
.gt:hover{background:var(--well)}
.chev{flex:none;width:14px;height:14px;display:grid;place-items:center;color:var(--ink-3);transition:transform .15s var(--ease)}
.chev::before{content:"";width:5px;height:5px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg)}
.gt[aria-expanded=true] .chev{transform:rotate(90deg)}
.gt .t{min-width:0;flex:1}
.gt .tt{display:block;font-size:14.5px;font-weight:650;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt .tt.rq{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;font-size:14px}
.gt small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sepv{width:1px;height:18px;background:var(--rule-strong);margin:0 2px;flex:none}
.rows{border-top:1px solid var(--rule)}
.r{display:grid;grid-template-columns:28px 14px minmax(0,1fr) auto;gap:8px;align-items:center;padding:0 12px 0 6px;min-height:42px;border-top:1px solid var(--rule);cursor:pointer}
.r:first-child{border-top:0}
.r:hover{background:var(--well)}
.r.on{background:var(--probe-wash)}
.r.nochk{grid-template-columns:14px minmax(0,1fr) auto;padding-left:14px}
.ck{display:grid;place-items:center;height:36px;cursor:pointer}
input[type=checkbox]{margin:0;width:16px;height:16px;accent-color:var(--probe)}
.nm{border:0;background:none;text-align:left;padding:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;border-radius:4px}
.r.f .nm{font-weight:650}
.when{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.when b{font-weight:650;color:var(--bad)}
.when .run-t{color:var(--probe);font-weight:650}
/* 상태 점 — 색 + 모양(✓ · ✕ · 빈 고리 · 도는 고리 · 옅은 고리) */
.dot{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;justify-self:center;flex:none;font-size:9px;line-height:1;font-weight:800;color:var(--on-fill)}
.dot.passed{background:var(--pass)}.dot.passed::before{content:"✓"}
.dot.failed{background:var(--bad)}.dot.failed::before{content:"✕"}
.dot.none{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.dot.queued{box-shadow:inset 0 0 0 1.5px var(--probe-ring)}
.dot.running{box-shadow:inset 0 0 0 1.5px var(--probe-ring);position:relative}
.dot.running::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--probe);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 질문 상자 — 파랑(실행) · 빨강(삭제) 두 가지만 */
.ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--rule);background:var(--probe-wash);font-size:12.5px}
.ask .q{flex:1 1 100%;color:var(--ink);text-wrap:pretty}
.ask .q b{display:block;font-size:13px;font-weight:650}
.ask.bad{background:var(--bad-wash)}.ask.bad .q b{color:var(--bad)}
.ask.inner{border-top:0;border-radius:8px}
.banner{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;border-radius:12px;font-size:12.5px;background:var(--sheet);box-shadow:var(--lift-sm)}
.banner .m{flex:1 1 160px;min-width:0;overflow-wrap:anywhere;text-wrap:pretty}.banner .m b{font-size:13px}
.banner.ok .m b{color:var(--pass)}
.banner.run{box-shadow:0 0 0 1.5px var(--probe),0 0 0 5px var(--probe-wash)}
.banner.err{background:var(--bad-wash);box-shadow:0 0 0 1px var(--bad-ring)}.banner.err .m b{color:var(--bad)}
.prog{flex:1 1 100%;height:3px;border-radius:3px;background:var(--probe-wash);overflow:hidden}.prog i{display:block;height:100%;background:var(--probe);transition:width .4s var(--ease)}
.empty{padding:28px 20px;text-align:center;color:var(--ink-2);text-wrap:pretty}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.empty .btn{margin-top:12px}
.quiet-card{padding:14px;border-radius:12px;background:var(--sheet);box-shadow:0 0 0 1px var(--rule);color:var(--ink-2);font-size:12.5px;margin:0}

/* 아래 막대 — 화면 아래에 붙는다 */
.dock{position:sticky;bottom:10px;margin:auto -4px 0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--sheet);box-shadow:0 0 0 1px var(--rule-strong),var(--lift-sm)}
.dock .q{flex:1 1 140px;font-size:12.5px;min-width:0}
.dock .q b{font-weight:650}
.dock.askrun{background:var(--probe-wash);box-shadow:0 0 0 1px var(--probe-ring),var(--lift-sm)}
.dock.askdel{background:var(--bad-wash);box-shadow:0 0 0 1px var(--bad-ring),var(--lift-sm)}
.dock.askdel .q b{color:var(--bad)}
.dock.askrun .q,.dock.askdel .q{flex:1 1 100%}

/* 상세 */
.card{background:var(--sheet);border-radius:12px;box-shadow:0 0 0 1px var(--rule);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.card h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em;display:flex;gap:8px;align-items:flex-start;text-wrap:balance;line-height:1.35;overflow-wrap:anywhere}
.card h3 .dot{margin-top:4px}
.meta{color:var(--ink-3);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta.wrap{white-space:normal;text-wrap:pretty}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.acts .end{margin-left:auto}
.sec{margin:4px 2px 0;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.stp{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:start;padding:9px 12px;border-top:1px solid var(--rule)}.stp:first-child{border-top:0}
.stp .dot{margin-top:3px}.stp.f .tx{font-weight:650}
.stp .tx{overflow-wrap:anywhere;text-wrap:pretty}
.rowhead{padding:6px 12px;background:var(--well);font-size:12px;font-weight:600;color:var(--ink-2);border-top:1px solid var(--rule)}
.rowhead:first-child{border-top:0}
.cmp{margin-top:4px;color:var(--bad);background:var(--bad-wash);padding:4px 8px;border-radius:6px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.fixes{display:flex;flex-wrap:wrap;gap:0 4px;margin-left:-6px}
.shotimg{display:block;max-width:100%;margin-top:6px;border-radius:8px;box-shadow:0 0 0 1px var(--rule)}
.hist{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:0 6px 0 12px;min-height:40px;border-top:1px solid var(--rule)}.hist:first-child{border-top:0}
.docs{display:flex;gap:2px;align-items:center}
.warnbox{padding:9px 12px;border-radius:10px;background:var(--warn-wash);color:var(--warn);font-size:12.5px;font-weight:500;text-wrap:pretty;overflow-wrap:anywhere}
.note{color:var(--ink-3);font-size:12px;text-wrap:pretty}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin:0 -6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:0s!important}.dot.running::after{animation:none;border-color:var(--probe)}}

/* 주소창 줄 — 환경 팝업의 연결 */
.addr{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--well);box-shadow:inset 0 0 0 1px var(--rule)}
.addr .live{flex:none;width:8px;height:8px;border-radius:50%;background:var(--pass);box-shadow:0 0 0 3px var(--pass-wash)}
.addr .live.off{background:var(--ink-3);box-shadow:0 0 0 3px var(--rule)}
.addr .url{flex:1;min-width:0;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr .via{flex:none;color:var(--ink-3);font-size:12px}
.where{margin:0;color:var(--ink-3);font-size:12px}
.where code{color:var(--ink-2)}
/* [환경] 팝업 — 규칙은 .interface-design/system.md. 위의 같은 토큰을 쓴다 */
:where(.dialog) button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;height:30px;padding:0 11px;border-radius:8px;white-space:nowrap}
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:5;color:var(--ink)}
.dialog{width:100%;max-width:468px;min-width:0;background:var(--sheet);border-radius:20px;box-shadow:var(--lift);overflow:hidden}
.dlg-head>div{min-width:0}.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 4px 22px}
.dlg-head h2{margin:0;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.018em}
.dlg-head p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.dlg-close{flex:none;width:32px;height:32px;margin:-4px -6px 0 0;padding:0;justify-content:center;border:0;border-radius:10px;background:none;color:var(--ink-3);transition:background-color .15s,color .15s}
.dlg-close:hover{background:var(--well);color:var(--ink)}
.dlg-body{padding:14px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.dialog .addr{padding:6px 6px 6px 12px}
.dialog .addr button{flex:none;height:30px;padding:0 12px;border:0;border-radius:8px;background:var(--sheet);color:var(--probe);font-weight:600;box-shadow:0 0 0 1px var(--rule-strong);transition:transform .12s var(--ease),box-shadow .15s}
.dialog .addr button:hover{background:var(--sheet);box-shadow:0 0 0 1px var(--probe)}
.dialog .addr button:active{transform:scale(.97)}
.dialog .where{margin:8px 2px 0}
.dialog .where code{font-size:11.5px;color:var(--ink-2);background:none;border:0;padding:0}
.eyebrow{margin:0 0 10px 2px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.pgroup+.pgroup{margin-top:18px}
.pq{margin:0 2px 8px}
.pq b{display:block;font-size:14px;font-weight:650;letter-spacing:-.005em}
.pq span{display:block;color:var(--ink-2);font-size:12.5px;text-wrap:pretty}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{position:relative;display:grid;gap:10px;height:auto;padding:12px;text-align:left;border:0;border-radius:12px;background:var(--well);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule);font-weight:400;white-space:normal;transition:transform .12s var(--ease),box-shadow .15s,background-color .15s}
.tile:hover{background:var(--well);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.tile:active{transform:scale(.985)}
.tile[aria-checked=true]{background:var(--probe-wash);box-shadow:inset 0 0 0 1.5px var(--probe),0 0 0 3px var(--probe-wash)}
.tile:focus-visible{outline:2px solid var(--probe);outline-offset:3px}
.tile .pic{display:grid;place-items:center;height:58px;border-radius:8px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-3)}
.tile[aria-checked=true] .pic{color:var(--probe)}
.tile .lab{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:650;font-size:13.5px}
.tile .desc{display:block;margin-top:1px;font-weight:400;font-size:12px;color:var(--ink-2);text-wrap:pretty}
.tile .tick{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--probe);color:var(--sheet);opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s var(--ease)}
.tile[aria-checked=true] .tick{opacity:1;transform:none}
.tile .tag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:99px;font-size:10.5px;font-weight:600;letter-spacing:.02em;background:var(--sheet);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule);vertical-align:1px}
.pfile{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--rule)}
.pfile .ico{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--well);color:var(--ink-2)}
.pfile .meta{flex:1;min-width:0;margin:0;color:var(--ink);font-size:inherit}
.pfile .meta{white-space:normal;overflow:visible;margin:0;color:var(--ink)}
.pfile .meta b{display:block;font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfile .meta span{display:block;color:var(--ink-3);font-size:12px}
.pfile .quiet{height:30px;padding:0 11px;border:0;background:none;color:var(--ink-2);font-weight:600;transition:background-color .15s,color .15s,transform .12s var(--ease)}
.pfile .quiet:hover{background:var(--well);color:var(--ink)}
.pfile .quiet:active{transform:scale(.97)}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 22px;background:var(--well);box-shadow:inset 0 1px 0 var(--rule);color:var(--ink-3);font-size:12px}
.dlg-foot .saved{display:inline-flex;align-items:center;gap:6px;color:var(--pass);font-weight:600}
.dlg-foot .saved.bad{color:var(--bad)}
.dlg-foot .saved i{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--pass-wash)}
@media (max-width:470px){.tiles{grid-template-columns:1fr}.tile{grid-template-columns:76px 1fr;align-items:center}.tile .pic{height:52px}.dialog .addr .via{display:none}.pfile{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="app"><main><p class="quiet-card" role="status">불러오는 중…</p></main></div>
<script>
// UI 테스트 패널 (0.7.0) — 시나리오가 유일한 단위. 목록(전체 · 화면별 · 요청별 + 검색) → 시나리오 상세(단계 · 최근 결과). 머리의 톱니는 [환경] 팝업(연결 · 기본값 · 프로젝트 프롬프트).
// 서비스(service.mjs)에 service.call 로만 묻는다(계약: README "패널 ↔ 서비스"): reindex · list · progress · run · stop · detail · delete · shot · guide · exportPdf · openFile · ask · prefs.
// 실행 중의 진행은 서비스가 밀어 보낸다(service.progress · service.runError 소식). 목록은 켜 둔 동안 15초마다 · 다시 보일 때 조용히 새로 읽는다(바뀐 게 있을 때만 다시 그림).
// 결과서 · 화면 가이드는 앱의 오른쪽 패널 파일 미리보기로 연다(openFile). 앱의 project.openFile 은 path · line 만 받아 `#s-<시나리오>` 앵커로는 바로 가지 못한다.
// 용어: 동작은 "실행", 한 번의 기록은 "수행". 사용자 글(제목 · 오류 · 요청 문장)은 늘 textContent 로만 넣는다(el 도우미).
// 앱과는 통로로만 말한다: parent.postMessage({ litecode: 1, id, method, params }). 겉모습 규칙은 .interface-design/system.md.

// <pure> — DOM 을 모르는 순수 로직(그룹 · 검색 · 상태 · 질문 흐름). tests/panel.test.ts 가 이 구간만 잘라 시험한다
const pad = (n) => String(n).padStart(2, '0')
/** 오늘 10:42 · 어제 17:20 · 11-08 14:30 */
function whenText(ms, now = Date.now()) {
  const d = new Date(ms)
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime()
  const diff = Math.round((day(new Date(now)) - day(d)) / 86400000)
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`
  return diff === 0 ? `오늘 ${time}` : diff === 1 ? `어제 ${time}` : `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${time}`
}
const dayText = (ms) => `${pad(new Date(ms).getMonth() + 1)}-${pad(new Date(ms).getDate())}`

const LABEL = { passed: '성공', failed: '실패', none: '실행 전', running: '실행 중', queued: '대기', stopped: '멈춤', 'no-code': '코드 없음' }
/** 서버 상태 → 점 모양(색 + 모양): 성공 ✓ · 실패 ✕ · 빈 고리 · 도는 고리 · 옅은 고리 */
const dotOf = (status) => (['passed', 'failed', 'running', 'queued'].includes(status) ? status : 'none')

/** 줄의 지금 상태 — 실행 중인 수행에 든 시나리오는 그 수행의 진행(도는 중 · 대기 · 방금 끝난 결과), 아니면 마지막 결과 */
function liveStatus(row, progress) {
  const item = progress?.running ? progress.cases?.find((c) => c.id === row.id) : undefined
  if (!item) return row.status ?? 'none'
  return item.status === 'running' ? 'running' : item.status === 'waiting' ? 'queued' : item.status
}

/** 줄 오른쪽 글 — 시각 · 실행 전 · 실행 중 · 대기. 실패는 굵게 표시할 수 있게 [강조, 나머지] 로 */
function whenParts(row, status, now = Date.now()) {
  if (status === 'running') return { kind: 'run', text: '실행 중' }
  if (status === 'queued') return { kind: 'plain', text: '대기' }
  const at = row.lastAt ? whenText(row.lastAt, now) : ''
  if (status === 'failed') return { kind: 'fail', lead: '실패', text: at }
  if (status === 'passed') return { kind: 'plain', text: at || '성공' }
  return { kind: 'plain', text: status === 'none' || !status ? '실행 전' : LABEL[status] ?? status }
}

/** 전체 목록의 순서 — 새 요청의 시나리오가 위, 같은 요청 안은 id 순(요청 없는 것은 맨 아래) */
function sortRows(rows, requests) {
  const at = (row) => (row.request && requests.get(row.request)?.at) || 0
  return [...rows].sort((a, b) => at(b) - at(a) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0))
}

/** 화면별 · 요청별 그룹 — 여러 화면에 걸친 시나리오는 그 화면마다 든다. 태그 없는 것은 끝의 이름 없는 그룹(loose: 실행 · 삭제 단추 없음) */
function buildGroups(view, rows, screens, requests) {
  if (view === 'all') return [{ key: 'all', rows }]
  const map = new Map()
  const loose = []
  for (const row of rows) {
    const keys = view === 'screen' ? row.screens : row.request ? [row.request] : []
    if (!keys.length) loose.push(row)
    for (const key of keys) map.set(key, [...(map.get(key) ?? []), row])
  }
  const groups = [...map].map(([key, list]) =>
    view === 'screen'
      ? { key, kind: 'screen', title: screens.get(key)?.name || key, route: key, rows: list, selector: { screen: key }, lastRun: screens.get(key)?.lastRun ?? null }
      : { key, kind: 'request', title: requests.get(key)?.text ?? key, at: requests.get(key)?.at ?? 0, rows: list, selector: { request: key }, lastRun: requests.get(key)?.lastRun ?? null },
  )
  groups.sort((a, b) => (view === 'screen' ? (b.lastRun?.at ?? 0) - (a.lastRun?.at ?? 0) || a.title.localeCompare(b.title) : b.at - a.at || (a.key < b.key ? 1 : -1)))
  if (loose.length) groups.push({ key: '', kind: view, loose: true, title: view === 'screen' ? '화면 미정' : '요청 없음', rows: loose })
  return groups
}

/** 검색 — 제목 · 화면 이름 · 라우트 · 요청 문장에서 */
function matches(row, query, screens, requests) {
  const q = query.trim().toLowerCase()
  if (!q) return true
  const hay = [row.title, ...row.screens.flatMap((route) => [screens.get(route)?.name ?? '', route]), row.request ? requests.get(row.request)?.text ?? '' : '']
  return hay.some((text) => text.toLowerCase().includes(q))
}
/** 그룹마다 보일 줄(shown) — 검색에 맞는 것. 맞는 줄이 없는 그룹은 뺀다 */
function showGroups(groups, query, screens, requests) {
  return groups.map((group) => ({ ...group, shown: group.rows.filter((row) => matches(row, query, screens, requests)) })).filter((group) => group.shown.length)
}

/** 삭제 확인 글에 쓰는 "다른 화면에도 걸친" 개수 */
const sharedCount = (rows) => rows.filter((row) => row.screens.length > 1).length
/** 실행 전 질문 — 시나리오가 1개뿐이면 묻지 않고 바로 */
const runPlan = (count) => (count < 2 ? 'now' : 'ask')
/** 결과서 방식의 미리 선택 — 마지막에 고른 것(prefs.report), 없으면 하나로 */
const preferredMode = (prefs) => (prefs?.report === 'each' ? 'each' : 'one')

/** 실행 배너 숫자 — 몇 개 중 몇 번째 · 진행선 너비(%) */
function runCount(progress) {
  const cases = progress?.cases ?? []
  const done = cases.filter((c) => !['waiting', 'running'].includes(c.status)).length
  return { total: cases.length, done, at: Math.min(done + 1, cases.length), percent: cases.length ? Math.min(100, Math.round(((done + (done < cases.length ? 0.5 : 0)) / cases.length) * 100)) : 0 }
}

/** 끝난 수행의 알림 글 */
function finishNote(progress) {
  const cases = progress?.cases ?? []
  const failed = cases.filter((c) => c.status === 'failed').length
  const reports = progress?.reports ?? []
  return {
    text: `${cases.length}개 실행을 마쳤습니다${failed ? ` — 실패 ${failed}개` : ''}`,
    detail: [progress?.stale?.length && `코드가 낡은 채로 실행한 것 ${progress.stale.length}개`, progress?.recorded === false && '기록은 남기지 못했습니다(결과서만 만들었습니다)', reports.length > 1 && '결과서는 시나리오마다 따로 만들었습니다 — 시나리오를 열어 최근 결과에서 봅니다'].filter(Boolean).join(' · '),
    report: reports.length === 1 ? reports[0] : undefined,
  }
}

/** 단계 제목 앞의 "1. " 는 번호를 직접 붙이므로 뗀다 */
const bareTitle = (title) => String(title).replace(/^\s*\d+[.)]?\s*/, '')
// </pure>

let seq = 0
const waiting = new Map()
addEventListener('message', (event) => {
  const data = event.data
  if (event.source === parent && data && data.litecode === 1 && data.event) return onEvent(data.event, data.data)
  if (event.source !== parent || !data || data.litecode !== 1 || !waiting.has(data.id)) return
  const done = waiting.get(data.id)
  waiting.delete(data.id)
  done(data)
})
function call(method, params) {
  const id = ++seq
  return new Promise((resolve, reject) => {
    waiting.set(id, (reply) => (reply.ok ? resolve(reply.result) : reject(new Error(reply.error))))
    parent.postMessage({ litecode: 1, id, method, params }, '*')
  })
}
/** 서비스의 메서드 — 서버 도구의 값을 그대로 넘겨준다. 실패면 Error(코드) */
const tool = (name, args = {}) => call('service.call', { name, params: args })
const ERRORS = { 'no-project': '열린 프로젝트가 없습니다', 'mcp-failed': '플러그인 서버를 띄우지 못했습니다', 'not-on': '이 프로젝트에서 UI 테스트가 꺼져 있습니다', 'service-off': 'UI 테스트 서비스가 꺼져 있습니다 — 설정 › 기능 › 플러그인에서 켜 주세요', 'service-failed': 'UI 테스트 서비스가 오류로 멈췄습니다', 'no-window': '이 플러그인 탭이 보일 때 눌러 주세요' }
const errorText = (error) => ERRORS[error?.message] || error?.message || String(error)
const PDF_ERRORS = {
  busy: '저장 창이 이미 열려 있습니다 — 닫고 다시 눌러 주세요',
  'export-limit': 'PDF 저장을 너무 자주 눌렀습니다 — 잠시 뒤 다시 눌러 주세요',
  'permission-missing': '이 플러그인에 프로젝트 권한이 없습니다 — 설정 › 기능 › 플러그인에서 권한을 허용해 주세요',
  'too-big': 'PDF 가 100MB 를 넘어 저장할 수 없습니다',
  'no-window': 'PDF 저장 창을 열 수 없습니다 — 이 플러그인 탭이 보일 때 눌러 주세요',
}

const state = {
  data: undefined, // { project, scenarioDir, reportDir, baseUrl, browser, rows, screens: Map, requests: Map }
  error: '', // 목록을 못 읽었다
  view: 'all', // all · screen · request
  query: '',
  folded: new Set(), // 접은 그룹 `view:key`
  picked: new Set(), // 전체 탭에서 고른 시나리오 id
  dock: '', // '' · run · del — 아래 막대가 묻는 중
  asking: undefined, // 그룹 머리 질문 { kind: 'run' | 'del', key }
  screen: { name: 'list' }, // list · detail { id } · doc { … }
  detail: undefined, // { id, loading, data, error }
  delOne: false, // 상세의 삭제 확인
  shots: new Map(), // 스크린샷 키 → { state: 'loading' | 'ok' | 'error', url }
  openShot: new Set(),
  moreResults: false,
  progress: undefined,
  notice: undefined, // { tone: 'ok' | 'err', text, detail?, report? }
  prefs: { headed: false, output: 'report', report: undefined },
  env: undefined, // 환경 팝업 { saved, failed, focus }
  noPdf: false, // 앱이 PDF 저장을 모른다(옛 앱)
  pdfBusy: false,
}
/** 다시 그린 뒤 포커스를 둘 곳(data-fk) */
let pendingFocus = ''
const busy = () => !!state.progress?.running

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(attrs)) {
    if (value === undefined || value === false) continue
    if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
    else node.setAttribute(key, value === true ? '' : value)
  }
  for (const child of children.flat(Infinity)) if (child !== undefined && child !== null && child !== false && child !== '') node.append(child instanceof Node ? child : String(child))
  return node
}
/** 단추 — class 를 주지 않으면 기본 단추(.btn). 종류는 'btn pri' 처럼 붙인다 */
const btn = (label, onclick, attrs = {}) => el('button', { type: 'button', onclick, ...attrs, class: attrs.class ?? 'btn' }, label)
const link = (label, onclick, attrs = {}) => btn(label, onclick, { class: 'link', ...attrs })
const ICONS = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8h5.8l.6-8"/>',
}
const ICON_BOX = { trash: '0 0 16 16' }
function icon(name, size) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', ICON_BOX[name] ?? '0 0 24 24')
  svg.setAttribute('aria-hidden', 'true')
  if (size) svg.style.cssText = `width:${size}px;height:${size}px`
  svg.innerHTML = ICONS[name]
  return svg
}
const iconBtn = (name, label, onclick, attrs = {}) => el('button', { type: 'button', onclick, class: 'ico', 'aria-label': label, title: label, ...attrs }, icon(name))
const dot = (status) => el('span', { class: `dot ${dotOf(status)}`, role: 'img', 'aria-label': LABEL[status] ?? LABEL.none })

// ── 불러오기 ──

/** 파일에 맞추고(reindex) 목록을 끝까지 읽는다 — 열 때와 [다시 불러오기] 만 reindex, 삭제 · 실행 뒤에는 목록만 */
async function load(reindex = false, quiet = false) {
  try {
    if (reindex) await tool('reindex').catch(() => undefined)
    let first
    const rows = []
    let cursor
    for (let page = 0; page < 500; page++) {
      const part = await tool('list', cursor ? { cursor } : {})
      first ??= part
      rows.push(...part.scenarios)
      cursor = part.cursor
      if (!cursor) break
    }
    const sig = JSON.stringify([rows, first.screens, first.requests])
    if (quiet && sig === state.sig) return
    state.sig = sig
    const screens = new Map((first.screens ?? []).map((item) => [item.route, item]))
    const requests = new Map((first.requests ?? []).map((item) => [item.id, item]))
    state.data = { project: first.project ?? '', scenarioDir: first.scenarioDir, reportDir: first.reportDir, baseUrl: first.baseUrl, browser: first.browser, rows: sortRows(rows, requests), screens, requests }
    state.error = ''
    const ids = new Set(rows.map((row) => row.id))
    for (const id of [...state.picked]) if (!ids.has(id)) state.picked.delete(id)
    if (!state.picked.size) state.dock = ''
    if (state.screen.name === 'detail' && !ids.has(state.screen.id)) state.screen = { name: 'list' }
  } catch (error) {
    if (quiet) return
    state.error = errorText(error)
  }
  render()
}
async function loadDetail(id) {
  state.detail = { id, loading: true }
  render()
  try {
    state.detail = { id, data: await tool('detail', { id }) }
  } catch (error) {
    state.detail = { id, error: errorText(error) }
  }
  if (state.screen.name === 'detail' && state.screen.id === id) render()
}

// ── 알림 · 진행 ──

const setNotice = (notice) => ((state.notice = notice), render())
const clearNotice = () => ((state.notice = undefined), render())
const failNotice = (error) => setNotice({ tone: 'err', text: errorText(error) })

function bannerNode() {
  const p = state.progress
  if (p?.running) {
    const { total, done, at, percent } = runCount(p)
    const each = p.mode === 'each'
    return el(
      'div',
      { class: 'banner run', role: 'status' },
      el('div', { class: 'm' }, el('b', {}, total ? `실행 중 · ${total}개 중 ${at}번째` : '실행을 시작하는 중…'), el('br'), total > 1 ? (each ? '끝나면 결과서가 시나리오마다 생깁니다.' : '끝나면 결과서 하나가 생깁니다.') : '끝나면 결과서가 생깁니다.', p.stale?.length ? ` 코드가 낡은 채로 실행합니다: ${p.stale.join(', ')}` : ''),
      btn('멈추기', stop),
      el('div', { class: 'prog', role: 'progressbar', 'aria-label': '실행 진행', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': done }, el('i', { style: `width:${percent}%` })),
    )
  }
  const n = state.notice
  if (!n) return ''
  const close = el('button', { type: 'button', class: 'ico neutral', onclick: clearNotice, 'aria-label': '알림 닫기', title: '알림 닫기' }, icon('x', 14))
  if (n.tone === 'err') return el('div', { class: 'banner err', role: 'alert' }, el('div', { class: 'm' }, el('b', {}, n.text), n.detail ? [el('br'), n.detail] : ''), close)
  return el('div', { class: 'banner ok', role: 'status' }, el('div', { class: 'm' }, el('b', {}, `✓ ${n.text}`), n.detail ? [el('br'), n.detail] : ''), n.report ? link('결과서 열기', () => openDoc({ kind: 'report', run: n.runId, file: n.report.file, scenario: n.report.scenario, title: n.title, at: n.at })) : '', close)
}

/** 진행을 받아 그린다 — 서비스가 밀어 보내거나(service.progress) 패널을 열 때 한 번 읽는다. 끝났으면 목록을 다시 읽고 알린다 */
function applyProgress(progress) {
  const was = state.progress?.running
  state.progress = progress
  if (was && !progress?.running) return finishRun(progress)
  render()
}
function finishRun(progress) {
  void load()
  if (state.screen.name === 'detail') void loadDetail(state.screen.id)
  if (!progress || progress.cases?.length === 0 || progress.error) {
    state.notice = progress?.error ? { tone: 'err', text: '실행이 끝까지 가지 못했습니다', detail: progress.error } : undefined
    return render()
  }
  const note = finishNote(progress)
  state.notice = { tone: 'ok', text: note.text, detail: note.detail, report: note.report, runId: progress.runId, title: progress.title, at: progress.startedAt }
  render()
  // 산출물 기본값이 "결과서 + 가이드" 면 끝난 수행의 가이드도 만든다
  if (state.prefs.output === 'both' && progress.runId) tool('guide', { run: progress.runId }).then(() => (state.screen.name === 'detail' ? loadDetail(state.screen.id) : undefined), (error) => failNotice(error))
}
async function refreshProgress() {
  try {
    applyProgress(await tool('progress'))
  } catch {
    // 서버가 다시 뜨는 중
  }
}
/** 서비스 소식 — progress(수행 진행) · runError(시작 · 진행 실패) */
function onEvent(event, data) {
  if (event === 'service.progress') return data?.stale ? void refreshProgress() : applyProgress(data)
  if (event === 'service.runError') {
    state.progress = undefined
    setNotice({ tone: 'err', text: '실행을 시작하지 못했습니다', detail: data?.message ?? '' })
  }
}

// ── 실행 · 삭제 ──

/** 시나리오 고르는 말(selector)로 실행 — 서비스가 시작하고 진행을 밀어 보낸다. 여럿이면 결과서 방식(mode)을 같이 보내고 기억한다 */
function startRun(selector, mode) {
  state.picked.clear()
  state.dock = ''
  state.asking = undefined
  state.notice = undefined
  state.progress = { running: true, cases: [] }
  tool('run', { ...selector, ...(mode && { report: mode }), headed: state.prefs.headed }).then(
    () => undefined,
    (error) => ((state.progress = undefined), failNotice(error)),
  )
  if (mode) {
    state.prefs.report = mode
    tool('prefs', { set: { report: mode } }).catch(() => undefined)
  }
  render()
}

  out.push(el('div', { class: 'tools' }, link('변경 요청', () => ask(changePrompt(row), false), { title: '새 대화의 입력창에 이 시나리오를 채워 엽니다 — 바꿀 내용을 이어 쓰고 보냅니다' }), link('보강', () => ask(enrichPrompt(row)), { title: '새 대화에서 빠진 확인 · 데이터 변형 제안을 받고 고릅니다' }), failed ? link('AI 에게 맡기기', () => ask(fixPrompt(row, info)), { title: '새 대화에서 실패 원인을 가르고, 낡은 테스트면 고칩니다' }) : ''))
  out.push(el('h2', { class: 'sec' }, '최근 결과'), el('div', { class: 'grp' }, resultList(info, row)))
  return out
}

/** 단계 목록 — 마지막 결과가 있으면 그 단계 상태, 없으면 원문 단계(실행 전). 데이터 표는 행마다 */
function stepList(info, row) {
  const latest = info.latest
  const nodes = []
  const stepNode = (no, title, st, key) => {
    const bad = st?.status === 'failed'
    const shotName = st?.failShot ?? st?.shot
    const showing = bad && shotName && state.openShot.has(`${key}:${shotName}`)
    return el(
      'div',
      { class: `stp${bad ? ' f' : ''}` },
      dot(bad ? 'failed' : st?.status === 'passed' || st?.status === 'db' ? 'passed' : 'none'),
      el('span', {}, el('span', { class: 'tx' }, `${no}. ${title}`, st?.status === 'db' ? ' · 대화에서만 확인' : ''), bad && st.error ? el('div', { class: 'cmp' }, st.error) : '', bad && shotName ? link(showing ? '스크린샷 닫기' : '스크린샷 보기', () => toggleShot(latest.run, shotName, `${key}:${shotName}`), { 'data-fk': `shot:${key}`, style: 'margin-left:-6px' }) : '', showing ? shotImage(`${latest.run}/${shotName}`) : ''),
    )
  }
  if (latest?.rows?.length) {
    for (const r of latest.rows) nodes.push(el('div', { class: 'rowhead' }, `${r.row}행 — ${r.label}`), ...r.steps.map((st, i) => stepNode(i + 1, bareTitle(st.title), st, `r${r.row}`)))
  } else {
    info.steps.forEach((step, i) => nodes.push(stepNode(step.no, step.text, latest?.steps?.[i], 's')))
  }
  if (latest?.error && !latest.steps.some((st) => st.error) && !latest.rows?.length) nodes.push(el('div', { class: 'stp f' }, dot('failed'), el('span', {}, el('div', { class: 'cmp', style: 'margin-top:0' }, latest.error))))
  return nodes
}
async function toggleShot(run, name, key) {
  if (state.openShot.has(key)) state.openShot.delete(key)
  else {
    state.openShot.add(key)
    const id = `${run}/${name}`
    if (!state.shots.has(id)) {
      state.shots.set(id, { state: 'loading' })
      render()
      try {
        state.shots.set(id, { state: 'ok', url: await tool('shot', { run, name }) })
      } catch {
        state.shots.set(id, { state: 'error' })
      }
    }
  }
  render()
}
function shotImage(id) {
  const shot = state.shots.get(id)
  if (!shot || shot.state === 'loading') return el('p', { class: 'note', role: 'status' }, '스크린샷을 불러오는 중…')
  if (shot.state === 'error') return el('p', { class: 'note' }, '스크린샷을 불러오지 못했습니다 — 정리로 지워졌을 수 있습니다.')
  return el('img', { class: 'shotimg', src: shot.url, alt: '실패한 순간의 화면' })
}

/** 최근 결과 — 줄마다 `화면 가이드 · 결과서`. 가이드를 만들지 않은 수행은 비활성(흐린 글자) */
function resultList(info, row) {
  const results = info.results ?? []
  if (!results.length) return el('div', { class: 'empty' }, '아직 실행한 적이 없습니다. [▶ 실행] 으로 처음 실행해 보세요.')
  const SHOW = 5
  const list = state.moreResults ? results : results.slice(0, SHOW)
  const nodes = list.map((item) => {
    const label = item.status === 'failed' ? el('b', { style: 'color:var(--bad)' }, '실패') : item.status === 'passed' ? '성공' : LABEL[item.status] ?? item.status
    const base = { run: item.run, scenario: row.id, title: row.title, at: item.at }
    const guide = item.guide
      ? link('화면 가이드', () => openDoc({ ...base, kind: 'guide', file: item.guide.file }))
      : el('span', { class: 'link dis', role: 'link', 'aria-disabled': 'true', title: '이 수행은 화면 가이드를 만들지 않았습니다' }, '화면 가이드')
    const report = item.report ? link('결과서', () => openDoc({ ...base, kind: 'report', file: item.report.file, anchor: item.report.anchor })) : el('span', { class: 'link dis', role: 'link', 'aria-disabled': 'true', title: '결과서 파일이 남아 있지 않습니다' }, '결과서')
    return el('div', { class: 'hist' }, dot(item.status), el('span', {}, whenText(item.at)), el('span', { class: 'when' }, label), el('span', { class: 'docs' }, guide, report))
  })
  if (results.length > SHOW && !state.moreResults) nodes.push(el('div', { class: 'hist', style: 'grid-template-columns:1fr;padding:0 6px' }, link(`이전 결과 ${results.length - SHOW}개 더 보기`, () => ((state.moreResults = true), render()))))
  return nodes
}

// ── 결과서 · 가이드 보기 자리 ──

function leaveDoc() {
  const back = state.screen.back
  state.notice = undefined
  if (back.name === 'detail') return ((state.screen = back), render(), scrollTo(0, 0))
  backToList()
  scrollTo(0, 0)
}
function docView() {
  const doc = state.screen
  const back = doc.back.name === 'detail' ? '‹ 시나리오' : '‹ 목록'
  const out = [el('div', {}, btn(back, leaveDoc, { class: 'btn ghost back', 'data-fk': 'back' }))]
  const banner = bannerNode()
  if (banner) out.push(banner)
  const guide = doc.kind === 'guide'
  const meta = [doc.at && `${whenText(doc.at)} 수행`, guide ? '화면 흐름 순서로 풀어 쓴 문서' : doc.anchor ? '여러 시나리오를 한 파일로 낸 결과서' : '실행 결과서', '앱 오른쪽의 미리보기에서 열었습니다'].filter(Boolean).join(' · ')
  out.push(
    el(
      'div',
      { class: 'card' },
      el('div', {}, el('h3', {}, el('span', {}, `${guide ? '화면 가이드' : '결과서'} · ${doc.title ?? ''}`)), el('div', { class: 'meta wrap' }, meta)),
      el('div', { class: 'acts' }, state.noPdf ? '' : btn(state.pdfBusy ? 'PDF 만드는 중…' : 'PDF 로 저장', () => savePdf(doc), { class: 'btn', disabled: state.pdfBusy, 'data-fk': 'pdf' }), btn('미리보기에서 다시 열기', () => tool('openFile', { path: doc.file }).catch((error) => failNotice(error)), { class: 'btn ghost' })),
      doc.anchor && !state.noPdf ? el('p', { class: 'note' }, 'PDF 는 이 수행의 결과서 전체입니다(시나리오마다 절이 이어집니다).') : '',
    ),
  )
  return out
}

// ── 환경 팝업 ──

/** 앱의 설정 폼을 연다 — 앱 통로는 설정 값을 읽기(settings.summary)와 폼 열기(settings.open)만 주고 쓰기는 없다. 값은 그 폼에서 고친다 */
async function openSettings() {
  try {
    await call('settings.open')
  } catch (error) {
    state.env.saved = errorText(error)
    state.env.failed = true
    render()

}
const openEnv = () => ((state.env = { saved: '', failed: false, focus: '' }), render())

/** 선택 타일의 도판 — 고르기 전에 무엇인지 보이게 그린 작은 그림 */

  report: '<svg width="64" height="40" viewBox="0 0 64 40" fill="none" aria-hidden="true"><rect x="9" y="5" width="46" height="30" rx="4" stroke="currentColor" stroke-width="1.6"/><path d="M9 13h46M9 21h46M9 28h46M28 13v22" stroke="currentColor" stroke-width="1.3" opacity=".6"/></svg>',

const svgSpan = (cls, markup) => { const node = el('span', { class: cls }); node.innerHTML = markup; return node }

/** 기본값 하나를 바로 저장한다 — 눌러서 고르면 끝(저장 단추 없음). 실패하면 되돌린다 */
async function savePref(key, value) {
  if (!state.env || state.prefs[key] === value) return
  const before = state.prefs[key]
  state.prefs[key] = value
  state.env.saved = ''
  state.env.focus = key
  render()
  try {
    const prefs = await tool('prefs', { set: { [key]: value } })
    state.prefs = { ...state.prefs, headed: prefs.headed === true, output: prefs.output === 'both' ? 'both' : 'report' }
    if (!state.env) return
    state.env.failed = false
    state.env.saved = '저장했습니다'
  } catch (error) {
    state.prefs[key] = before
    if (!state.env) return
    state.env.failed = true
    state.env.saved = errorText(error)
  }
  if (state.env && document.activeElement?.dataset?.pref === key) state.env.focus = key // 방향키로 옮긴 뒤 다시 그려도 포커스를 그 타일에 둔다
  render()
  const mark = state.env?.saved
  setTimeout(() => { if (state.env && state.env.saved === mark && !state.env.failed) { state.env.saved = ''; render() } }, 1800)
}

/** 선택 타일 모음 — 라디오 그룹(방향키로 옮기면 바로 저장) */
function tileGroup(key, label, options) {
  const current = state.prefs[key]
  const index = options.findIndex((option) => option.value === current)
  return el(
    'div',
    {
      class: 'tiles',
      role: 'radiogroup',
      'aria-label': label,
      onkeydown: (event) => {
        const step = ['ArrowRight', 'ArrowDown'].includes(event.key) ? 1 : ['ArrowLeft', 'ArrowUp'].includes(event.key) ? -1 : 0
        if (!step) return
        event.preventDefault()
        void savePref(key, options[(index + step + options.length) % options.length].value)
      },
    },
    options.map((option) =>
      el(
        'button',
        { type: 'button', class: 'tile', role: 'radio', 'aria-checked': String(option.value === current), tabindex: option.value === current ? '0' : '-1', 'data-pref': key, onclick: () => savePref(key, option.value) },
        svgSpan('pic', PICS[option.pic]),
        el('span', { class: 'lab' }, el('span', {}, option.title, option.tag ? el('span', { class: 'tag' }, option.tag) : '', el('span', { class: 'desc' }, option.desc)), svgSpan('tick', '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>')),
      ),
    ),
  )
}

function envDialog(data) {
  const close = () => ((state.env = undefined), (pendingFocus = 'env'), render())
  const env = state.env
  const dialog = el(
    'div',
    { class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dlg-title' },
    el('div', { class: 'dlg-head' }, el('div', {}, el('h2', { id: 'dlg-title' }, '환경'), el('p', {}, '이 프로젝트의 UI 테스트 설정')), el('button', { type: 'button', class: 'dlg-close', onclick: close, 'aria-label': '닫기' }, icon('x'))),
    el(
      'div',
      { class: 'dlg-body' },
      el(
        'section',
        { 'aria-label': '연결' },
        el('div', { class: 'addr' }, el('span', { class: `live${data.baseUrl ? '' : ' off'}`, title: data.baseUrl ? '대상 주소가 설정돼 있습니다' : '대상 주소가 설정돼 있지 않습니다' }), el('span', { class: 'url' }, data.baseUrl || '(대상 주소 설정 안 됨)'), el('span', { class: 'via' }, data.browser), btn('설정 열기 ↗', openSettings, { class: '' })),
        el('p', { class: 'where' }, '시나리오는 ', el('code', {}, data.scenarioDir), ' · 결과서는 ', el('code', {}, data.reportDir), ' 에 저장됩니다. 플러그인을 지우면 이 폴더(.litecode/plugins/ui-test)가 함께 지워집니다.'),
      ),
      el(
        'section',
        { 'aria-label': '실행 기본값' },
        el('p', { class: 'eyebrow' }, '실행 기본값 · 누르면 바로 저장'),
        el('div', { class: 'pgroup' }, el('div', { class: 'pq' }, el('b', {}, '브라우저 창'), el('span', {}, '실행할 때 창을 띄울지 정합니다.')), tileGroup('headed', '브라우저 창', [{ value: false, title: '화면 없이', tag: '기본', desc: '빠르고 방해 없이 돕니다', pic: 'hidden' }, { value: true, title: '보이게', desc: '직접 눈으로 보면서', pic: 'shown' }])),
        el('div', { class: 'pgroup' }, el('div', { class: 'pq' }, el('b', {}, '실행 뒤 산출물'), el('span', {}, '화면 가이드는 화면 흐름 순서로 풀어 쓴 문서(실패 포함)예요. 상세의 최근 결과에서 이 수행에 만들었는지 볼 수 있어요.')), tileGroup('output', '실행 뒤 산출물', [{ value: 'report', title: '결과서만', desc: '성공 · 실패를 표로 모아서', pic: 'report' }, { value: 'both', title: '결과서 + 화면 가이드', desc: '화면 흐름대로 풀어서도', pic: 'guide' }])),
      ),
      el(
        'section',
        { 'aria-label': '프로젝트 프롬프트' },
        el('p', { class: 'eyebrow' }, '프로젝트 프롬프트'),
        el(
          'div',
          { class: 'pfile' },
          svgSpan('ico', '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>'),
          el('div', { class: 'meta' }, el('b', {}, promptPath()), el('span', {}, 'AI가 참고하는 이 프로젝트의 테스트 방법')),
          el('div', { style: 'display:flex;gap:2px' }, btn('열기', () => tool('openFile', { path: promptPath() }).catch(() => ((env.failed = true), (env.saved = '아직 없습니다 — 대화에서 UI 테스트를 처음 요청하면 만들어집니다'), render())), { class: 'quiet' }), btn('다시 만들기', () => (close(), ask(rebuildPrompt())), { class: 'quiet' })),
        ),
      ),
    ),
    el('div', { class: 'dlg-foot' }, el('span', {}, '설정은 이 프로젝트에만 적용돼요'), env.saved ? el('span', { class: `saved${env.failed ? ' bad' : ''}`, role: 'status' }, env.failed ? '' : svgSpan('', '<i><svg width="9" height="9" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>'), env.saved) : ''),
  )
  return el('div', { class: 'scrim', onclick: (event) => event.target === event.currentTarget && close() }, dialog)
}

// ── 그리기 ──

function render() {
  const app = document.getElementById('app')
  const data = state.data
  const active = document.activeElement
  const keep = active?.dataset?.fk // 다시 그려도 키보드가 있던 자리를 잃지 않게
  const caret = active === searchEl ? [searchEl.selectionStart, searchEl.selectionEnd] : undefined
  const main = el('main')
  if (!data) {
    main.append(topBar(), state.error ? el('div', { class: 'banner err', role: 'alert' }, el('div', { class: 'm' }, el('b', {}, '시나리오 목록을 불러오지 못했습니다'), el('br'), Object.values(ERRORS).includes(state.error) ? state.error : '서비스가 응답하지 않았습니다. 잠시 뒤 다시 불러오세요. 계속 안 되면 플러그인을 껐다 켜 보세요.'), btn('다시 불러오기', () => load(true))) : el('p', { class: 'quiet-card', role: 'status' }, '불러오는 중…'))
  } else if (state.screen.name === 'detail' && state.data.rows.some((row) => row.id === state.screen.id)) main.append(...detailView())
  else if (state.screen.name === 'doc' && state.screen.back) main.append(...docView())
  else main.append(topBar(data), tabs(), el('div', { id: 'body', class: 'stack' }, listBody()), dockNode())
  const scroll = scrollY
  app.replaceChildren(main, ...(state.env && data ? [envDialog(data)] : []))
  scrollTo(0, scroll)
  if (state.env?.focus) {
    app.querySelector(`[data-pref="${state.env.focus}"][aria-checked="true"]`)?.focus()
    state.env.focus = ''
  } else {
    const key = pendingFocus || keep
    const target = key && [...app.querySelectorAll('[data-fk]'), searchEl].find((node) => node.dataset.fk === key)
    target?.focus({ preventScroll: true })
    if (caret && target === searchEl) searchEl.setSelectionRange(caret[0], caret[1])
  }
  pendingFocus = ''
}

addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return
  if (state.env) return ((state.env = undefined), (pendingFocus = 'env'), render())
  if (state.dock) return ((state.dock = ''), (pendingFocus = 'dock:run'), render())
  if (state.asking) {
    const { kind, key } = state.asking
    state.asking = undefined
    pendingFocus = `${kind === 'run' ? 'run' : 'del'}:${key}`
    return render()
  }
  if (state.delOne) return ((state.delOne = false), (pendingFocus = 'del'), render())
})

void (async () => {
  try { await call('events.subscribe', { events: ['service.progress', 'service.runError'] }) } catch { /* 권한 없음 */ }
  try {
    const prefs = await tool('prefs')
    state.prefs = { headed: prefs.headed === true, output: prefs.output === 'both' ? 'both' : 'report', report: prefs.report }
  } catch { /* 저장된 값 없음 — 화면 없이 · 결과서만 */ }
  await load(true)
  await refreshProgress()
})()

// 켜 둔 동안 15초마다, 그리고 다시 보일 때 — 파일이 바깥에서 바뀐 것(AI 가 저장한 시나리오 등)을 조용히 반영한다.
// 팝업 · 질문 줄이 열려 있거나 실행 중이거나 숨겨져 있으면 건너뛴다.
let refreshing = false
async function quietRefresh() {
  if (refreshing || document.hidden || state.env || state.asking || state.progress?.running) return
  refreshing = true
  try { await load(true, true) } finally { refreshing = false }
}
setInterval(quietRefresh, 15000)
document.addEventListener('visibilitychange', () => void quietRefresh())
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>UI 테스트</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--raise:#f6f7f9;--text:#171b22;--sub:#5f6672;--faint:#8a919d;--line:#e4e7ec;--line2:#d3d8e0;--ok:#17803d;--ok-bg:#e5f5eb;--bad:#c0332b;--bad-bg:#fdecea;--accent:#2f4fd8;--accent-bg:#eaeefc;--on-accent:#fff;--idle-bg:#eef0f4;--warn:#8a5200;--warn-bg:#fff6e8;--scrim:rgba(18,22,30,.5)}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1b1f26;--raise:#20252d;--text:#e7eaf0;--sub:#b0b6c1;--faint:#8a909c;--line:#2a303a;--line2:#363e4b;--ok:#5fd08a;--ok-bg:#16301f;--bad:#f2928b;--bad-bg:#3a1e1c;--accent:#8ea2ff;--accent-bg:#222a48;--on-accent:#14161a;--idle-bg:#242a34;--warn:#f0a53a;--warn-bg:rgba(240,165,58,.14);--scrim:rgba(0,0,0,.62);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
main{display:flex;flex-direction:column;gap:12px;padding:12px;min-height:100%}
svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
code{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:0 5px}
button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--text);white-space:nowrap}
button:hover{background:var(--raise)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover{filter:brightness(1.07)}
button.ghost{border-color:transparent;background:transparent;color:var(--sub)}
button.ghost:hover{background:var(--raise);color:var(--text)}
button.link{border:0;background:none;color:var(--accent);padding:0;height:auto;font-size:12px}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line2))}
button.danger:hover{background:var(--bad-bg)}
button.solid-danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.confirm{border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));background:var(--bad-bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.confirm b{font-size:13px}
button.small{height:26px;padding:0 9px;font-size:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.pill{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px;color:var(--accent);background:var(--accent-bg)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.back{padding:0 8px 0 2px;border-color:transparent;background:none;color:var(--sub)}
.info{display:flex;gap:6px;flex-wrap:wrap;color:var(--sub);font-size:12px}
.chip{background:var(--raise);border:1px solid var(--line);border-radius:99px;padding:1px 9px;overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.card.on{border-color:var(--accent)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 10px}
.card-head h2{margin:0;font-size:14px}
.sub{font-size:12px;color:var(--sub);overflow-wrap:anywhere}
.faint{color:var(--faint)}
.sec-t{padding:9px 12px;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.04em;background:var(--raise);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.card>.sec-t:first-child{border-top:0}
.toggle{display:flex;gap:8px;align-items:flex-start;text-align:left;border:0;background:none;padding:0;height:auto;min-width:0;flex:1;color:inherit;font-weight:400;white-space:normal}
.toggle:hover{background:none}
.toggle .chv{margin-top:3px;color:var(--faint);transition:transform .12s}
.toggle[aria-expanded=true] .chv{transform:rotate(90deg)}
.scn-steps{margin:0;padding:10px 14px 10px 36px;display:flex;flex-direction:column;gap:6px}
.scn-steps li{padding-left:2px}
.scn-steps .chip2{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;background:var(--idle-bg);color:var(--sub);margin-right:6px}
.scn-steps .chip2.db{background:var(--accent-bg);color:var(--accent)}
.tblwrap{overflow-x:auto;padding:0 12px 12px}
.tbl{border-collapse:collapse;font-size:12px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 9px;text-align:left;overflow-wrap:anywhere}
.tbl th{background:var(--raise);color:var(--sub);font-weight:600}
details.how{padding:0 12px 12px;font-size:12px;color:var(--sub)}
details.how summary{cursor:pointer;padding:6px 0}
details.how ul{margin:2px 0 0;padding-left:18px}
.bar{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--idle-bg);margin:0 12px 10px}
.bar>i{display:block;height:100%}.bar .p{background:var(--ok)}.bar .f{background:var(--bad)}.bar .r{background:var(--accent)}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;height:auto;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 12px;font-weight:400;background:var(--card)}
.row:hover{background:var(--raise)}
.row .name{font-weight:500;overflow-wrap:anywhere}
.row .right{display:flex;align-items:center;gap:6px;color:var(--faint);flex-wrap:wrap;justify-content:flex-end}
.kind{margin-left:6px;font-size:11px;color:var(--sub);background:var(--raise);border:1px solid var(--line);padding:0 6px;border-radius:5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}.dot.run{background:var(--accent)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--ok-bg);color:var(--ok)}.bad{background:var(--bad-bg);color:var(--bad)}.run{background:var(--accent-bg);color:var(--accent)}.wait{background:var(--idle-bg);color:var(--sub)}
.tag{font-size:10.5px;padding:0 7px;border-radius:99px;border:1px solid var(--line);color:var(--faint);white-space:nowrap}
.tag.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.line{font-size:12px;color:var(--sub);padding:0 12px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rules{font-size:11.5px;color:var(--faint);padding:8px 12px 10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cov{font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:34px;width:210px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.16);padding:4px;display:flex;flex-direction:column;z-index:2}
.menu button{height:32px;border:0;background:transparent;text-align:left;padding:0 10px;border-radius:7px}
.menu button:hover{background:var(--raise)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.pick{display:flex;flex-direction:column;gap:4px;padding:8px 12px;border-top:1px solid var(--line)}
.pick label{display:flex;gap:8px;align-items:center}
.pick .foot{display:flex;justify-content:space-between;gap:8px;padding-top:4px}
.msg{padding:9px 11px;border-radius:9px;font-size:12.5px;overflow-wrap:anywhere;white-space:pre-wrap;background:var(--card);border:1px solid var(--line)}
.msg.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.msg.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.note{margin:0;font-size:11.5px;color:var(--faint)}
.title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.3;overflow-wrap:anywhere}
.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;flex-wrap:wrap}
.summary .big{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fail-box{margin:0 12px 12px;background:var(--bad-bg);border-radius:9px;padding:9px 11px;font-size:12px;display:flex;flex-direction:column;gap:6px}
.fail-box .k{color:var(--bad);font-weight:600}
.steps{padding:6px 0}
.step{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:8px 12px;font-size:12.5px}
.step::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:1px;background:var(--line2)}
.step:first-child::before{top:20px}.step:last-child::before{bottom:calc(100% - 20px)}.step:only-child::before{display:none}
.node{position:relative;z-index:1;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--ok-bg);color:var(--ok)}
.node.bad{background:var(--bad);color:#fff}.node.db{background:var(--accent-bg);color:var(--accent)}.node.nr{background:var(--idle-bg);color:var(--faint)}.node.run{background:var(--accent-bg);color:var(--accent)}
.err{margin-top:5px;font-size:11.5px;color:var(--bad);overflow-wrap:anywhere}
.rowhead{padding:7px 12px;border-top:1px solid var(--line);font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.sec-t+.hist{border-top:0}
.hist{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;padding:8px 12px;border-top:1px solid var(--line)}
.empty{padding:12px;font-size:12px;color:var(--sub)}
/* [환경] 팝업 — 규칙은 .interface-design/system.md. 토큰은 .scrim 안에만 둔다(패널 나머지와 섞이지 않게) */
.scrim{--sheet:#fff;--well:#f5f6f9;--rule:rgba(20,28,46,.10);--rule-strong:rgba(20,28,46,.18);--ink:#141a29;--ink-2:#566077;--ink-3:#8a93a6;--probe:#2d4fd6;--probe-wash:#eef1fd;--pass:#167a3f;--pass-wash:#e4f5ea;--lift:0 0 0 1px rgba(20,28,46,.06),0 2px 4px -1px rgba(20,28,46,.06),0 24px 48px -12px rgba(20,28,46,.28);position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:5;color:var(--ink)}
@media (prefers-color-scheme:dark){.scrim{--sheet:#161b26;--well:#1b2130;--rule:rgba(255,255,255,.08);--rule-strong:rgba(255,255,255,.16);--ink:#e9ecf4;--ink-2:#a2abc0;--ink-3:#6e788f;--probe:#8fa4ff;--probe-wash:#1f2745;--pass:#63d28f;--pass-wash:#15301f;--lift:0 0 0 1px rgba(255,255,255,.08),0 24px 48px -12px rgba(0,0,0,.7)}}
.dialog{width:100%;max-width:468px;background:var(--sheet);border-radius:20px;box-shadow:var(--lift);overflow:hidden}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 4px 22px}
.dlg-head h2{margin:0;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.018em}
.dlg-head p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.dlg-close{flex:none;width:32px;height:32px;margin:-4px -6px 0 0;padding:0;justify-content:center;border:0;border-radius:10px;background:none;color:var(--ink-3);transition:background-color .15s,color .15s}
.dlg-close:hover{background:var(--well);color:var(--ink)}
.dlg-body{padding:14px 20px 20px;display:grid;gap:22px}
.addr{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--well);box-shadow:inset 0 0 0 1px var(--rule)}
.addr .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--pass);box-shadow:0 0 0 3px var(--pass-wash)}
.addr .dot.off{background:var(--ink-3);box-shadow:0 0 0 3px var(--rule)}
.addr .url{flex:1;min-width:0;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr .via{flex:none;color:var(--ink-3);font-size:12px}
.addr button{flex:none;height:30px;padding:0 12px;border:0;border-radius:8px;background:var(--sheet);color:var(--probe);font-weight:600;box-shadow:0 0 0 1px var(--rule-strong);transition:transform .12s cubic-bezier(.23,1,.32,1),box-shadow .15s}
.addr button:hover{background:var(--sheet);box-shadow:0 0 0 1px var(--probe)}
.addr button:active{transform:scale(.97)}
.where{margin:8px 2px 0;color:var(--ink-3);font-size:12px}
.where code{font-size:11.5px;color:var(--ink-2);background:none;border:0;padding:0}
.eyebrow{margin:0 0 10px 2px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.pgroup+.pgroup{margin-top:18px}
.pq{margin:0 2px 8px}
.pq b{display:block;font-size:14px;font-weight:650;letter-spacing:-.005em}
.pq span{display:block;color:var(--ink-2);font-size:12.5px;text-wrap:pretty}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;display:grid;gap:10px;height:auto;padding:12px;text-align:left;border:0;border-radius:12px;background:var(--well);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule);font-weight:400;white-space:normal;transition:transform .12s cubic-bezier(.23,1,.32,1),box-shadow .15s,background-color .15s}
.tile:hover{background:var(--well);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.tile:active{transform:scale(.985)}
.tile[aria-checked=true]{background:var(--probe-wash);box-shadow:inset 0 0 0 1.5px var(--probe),0 0 0 3px var(--probe-wash)}
.tile:focus-visible{outline:2px solid var(--probe);outline-offset:3px}
.tile .pic{display:grid;place-items:center;height:58px;border-radius:8px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-3)}
.tile[aria-checked=true] .pic{color:var(--probe)}
.tile .lab{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:650;font-size:13.5px}
.tile .desc{display:block;margin-top:1px;font-weight:400;font-size:12px;color:var(--ink-2);text-wrap:pretty}
.tile .tick{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--probe);color:var(--sheet);opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s cubic-bezier(.23,1,.32,1)}
.tile[aria-checked=true] .tick{opacity:1;transform:none}
.tag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:99px;font-size:10.5px;font-weight:600;letter-spacing:.02em;background:var(--sheet);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule);vertical-align:1px}
.pfile{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--rule)}
.pfile .ico{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--well);color:var(--ink-2)}
.pfile .meta{flex:1;min-width:0}
.pfile .meta b{display:block;font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfile .meta span{display:block;color:var(--ink-3);font-size:12px}
.pfile .quiet{height:30px;padding:0 11px;border:0;background:none;color:var(--ink-2);font-weight:600;transition:background-color .15s,color .15s,transform .12s cubic-bezier(.23,1,.32,1)}
.pfile .quiet:hover{background:var(--well);color:var(--ink)}
.pfile .quiet:active{transform:scale(.97)}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 22px;background:var(--well);box-shadow:inset 0 1px 0 var(--rule);color:var(--ink-3);font-size:12px}
.dlg-foot .saved{display:inline-flex;align-items:center;gap:6px;color:var(--pass);font-weight:600}
.dlg-foot .saved.bad{color:var(--bad)}
.dlg-foot .saved i{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--pass-wash)}
@media (max-width:470px){.tiles{grid-template-columns:1fr}.tile{grid-template-columns:76px 1fr;align-items:center}.tile .pic{height:52px}.addr .via{display:none}.pfile{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><main><div class="msg">불러오는 중…</div></main></div>
<script>
// UI 테스트 패널 — 두 화면: 목록(묶음 · 시나리오 줄) → 시나리오 상세(지난 수행 · 단계 · 실패 · 보강 · 다시 수행). 머리의 [환경] 은 팝업(연결 · 기본값 · 프로젝트 프롬프트).
// 서비스(service.mjs)에 service.call 로만 묻는다: list(json) · run · progress · stop · openFile · ask · prefs. 서비스가 이 프로젝트의 MCP 서버를 부른다 — 묶음 · 이력도 이 프로젝트 것만.
// 수행 중의 진행은 서비스가 밀어 보낸다(service.progress 소식) — 폴링하지 않는다. 스크린샷은 패널에 싣지 않는다 — 결과서에만 있다.
// [보강] · [AI 에게 맡기기] · 안 다룬 규칙 · [프롬프트 다시 만들기] 는 ask(새 대화에 요청 글을 바로 보낸다)로 — 고르기 · 고치기는 대화에서 스킬이 한다.
// 앱과는 통로로만 말한다: parent.postMessage({ litecode: 1, id, method, params })

let seq = 0
const waiting = new Map()
addEventListener('message', (event) => {
  const data = event.data
  if (event.source === parent && data && data.litecode === 1 && data.event) return onEvent(data.event, data.data)
  if (event.source !== parent || !data || data.litecode !== 1 || !waiting.has(data.id)) return
  const done = waiting.get(data.id)
  waiting.delete(data.id)
  done(data)
})
function call(method, params) {
  const id = ++seq
  return new Promise((resolve, reject) => {
    waiting.set(id, (reply) => (reply.ok ? resolve(reply.result) : reject(new Error(reply.error))))
    parent.postMessage({ litecode: 1, id, method, params }, '*')
  })
}
/** 서비스의 메서드 — 서버 도구의 글을 그대로 돌려준다. 실패면 Error(글) */
const tool = (name, args = {}) => call('service.call', { name, params: args })
const ERRORS = { 'no-project': '열린 프로젝트가 없습니다', 'mcp-failed': '플러그인 서버를 띄우지 못했습니다', 'not-on': '이 프로젝트에서 UI 테스트가 꺼져 있습니다', 'service-off': 'UI 테스트 서비스가 꺼져 있습니다 — 설정 › 기능 › 플러그인에서 켜 주세요', 'service-failed': 'UI 테스트 서비스가 오류로 멈췄습니다', 'no-window': '설정 화면을 열 수 없습니다 — 이 플러그인 탭이 보일 때 눌러 주세요' }
const errorText = (error) => ERRORS[error?.message] || error?.message || String(error)

const state = {
  data: undefined, // list json
  error: '',
  view: { name: 'list' }, // { name: 'list' } | { name: 'detail', suite, id }
  menu: '', // 열린 [다시 수행 ▾] 의 묶음
  open: new Set(), // 펼친 묶음 — 기본은 접힘
  picking: undefined, // { suite, chosen: Set }
  headed: false, // 기본값(환경 팝업에서 저장) — 기본은 화면 없이. 메뉴에서 이번만 바꿀 수 있다
  output: 'report', // 수행 뒤 산출물 기본값(환경 팝업): report(결과서만) | both(결과서 + 가이드)
  env: undefined, // 환경 팝업 { headed, saved }
  progress: undefined,

}

const pad = (n) => String(n).padStart(2, '0')
const when = (ms) => {
  const d = new Date(ms)
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`
  return d.toDateString() === new Date().toDateString() ? `오늘 ${time}` : `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${time}`
}
const sec = (ms) => `${((ms || 0) / 1000).toFixed(1)}초`
const cmpLine = (c) => (c ? `새로 실패 ${c.newFail.length} · 고쳐짐 ${c.fixed.length} · 그대로 실패 ${c.stillFail.length}` : '처음 수행')

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(attrs)) {
    if (value === undefined || value === false) continue
    if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
    else node.setAttribute(key, value === true ? '' : value)
  }
  for (const child of children.flat(Infinity)) if (child !== undefined && child !== null && child !== false) node.append(child instanceof Node ? child : String(child))
  return node
}
const btn = (label, onclick, attrs = {}) => el('button', { type: 'button', onclick, ...attrs }, label)

const ICONS = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',

  doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
}
function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('class', 'i')
  svg.setAttribute('viewBox', '0 0 24 24')
  svg.setAttribute('aria-hidden', 'true')
  svg.innerHTML = ICONS[name]
  return svg
}
const iconBtn = (name, label, onclick, attrs = {}) => el('button', { type: 'button', onclick, ...attrs }, icon(name), label)

async function load() {
  try {
    state.data = JSON.parse(await tool('list', { json: true }))
    state.data.suites.sort((a, b) => latest(b) - latest(a))
    state.error = ''
    const view = state.view
    if (view.name === 'detail' && !findScenario(view.suite, view.id)) state.view = { name: 'list' }
  } catch (error) {
    state.error = errorText(error)
  }
  render()
}
/** 묶음의 최근 활동 시각 — 마지막 수행, 없으면 만든 날짜. 목록은 이 값이 큰(최신) 묶음부터 */
function latest(suite) {
  return Math.max(suite.runs[0]?.startedAt ?? 0, Date.parse(suite.created) || 0)
}
function findScenario(suiteId, id) {
  const suite = state.data?.suites.find((item) => item.id === suiteId)
  const item = suite?.scenarios.find((scenario) => scenario.id === id)
  return item ? { suite, item } : undefined
}

/** 결과서 열기 — 프로젝트 안이면 오른쪽 패널의 파일 미리보기(HTML 20MB 까지), 밖(공유 드라이브)이면 경로만 보인다 */
async function openReport(report) {
  if (report.startsWith('/') || /^[A-Za-z]:/.test(report)) {
    state.message = `결과서: ${report}`
    return render()
  }
  await tool('openFile', { path: report }).catch((error) => ((state.message = errorText(error)), render()))
}

/** 가이드형 결과물 만들기 — 서버가 guide.html 을 쓰고 경로를 돌려준다. openNow 면 바로 연다, 아니면 메시지 옆 [열기] */
async function makeGuide(suite, run, openNow) {
  try {
    const text = await tool('guide', { suite, ...(run && { run }) })
    const file = /가이드:\s*(\S+)/.exec(text)?.[1]
    if (!file) throw new Error(text)
    if (openNow) return await openReport(file)
    flash('가이드를 만들었습니다', file)
  } catch (error) {
    state.message = errorText(error)
    state.messageFile = ''
  }
  render()
}
/** 알림 — 닫을 수 있다. 성공 안내(flash)는 몇 초 뒤 저절로 사라지고, 오류는 닫을 때까지 남는다 */
let flashTimer = 0
function flash(text, file = '') {
  state.message = text
  state.messageFile = file
  clearTimeout(flashTimer)
  flashTimer = setTimeout(() => { if (state.message === text) clearMessage() }, 8000) // 그 사이 다른 메시지(오류)로 바뀌었으면 지우지 않는다
}
const clearMessage = () => (clearTimeout(flashTimer), (state.message = ''), (state.messageFile = ''), render())
const messageBox = () =>
  state.message
    ? el('div', { class: 'msg', style: 'display:flex;gap:8px;align-items:flex-start' }, el('span', { style: 'flex:1;min-width:0' }, state.message, state.messageFile ? [' ', btn('열기', () => openReport(state.messageFile), { class: 'link' })] : ''), btn('✕', clearMessage, { class: 'ghost small', 'aria-label': '알림 닫기', style: 'padding:0 6px' }))
    : ''

/** 진행을 받아 그린다 — 서비스가 밀어 보내거나(service.progress) 패널을 열 때 한 번 읽는다. 끝났으면 묶음 · 이력을 다시 읽는다 */
function applyProgress(progress) {
  const wasRunning = state.progress?.running
  state.progress = progress
  render()
  if (wasRunning && !progress?.running) {
    void load()
    // 산출물 기본값이 "결과서 + 가이드" 면 수행이 끝난 그 수행의 가이드도 만든다
    if (state.output === 'both' && progress?.suite && progress?.runId && !progress?.error) void makeGuide(progress.suite, progress.runId, false)
  }
}
async function refreshProgress() {
  try {
    applyProgress(JSON.parse(await tool('progress')))
  } catch {
    // 서버가 다시 뜨는 중
  }
}
/** 서비스 소식 — progress(수행 진행) · runError(수행 시작·진행 실패) */
function onEvent(event, data) {
  if (event === 'service.progress') return data?.stale ? void refreshProgress() : applyProgress(data)
  if (event === 'service.runError') {
    state.message = data?.message ?? ''
    render()
  }
}

async function rerun(suite, scenarios) {
  state.menu = ''
  state.picking = undefined
  state.message = ''
  state.messageFile = ''
  const args = { suite, headed: state.headed, ...(scenarios && { scenarios }) }
  // 서비스가 수행을 시작하고 진행을 밀어 보낸다 — 여기서는 시작이 막혔을 때만 알린다
  tool('run', args).then(
    () => undefined,
    (error) => ((state.message = errorText(error)), render()),
  )
  render()
}
async function stop() {
  await tool('stop').catch(() => undefined)
}

/** 삭제 — 확인을 받은 뒤 서버의 delete(패널 전용 도구). 결과서 · 이력은 남는다 */
async function deleteNow() {
  const target = state.confirmDel
  if (!target) return
  state.confirmDel = undefined
  try {
    await tool('delete', { suite: target.suite, ...(target.id && { scenario: target.id }) })
    flash(`${target.id ? '시나리오를' : '묶음을'} 삭제했습니다 — 결과서 · 수행 이력은 남습니다`)
    if (!target.id) state.open.delete(target.suite)
    state.view = { name: 'list' }
  } catch (error) {
    state.message = errorText(error)
    state.messageFile = ''
  }
  await load()
}
const confirmBox = (title, body, onOk) =>
  el('div', { class: 'confirm', role: 'alertdialog' }, el('div', {}, el('b', {}, title), el('br'), body), el('div', { class: 'acts' }, btn('취소', () => ((state.confirmDel = undefined), render())), btn('삭제', onOk, { class: 'solid-danger' })))

/** 대화로 넘기기 — 새 대화를 열어 요청 글을 바로 보낸다 (chat 권한) */
async function ask(text, send = true) {
  state.message = ''
  state.messageFile = ''
  try {
    await tool('ask', { text, send })
  } catch (error) {
    state.message = errorText(error)
    render()
  }
}

/** 기본값 하나를 바로 저장한다 — 눌러서 고르면 끝(저장 단추 없음). 실패하면 되돌린다 */
async function savePref(key, value) {
  if (!state.env || state[key] === value) return
  const before = state[key]
  state[key] = value
  state.env.saved = ''
  state.env.focus = key
  render()
  try {
    const prefs = await tool('prefs', { set: { [key]: value } })
    state.headed = prefs.headed === true
    state.output = prefs.output === 'both' ? 'both' : 'report'
    if (!state.env) return
    state.env.failed = false
    state.env.saved = '저장했습니다'
  } catch (error) {
    state[key] = before
    if (!state.env) return
    state.env.failed = true
    state.env.saved = errorText(error)
  }
  if (state.env && document.activeElement?.dataset?.pref === key) state.env.focus = key // 방향키로 옮긴 뒤 다시 그려도 포커스를 그 타일에 둔다
  render()
  const mark = state.env?.saved
  setTimeout(() => { if (state.env && state.env.saved === mark && !state.env.failed) { state.env.saved = ''; render() } }, 1800)
}

  const data = state.data
  const main = el('main')
  if (state.error) main.append(el('div', { class: 'msg bad' }, state.error), btn('다시 읽기', load))
  else if (!data) main.append(el('div', { class: 'msg' }, '불러오는 중…'))
  else main.append(...(state.view.name === 'detail' ? detailView(data) : listView(data)))
  const scroll = scrollY
  app.replaceChildren(main, ...(state.env && data ? [envDialog(data)] : []))
  scrollTo(0, scroll)
  if (state.env?.focus) {
    app.querySelector(`[data-pref="${state.env.focus}"][aria-checked="true"]`)?.focus()
    state.env.focus = ''
  }
}

addEventListener('click', (event) => {
  if (state.menu && !event.target.closest('.menuwrap')) {
    state.menu = ''
    render()
  }
})
addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && state.env) {
    state.env = undefined
    render()
  }
})

void (async () => {
  try { await call('events.subscribe', { events: ['service.progress', 'service.runError'] }) } catch { /* 권한 없음 */ }
  try {
    const prefs = await tool('prefs')
    state.headed = prefs.headed === true
    state.output = prefs.output === 'both' ? 'both' : 'report'
  } catch { /* 저장된 값 없음 — 화면 없이 · 결과서만 */ }
  await load()
  await refreshProgress()
})()
</script>
</body>
</html>

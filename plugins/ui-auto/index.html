<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI-AUTO</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* UI-AUTO 디자인 시스템(디자인 시스템 artifact "UI-AUTO")의 토큰 · 컴포넌트. 메인 남색 한 색조 + 회색, 색조 밖은 실패 빨강 하나. 구역은 Section 상자.
   unslop(Damir Sokolovsky @heydamir, CC BY 4.0) 다듬기 — 4px 격자, 크기 12 · 13 · 14 · 15 · 17, 굵기 400 · 500 · 600, 음수 자간 없음, 보라 · 후광 없음.
   표시 빨강(--mark)은 캡처의 동작 위치 상자와 같은 색 — 보고서 단계 번호에만 쓴다 */
:root{--bg:#ffffff;--bg-subtle:#f5f7fb;--bg-hover:#f1f5fd;--ink:#1c2433;--ink-2:#4b5567;--ink-3:#7a8496;--line:#e4e8ef;--line-strong:#cdd4df;
  --primary-50:#f2f6fd;--primary-100:#e3ecfa;--primary-200:#c7d8f4;--primary-300:#9dbbea;--primary:#3b6cc7;--primary-700:#2a5299;--primary-800:#213f75;--on-primary:#ffffff;--focus:#9dbbea;
  --ok:#2f5fb8;--ok-bg:#e6eefb;--ng:#c2412d;--ng-bg:#fdece9;--hold:#b4553f;--hold-bg:#fbefe9;--idle:#6b7486;--idle-bg:#eef1f5;--mark:#e5484d;
  --chart-s:#3b6cc7;--chart-f:#c2412d;--chart-b:#e8a596;--chart-i:#dce6f6;--chart-track:#eef3fb;
  --danger-bg:#fdece9;--danger-ink:#c2412d;--code-bg:#1c2433;--code-ink:#c9d1e0;--scrim:rgba(16,20,27,.45);
  --font-sans:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--r-sm:4px;--r-md:6px;--r-lg:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121722;--bg-subtle:#0c1018;--bg-hover:#18213a;--ink:#e7ebf3;--ink-2:#b4bdcc;--ink-3:#8790a3;--line:#242c3b;--line-strong:#364156;
  --primary-50:#121a2a;--primary-100:#17233a;--primary-200:#213559;--primary-300:#34508a;--primary:#7ea6ec;--primary-700:#a9c4f3;--primary-800:#cddcf8;--on-primary:#0c1018;--focus:#34508a;
  --ok:#7ea6ec;--ok-bg:#17233a;--ng:#f39a8b;--ng-bg:#3a1c19;--hold:#f0a08c;--hold-bg:#3a2420;--idle:#9aa3b5;--idle-bg:#1d2433;--mark:#e5484d;
  --chart-s:#7ea6ec;--chart-f:#f39a8b;--chart-b:#8a4a3f;--chart-i:#243352;--chart-track:#172033;
  --danger-bg:#3a1c19;--danger-ink:#f39a8b;--code-bg:#05070a;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{margin:0;background:var(--bg-subtle);color:var(--ink);font:14px/1.5 var(--font-sans);font-variant-numeric:tabular-nums;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--font-mono);font-size:12px}
#app{min-height:100%;display:flex;flex-direction:column}

/* 앱 머리 */
.bar{display:flex;align-items:center;gap:12px;padding:8px 12px;min-height:56px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:3}
.bar .bt{flex:1;min-width:0}
.bar .bt b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt small{display:block;font:12px var(--font-mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{flex:none;width:26px;height:26px;border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:600 12px var(--font-mono)}
.ib{flex:none;width:32px;height:32px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink-3)}
.ib:hover{background:var(--bg-hover);color:var(--ink)}
.body{flex:1;padding:16px;display:grid;gap:16px;align-content:start;width:100%;max-width:980px;margin:0 auto}
.body>*{min-width:0}

/* Section */
.sec{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.sec-h{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-bottom:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0}
.sec-h h3{margin:0;flex:1;min-width:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.sec-h h3 .n{font-weight:600;color:var(--ink-3)}
.sec-b{padding:16px}
.sec-b.flush{padding:0}
.sec-f{padding:8px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-f b{color:var(--ink)}

/* Stat */
.stat{display:grid;gap:2px}
.stat .l{font-size:14px;color:var(--ink-3)}
.stat .v{font-size:28px;line-height:32px;font-weight:600}
.stat .v small{font-size:16px;font-weight:600;margin-left:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.pair .v{font-size:16px;line-height:22px;font-weight:600;letter-spacing:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

/* Link · Button */
.link{color:var(--primary);font-weight:600;font-size:13px;border-radius:var(--r-sm);white-space:nowrap}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link:disabled{color:var(--ink-3);cursor:not-allowed;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--r-md);background:var(--primary-50);box-shadow:inset 0 0 0 1px var(--primary-200);font-size:13px;font-weight:600;color:var(--primary-700);white-space:nowrap}
.btn:hover{background:var(--primary-100)}
.btn.pri{background:var(--primary);color:var(--on-primary);box-shadow:none}
.btn.pri:hover{background:var(--primary-700)}
.btn.del{color:var(--danger-ink);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn.del:hover{background:var(--danger-bg)}
.btn.sdel{background:var(--danger-ink);color:#fff;box-shadow:none}
.btn.icon{width:36px;padding:0}
.btn.plain{background:var(--bg);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts .end{margin-left:auto}

/* Tabs · Chips */
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);padding:0 2px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;white-space:nowrap;height:36px;font-size:14px;color:var(--ink-3);font-weight:500;display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--primary)}
.tab .n{font-size:12px;color:var(--ink-3);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:32px;padding:0 10px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line-strong);font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--bg-hover)}
.chip[aria-pressed=true]{color:var(--primary-700);box-shadow:inset 0 0 0 1px var(--primary-200);background:var(--primary-50)}
.search{width:100%;min-width:0;height:36px;border:0;border-radius:var(--r-md);padding:0 10px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--ink);font:inherit;font-size:13px}
.search::placeholder{color:var(--ink-3)}

/* StatusBadge — 판정은 채운 배지(색 = 뜻), 스크립트 상태는 테두리 배지(아이콘 + 글자) */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-sm);font-size:12px;font-weight:600;white-space:nowrap;line-height:1}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.ng{background:var(--ng-bg);color:var(--ng)}
.badge.hold{background:var(--hold-bg);color:var(--hold)}
.badge.idle{background:var(--idle-bg);color:var(--idle)}
.badge.info{background:var(--primary-50);color:var(--primary-700)}
.badge.gone{background:none;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-strong);text-decoration:line-through}
.badge.s-verified{background:none;color:var(--primary-700);box-shadow:inset 0 0 0 1px var(--primary-200)}
.badge.s-pending{background:none;color:var(--ink-2);outline:1px dashed var(--line-strong);outline-offset:-1px}
.badge.s-broken{background:none;color:var(--ng);box-shadow:inset 0 0 0 1px var(--ng)}
.badge.s-none{background:none;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-strong)}
.badge .dotc{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Donut — 성공 · 실패 · 차단 · 미수행 */
.donut{flex:none;display:block}
.donut .track{stroke:var(--chart-track)}
/* 판정 색은 두 계열 — 통과는 메인 파랑, 문제(실패 · 차단)는 빨강 */
.donut .s{stroke:var(--chart-s)}.donut .f{stroke:var(--chart-f)}.donut .b{stroke:var(--chart-b)}.donut .i{stroke:var(--chart-i)}
.donut text{fill:var(--ink);font-family:var(--font-sans)}
.sum{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.sum .main{display:grid;gap:4px;min-width:0;flex:1 1 180px}
.sum .main>*{min-width:0}
.sum .main b{font-size:17px;font-weight:600}
.sum .main b em{font-style:normal;color:var(--primary)}
.thin{font-size:13px;font-weight:400;color:var(--ink-3);line-height:1.7}
.thin b,.sum .main .thin b{font-size:inherit;font-weight:500;letter-spacing:0;color:var(--ink-2)}
.ellip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend2{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--ink-3)}
.legend2 span{display:inline-flex;align-items:center;gap:5px}
.legend2 i{width:8px;height:8px;border-radius:2px;display:inline-block}
.pagesum{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.pagesum{grid-template-columns:1fr}}

/* DataTable · Bar */
table.t{width:100%;border-collapse:collapse}
.t th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px 8px 12px 0;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
.t th:first-child,.t td:first-child{padding-left:16px}
.t th:last-child,.t td:last-child{padding-right:16px}
.t col.c-res{width:132px}.t col.c-num{width:56px}
.t tr:last-child td{border-bottom:0}
.t .num{text-align:right}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--bg-hover)}
.t{table-layout:fixed}
.t .nm{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .sub{display:block;font:12px var(--font-mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
/* 표 — 줄 높이 고정: 이름 칸만 「위 한 줄 + 아래 한 줄」(각각 말줄임), 나머지 칸은 꺾지 않는다 */
.t td{height:64px}
.t td:not(:first-child){white-space:nowrap}
.t td>.mini{white-space:nowrap}
.mid{display:flex;min-width:0;max-width:100%;overflow:hidden;font:12px var(--font-mono);color:var(--ink-3);margin-top:2px}
.mid .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 999 auto;min-width:1.6em}
.mid .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:0}
@media (max-width:520px){.t col.c-res{width:96px}.t col.c-num{width:42px}.t col.c-date{width:72px}}
.t col.c-badge{width:84px}.t col.c-date{width:104px}
.t .mini{display:block;font-size:12px;color:var(--ink-3);margin-top:4px;white-space:nowrap}
.rbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--chart-i);gap:1px;width:100%;max-width:120px}
.rbar i{display:block}
.rbar .s{background:var(--chart-s)}.rbar .f{background:var(--chart-f)}.rbar .b{background:var(--chart-b)}

/* TcAccordion · StepList */
.acc-item{border-top:1px solid var(--line)}
.acc-item:first-child{border-top:0}
.acc-head{width:100%;display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;align-items:center;padding:12px 16px;text-align:left}
.acc-row{display:flex;align-items:center;gap:8px;margin-top:6px;min-width:0}
.acc-row .thin{min-width:0;flex:1}
.acc-head:hover{background:var(--bg-hover)}
.acc-head .caret{color:var(--ink-3);transition:transform .16s cubic-bezier(.22,1,.36,1)}
.acc-title{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.acc-head[aria-expanded=true] .caret{transform:rotate(90deg);color:var(--ink)}
.acc-id{font:12px var(--font-mono);color:var(--ink-3)}
.acc-text{display:block;font-size:14px;overflow-wrap:anywhere}
.acc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.acc-side{display:grid;justify-items:end;gap:4px;font-size:13px;color:var(--ink-3);white-space:nowrap}
.acc-side b{color:var(--ink);font-weight:600}
.acc-body{padding:0 16px 16px 42px;display:grid;gap:12px}
.steps{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-subtle);counter-reset:s}
.steps li{display:grid;grid-template-columns:22px 16px minmax(0,1fr);gap:8px;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;align-items:start}
.steps li:first-child{border-top:0}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font:11px var(--font-mono);color:var(--ink-3);padding-top:2px}
.steps li .ic{color:var(--ink-2);margin-top:1px}
.steps li.verify .ic{color:var(--primary)}
.steps code{display:block;font:12px var(--font-mono);color:var(--ink-3);overflow-wrap:anywhere}
.steps .exp{display:block;font-size:12px;color:var(--ink-2)}
.confirm{display:grid;gap:10px;padding:12px;border:1px solid var(--danger-ink);border-radius:var(--r-md);background:var(--danger-bg)}
.confirm b{color:var(--danger-ink)}
.confirm p{margin:0;font-size:13px;color:var(--ink-2)}
.confirm label{display:flex;gap:8px;align-items:center;font-size:13px}
input[type=checkbox]{margin:0;width:16px;height:16px;accent-color:var(--primary)}

/* KeyValue · StepEvidence */
dl.kv{margin:0;display:grid;grid-template-columns:88px minmax(0,1fr);border-top:1px solid var(--line)}
.kv dt,.kv dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.kv dt{color:var(--ink-3)}
.shot{position:relative;width:100%;max-width:100%;aspect-ratio:16/10;border-radius:var(--r-sm);overflow:hidden;background:var(--bg-subtle);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:12px}
.shot img{width:100%;height:100%;object-fit:contain;object-position:center top;display:block;background:var(--bg)}
.stepcard .shot{aspect-ratio:auto;min-height:60px}
.stepcard .shot img{height:auto}
.steps2{display:grid;gap:16px}
.stepcard{display:grid;gap:8px}
.stepcard+.stepcard{padding-top:16px;border-top:1px solid var(--line)}
.stepcards{display:grid;gap:16px}
.stepcard .desc{margin:0;font-size:14px;line-height:1.55;color:var(--ink)}
.stepcard.last .shot{box-shadow:0 0 0 2px var(--primary)}
.stepcard.bad .shot{box-shadow:0 0 0 2px var(--danger-ink)}
.sch{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.sch b{font:600 12px var(--font-mono);color:var(--ink-3);min-width:20px}
.sch b.no{display:inline-grid;place-items:center;height:20px;padding:0 6px;border-radius:10px;background:var(--mark);color:#fff;font:600 12px var(--font-sans)}
.sch .t{flex:1;min-width:0;overflow-wrap:anywhere}
dl.sx{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 8px;margin:0;font-size:13px}
.sx dt{color:var(--ink-3)}.sx dd{margin:0;overflow-wrap:anywhere}

/* FlowCanvas */
.cv{position:relative;height:420px;overflow:hidden;background-color:var(--bg-subtle);background-image:radial-gradient(var(--line-strong) 1px,transparent 1px);background-size:20px 20px;cursor:grab;touch-action:none;border-radius:0 0 var(--r-md) var(--r-md)}
.cv.full{height:calc(100vh - 140px)}
.cv.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world>svg{position:absolute;left:0;top:0;overflow:visible}
.node{position:absolute;width:240px;background:var(--bg);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line-strong);padding:8px;display:grid;gap:6px;text-align:left;cursor:pointer}
.node.entry{box-shadow:0 0 0 1.5px var(--primary)}
.node.sel{box-shadow:0 0 0 2px var(--primary)}
.node.nocap{outline:1px dashed var(--line-strong);box-shadow:none}
.node .nt{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.node .nt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node code{font:11px var(--font-mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .nr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}.node .nr .rbar{flex:1}
.elabel{position:absolute;transform:translate(-50%,-50%);max-width:160px;font-size:12px;line-height:1.35;text-align:center;overflow-wrap:anywhere;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 6px;pointer-events:none}
.mnode{position:absolute;display:grid;align-content:center;gap:2px;padding:6px 10px;border-radius:var(--r-md);background:var(--bg-subtle);box-shadow:0 0 0 1px var(--line-strong);min-width:0}
.mnode b{display:flex;align-items:center;gap:5px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnode span{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnode svg,.mlist svg,.legend svg{width:13px;height:13px;flex:none;color:var(--ink-3)}
.mlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:13px}
.mlist li{display:flex;align-items:center;gap:6px;min-width:0}.mlist span{color:var(--ink-3);overflow-wrap:anywhere}
.elabel.bad{color:var(--danger-ink);border-color:var(--danger-bg)}
.cv-tools{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line-strong);padding:2px}
.cv-tools .zv{font:600 12px var(--font-mono);min-width:42px;text-align:center;color:var(--ink-2)}
.cv-tools .sep{width:1px;height:18px;background:var(--line)}
.cv-mini{position:absolute;right:10px;bottom:10px;width:110px;height:70px;background:var(--bg);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line-strong);overflow:hidden;pointer-events:none}
.cv-mini i{position:absolute;border-radius:1px;background:var(--line-strong)}
.cv-mini b{position:absolute;border:1.5px solid var(--primary);border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

.empty{padding:24px 16px;text-align:center;color:var(--ink-2);font-size:14px}

.empty .btn{margin-top:12px}
.quiet{padding:16px;color:var(--ink-2);font-size:13px}
.warnbox{padding:8px 12px;border-radius:var(--r-md);background:var(--warning-bg);color:var(--warning-ink);font-size:13px}
.dock{position:sticky;bottom:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--bg);border-top:1px solid var(--line)}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:5}

.rows{display:grid}

.tag.still{color:var(--hold);background:var(--hold-bg)}

.mini-bar{display:block;height:4px;border-radius:2px;background:var(--primary-100);margin-top:6px;overflow:hidden}.mini-bar i{display:block;height:100%;background:var(--primary)}

.tl li:last-child::before{display:none}

.doc p{margin:0;overflow-wrap:anywhere}
.gstep{display:grid;gap:4px;padding:10px;border:1px solid var(--line);border-radius:var(--r-md)}
.gstep>span{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
/* 수행 중 · 작업 기록 */
.sec.live{border-color:var(--primary-200)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--primary-100)}
.cases{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cases li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.lg{border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg)}
.lg summary{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;min-width:0}
.lg summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg summary .thin{margin-left:auto;flex:none}
.lg .log{border-radius:0 0 var(--r-md) var(--r-md);max-height:220px}
/* 상태 화면 */
.state{display:grid;justify-items:center;text-align:center;gap:8px;padding:20px 16px}
.state>b{font-size:15px}
.state p{margin:0 0 6px;font-size:13px;color:var(--ink-2);line-height:1.55}
.st-ic{width:36px;height:36px;border-radius:var(--r-lg);display:grid;place-items:center;background:var(--primary-50);color:var(--primary)}
.state.warn .st-ic{background:var(--hold-bg);color:var(--hold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
// UI-AUTO 패널 — 홈(요약 · 탭: 대상 페이지 / 흐름 지도 / 수행 기록) → 페이지(TC 목록, 펼치면 단계 · 수행 기록 · 재수행 · 보고서 · 삭제) → 증적 보고서(요약 · 단계별 증적 · PDF).
// 원본은 증적 파일(.litecode/ui-auto/)이고 서비스가 서버 도구로 읽어 준다(계약: README "패널 ↔ 서비스"). 패널 수행은 AI 없이 TC 스크립트를 재생한다(service.progress 소식).
// 사용자 · AI 가 쓴 글은 늘 textContent 로만 넣는다(el 도우미). 앱과는 통로로만 말한다: parent.postMessage({ litecode: 1, id, method, params }).

// <pure> — DOM 을 모르는 순수 로직. tests/panel.test.ts 가 이 구간만 잘라 시험한다
const BADGE = { 성공: 'ok', 일치: 'ok', 수행됨: 'info', 실패: 'ng', 다름: 'ng', 차단: 'hold', 멈춤: 'hold', 미수행: 'idle', 폐기: 'gone' }
const badgeOf = (value) => BADGE[value] ?? 'idle'
/** 스크립트 상태 — 판정과 다른 모양(테두리) · 색 */
const SCRIPT_TAG = { 검증됨: 's-verified', 미검증: 's-pending', 깨짐: 's-broken', 없음: 's-none' }
const scriptTagOf = (value) => SCRIPT_TAG[value] ?? 's-none'
/** 도넛 조각 — 성공 · 실패 · 차단 · 미수행 순서로 둘레(c) 위의 [길이, 시작] */
function donutArcs(counts, c) {
  const keys = [['성공', 's'], ['실패', 'f'], ['차단', 'b'], ['미수행', 'i']]
  const total = keys.reduce((sum, [key]) => sum + (counts[key] ?? 0), 0)
  let at = 0
  return keys.filter(([key]) => counts[key]).map(([key, cls]) => { const len = (counts[key] / total) * c; const arc = { cls, len, at }; at += len; return arc })
}
/** 「전체 N건 중 M건 통과」 — 폐기는 세지 않는다 */
function passText(counts) {
  const total = ['성공', '실패', '차단', '미수행'].reduce((sum, key) => sum + (counts[key] ?? 0), 0)
  return { total, pass: counts['성공'] ?? 0, text: total ? `전체 ${total}건 중 ${counts['성공'] ?? 0}건 통과` : 'TC 없음' }
}
/** 수행한 TC(성공 · 실패 · 차단)의 최근 판정 기준 성공률 — 수행한 것이 없으면 null */
function successRate(counts) {
  const done = (counts['성공'] ?? 0) + (counts['실패'] ?? 0) + (counts['차단'] ?? 0)
  return done ? { rate: Math.round(((counts['성공'] ?? 0) / done) * 100), done } : null
}
function sumCounts(pages) {
  const out = {}
  for (const page of pages) for (const [key, value] of Object.entries(page.counts)) out[key] = (out[key] ?? 0) + value
  return out
}
/** 결과 막대의 몫(%) — 폐기는 빼고 센다 */
function barParts(counts) {
  const total = ['성공', '실패', '차단', '미수행'].reduce((sum, key) => sum + (counts[key] ?? 0), 0)
  const pct = (key) => (total ? ((counts[key] ?? 0) / total) * 100 : 0)
  return { total, s: pct('성공'), f: pct('실패'), b: pct('차단') }
}
function countsLine(counts) {
  const parts = ['성공', '실패', '차단', '미수행'].filter((key) => counts[key]).map((key) => `${key} ${counts[key]}`)
  return parts.join(' · ') || 'TC 없음'
}
/** 페이지 검색 — 화면명 · page_id · URL · TC 제목 · 내용 */
function filterPages(pages, query) {
  const q = query.trim().toLowerCase()
  if (!q) return pages
  return pages.filter((page) => [page.title, page.id, page.urlPattern, ...page.tcs.map((tc) => `${tc.id} ${tc.title ?? ''} ${tc.content}`)].some((text) => String(text).toLowerCase().includes(q)))
}
/** TC 거르기 — 상태(all 이면 전부) · 검색(id · 제목 · 내용). 폐기는 '폐기 보기' 를 켤 때만 */
function filterTcs(tcs, mode, showRetired, query = '') {
  const q = query.trim().toLowerCase()
  return tcs.filter((tc) => (showRetired || tc.status !== '폐기') && (mode === 'all' || tc.status === mode) && (!q || `${tc.id} ${tc.title ?? ''} ${tc.content}`.toLowerCase().includes(q)))
}
/** 상태별 건수 — 세그먼트 단추. 건수가 있는 상태만, 정해 둔 순서로 */
function statusSegments(tcs) {
  const live = tcs.filter((tc) => tc.status !== '폐기')
  return [['all', '전체', live.length], ...['실패', '차단', '미수행', '성공'].map((key) => [key, key, live.filter((tc) => tc.status === key).length]).filter(([, , count]) => count)]
}
/** 페이지 표 정렬 — result 는 실패 · 차단 몫, tc 는 TC 수. sort 가 없으면 system_map 순서 */
function sortPages(pages, sort) {
  if (!sort) return pages
  const value = (page) => { if (sort.key === 'tc') return page.tcs.filter((tc) => tc.status !== '폐기').length; const p = barParts(page.counts); return p.total ? p.f + p.b : -1 }
  const sign = sort.dir === 'asc' ? 1 : -1
  return [...pages].sort((a, b) => sign * (value(a) - value(b)))
}
/** 흐름 꼬리표 — 지난 판정과 비교. 차단이면 차단으로 쓴다 */
function trendText(trend, verdict) {
  if (!trend) return ''
  const bad = verdict === '차단' ? '차단' : '실패'
  return trend.kind === 'new' ? `새로 ${bad}` : trend.kind === 'still' ? `계속 ${bad} ${trend.count}회` : '고쳐짐'
}
const daysAgo = (date, now) => { const time = Date.parse(`${date}T00:00:00`); return Number.isNaN(time) ? '기록 없음' : `${Math.max(0, Math.floor((now - time) / 86400000))}일 전` }
/** 「확인 필요」 — 지금 손봐야 할 것만: 실패 · 차단 TC(실패 먼저, 새것 먼저) → 불일치 이동 → 오래된 페이지 */
function attentionItems(pages, reports, edges, now = new Date()) {
  const latest = new Map()

    del ? el('div', { class: 'confirm', role: 'alertdialog', 'aria-label': `${tc.id} 삭제 확인` }, el('b', {}, `${tc.title || tc.id} 를 삭제할까요?`), el('p', {}, '페이지 문서에서 「폐기」 로 바뀌고 목록에서 숨겨집니다. 보고서는 남고 번호는 다시 쓰지 않습니다.'),
      tc.script ? el('label', {}, el('input', { type: 'checkbox', checked: state.delScript, onchange: (event) => (state.delScript = event.target.checked) }), '스크립트 파일도 지우기') : null,
      el('div', { class: 'acts' }, btn('취소', () => ((state.del = undefined), (pendingFocus = `del:${tc.id}`), render()), { class: 'btn plain' }), btn('삭제', () => retire(tc.id), { class: 'btn sdel', 'data-fk': `delgo:${tc.id}` }))) : null,
    // 단추 묶음 — 지우기는 왼쪽 끝, 보조 단추 다음 주 단추(재수행)를 묶음 끝에
    el('div', { class: 'acts' },
      // 지우기는 아이콘만 — 좁은 패널에서도 단추 넷이 한 줄에 든다
      tc.status === '폐기' ? null : btn(icon('trash'), () => ((state.del = tc.id), (state.delScript = false), (pendingFocus = `delgo:${tc.id}`), render()), { class: 'btn del icon', disabled: running(), 'data-fk': `del:${tc.id}`, 'aria-label': '삭제', title: '삭제' }),
      el('span', { class: 'acts end' },
        latest ? btn([icon('doc'), '보고서'], () => go({ name: 'report', id: latest.report, tc: tc.id, from })) : null,
        btn([icon('book'), '가이드'], () => openGuide(tc.id, from), { disabled: !guide && !passed, title: guide || passed ? '따라 하는 테스트 가이드' : '성공한 수행이 있어야 가이드를 만듭니다' }),
        tc.status === '폐기' ? null : btn([icon('play'), '재수행'], rerun, { class: 'btn pri', disabled: running() || busyAi(), title: busyAi() ? 'AI 가 브라우저를 쓰는 중입니다' : ok ? '저장된 스크립트로 바로 재생' : `AI 가 수행 (${info.runnable?.why ?? '스크립트 없음'})` }))),
    ok ? null : el('div', { class: 'thin' }, `스크립트로 바로 재생할 수 없어 재수행은 AI 가 합니다 — ${info.runnable?.why ?? '스크립트 없음'}`))
}

// ── 보고서 ──

function reportView() {
  const info = state.reports.get(state.screen.id)
  if (info === undefined || info === 'loading') return [el('div', { class: 'quiet', role: 'status' }, '보고서를 불러오는 중…')]
  if (info.error) return [el('div', { class: 'notice err', role: 'alert' }, el('div', { class: 'm' }, el('b', {}, '보고서를 읽지 못했습니다'), info.error))]
  const r = info
  const verdict = r.head['판정'] || '미확인'
  const tc = state.screen.tc
  const kv = el('dl', { class: 'kv' },
    el('dt', {}, '판정'), el('dd', {}, badge(verdict), r.basis ? el('span', { class: 'thin', style: 'margin-left:6px' }, r.basis.split('\n')[0]) : null),
    ...['일시', '대상 페이지', '테스트 케이스', '수행 방식'].filter((key) => r.head[key]).flatMap((key) => [el('dt', {}, key === '테스트 케이스' ? 'TC' : key === '대상 페이지' ? '대상' : key), el('dd', {}, r.head[key])]),
    r.route ? [el('dt', {}, '경로'), el('dd', { class: 'mono' }, r.route)] : null, r.input ? [el('dt', {}, '입력값'), el('dd', { class: 'mono' }, r.input.replace(/^- /gm, ''))] : null,
    el('dt', {}, '기대 결과'), el('dd', {}, r.expected || '-'), el('dt', {}, '실제 결과'), el('dd', {}, r.actual || '-'))
  const guide = tc ? guideFor(state.data.guides, tc) : undefined
  const head = section(tcById(tc)?.title || r.title, '', btn([icon('pdf'), 'PDF 저장'], () => savePdf('report', r.id), { disabled: state.pdfBusy }), kv,
    { foot: [el('span', { class: 'mono ellip', style: 'min-width:0' }, `reports/${r.id}.md`), el('span', { class: 'acts' }, link('앱에서 열기', () => openDoc('report', r.id)), tc && (guide || verdict === '성공') ? link('테스트 가이드', () => openGuide(tc, { name: 'report', id: r.id, tc, from: state.screen.from })) : null)] })
  if (!r.steps.length) return [head, section('단계 증적', 0, null, el('div', { class: 'quiet', style: 'padding:0' }, '캡처가 없습니다')), notesSection(r)]
  // 단계마다 한 장 — 대상 페이지 다음에 단계를 차례로 잇는다. 단계 캡처는 그 단계를 하기 바로 전 화면(손댄 요소에 붉은 번호 상자)
  const bad = (item) => /다름|멈춤/.test(item.verdict)
  const compare = r.previousPass ? el('div', { class: 'seg sm', role: 'group', 'aria-label': '비교' }, el('button', { type: 'button', 'aria-pressed': String(!state.cmp), onclick: () => ((state.cmp = false), render()) }, '이번'), el('button', { type: 'button', 'aria-pressed': String(state.cmp), onclick: () => ((state.cmp = true), render()), title: `지난 성공 ${r.previousPass.id}` }, icon('swap'), '지난 성공')) : null
  const oldFormat = !r.steps.some((step) => step.action || step.expected || step.actual)
  const cards = r.steps.map((step, index) => {
    const before = state.cmp ? pairStep(r.previousPass?.steps, step) : undefined
    return el('article', { class: `stepcard${bad(step) ? ' bad' : index === r.steps.length - 1 ? ' last' : ''}`, 'aria-label': step.title },
      el('div', { class: 'sch' }, stepNo(step.title, index), el('span', { class: 't' }, step.title.replace(/^\d+\.\s*/, '')), step.verdict && step.verdict !== '-' ? badge(step.verdict) : null),
      step.description ? el('p', { class: 'desc' }, step.description) : null,
      state.cmp ? (before?.capture ? shot(before.capture, `지난 성공 ${r.previousPass.id} 의 같은 단계`) : el('div', { class: 'shot' }, '지난 성공에 같은 단계 캡처가 없습니다')) : shot(step.capture, step.title),
      state.cmp ? el('span', { class: 'thin' }, `지난 성공 ${r.previousPass.id} (${short(r.previousPass.at)}) 의 같은 단계`) : null,
      step.action || step.expected || step.actual ? el('dl', { class: 'sx' }, el('dt', {}, '한 일'), el('dd', {}, step.action || '-'), el('dt', {}, '기대'), el('dd', {}, step.expected || '-'), el('dt', {}, '실제'), el('dd', {}, step.actual || '-'), el('dt', {}, '판정'), el('dd', {}, step.verdict || '-')) : oldFormat ? el('p', { class: 'mono', style: 'margin:0;color:var(--ink-3)' }, '이 보고서는 단계별 기대 · 실제를 적지 않은 옛 형식입니다.') : null)
  })
  const steps = section('단계 증적', r.steps.length, compare, el('div', { class: 'stepcards' }, cards))
  return [head, steps, notesSection(r)]
}
/** 단계 번호 — 캡처의 표시 상자와 같은 빨간 번호, 대상 페이지 · 판정 화면은 차례만 */
const stepNo = (title, index) => { const number = /^(\d+)\./.exec(title)?.[1]; return number ? el('b', { class: 'no', 'aria-label': `${number}단계` }, number) : el('b', {}, String(index).padStart(2, '0')) }
const notesSection = (r) => section('불일치 · 확인 사항', '', null, el('div', { style: 'white-space:pre-line;font-size:14px' }, r.notes || '없음'))

// ── 테스트 가이드 ──

function guideView() {
  const info = state.guide
  if (!info || (!info.data && !info.error)) return [el('div', { class: 'quiet', role: 'status' }, '가이드를 불러오는 중…')]
  if (info.error) return [el('div', { class: 'notice err', role: 'alert' }, el('div', { class: 'm' }, el('b', {}, '가이드를 읽지 못했습니다'), info.error))]
  const g = info.data
  const head = Object.entries(g.head)
  const item = (part) => part.kind === 'image' ? shot(part.capture, part.alt)
    : part.kind === 'step' ? el('div', { class: 'gstep' }, el('b', {}, part.title), ...part.lines.map((line) => el('span', {}, line)), part.capture ? shot(part.capture, part.title) : null)
    : el('p', {}, part.text.replace(/^-\s*/, '· '))
  return [section(g.title, '', btn([icon('pdf'), 'PDF 저장'], () => savePdf('guide', g.id), { disabled: state.pdfBusy }),
    el('div', { class: 'doc' }, head.length ? el('dl', { class: 'kv' }, head.flatMap(([key, value]) => [el('dt', {}, key), el('dd', {}, value)])) : null,
      g.sections.flatMap((part) => [el('h4', {}, part.title), ...part.items.map(item)])),
    { foot: [el('span', { class: 'mono ellip', style: 'min-width:0' }, `guides/${g.id}.md`), link('앱에서 열기', () => openDoc('guide', g.id))] })]
}

// ── 환경 ──

function envDialog() {
  const data = state.data
  const close = () => ((state.env = false), (pendingFocus = 'env'), render())
  return el('div', { class: 'scrim', onclick: (event) => event.target === event.currentTarget && close() },
    el('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-label': '환경' },
      el('div', { class: 'sec-h' }, el('h3', {}, '환경'), ib('x', '닫기', close, { 'data-fk': 'envclose' })),
      el('div', { class: 'sec-b', style: 'display:grid;gap:12px' },
        el('dl', { class: 'kv' }, el('dt', {}, '대상 주소'), el('dd', { class: 'mono' }, data.baseUrl || '비어 있음'), el('dt', {}, '로그인'), el('dd', {}, data.login.configured ? `설정됨 · 세션 ${data.login.saved ? '저장되어 있음' : '없음 (첫 수행 때 로그인)'}` : '설정 없음 (로그인 없이 씀)'), el('dt', {}, '증적'), el('dd', { class: 'mono' }, `${data.evidence}/ — 팀 공유, 플러그인을 지워도 남음`), el('dt', {}, '생성물'), el('dd', { class: 'mono' }, '.litecode/plugins/ui-auto/ — HTML · PDF · 세션 기록'), el('dt', {}, '브라우저'), el('dd', {}, data.busy === 'ai' ? 'AI 가 쓰는 중' : data.busy === 'panel' ? '패널 수행 중' : '쉬는 중')),
        el('div', { class: 'acts' }, btn('설정 열기', () => void tool('settings').catch(() => undefined), { class: 'btn pri' }), btn('다시 불러오기', () => ((state.env = false), load()), { class: 'btn plain' })))))
}

function render() {
  const app = document.getElementById('app')
  const active = document.activeElement
  const keep = active?.dataset?.fk
  const caret = ['search', 'tcsearch', 'logsearch'].includes(active?.dataset?.fk) ? [active.selectionStart, active.selectionEnd] : undefined
  const parts = []
  if (!state.data) parts.push(topBar(), el('main', { class: 'body' }, state.error ? el('div', { class: 'notice err', role: 'alert' }, el('div', { class: 'm' }, el('b', {}, '증적을 불러오지 못했습니다'), state.error), btn('다시', () => load(), { class: 'btn plain' })) : el('div', { class: 'quiet', role: 'status' }, '불러오는 중…')))
  else {
    const body = state.screen.name === 'page' ? pageView() : state.screen.name === 'report' ? reportView() : state.screen.name === 'guide' ? guideView() : homeView()
    parts.push(topBar(), el('main', { class: 'body' }, ...noticeNode(), ...body))
  }
  const scroll = scrollY
  app.replaceChildren(...parts.filter(Boolean), ...(state.env && state.data ? [envDialog()] : []))
  scrollTo(0, scroll)
  if (document.getElementById('cv')) wireFlow()
  const key = pendingFocus || keep
  const target = key && [...app.querySelectorAll('[data-fk]')].find((node) => node.dataset.fk === key)
  target?.focus({ preventScroll: true })
  if (caret && target?.setSelectionRange) target.setSelectionRange(caret[0], caret[1])
  pendingFocus = ''
}

addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return
  if (state.env) return ((state.env = false), (pendingFocus = 'env'), render())
  if (state.del || state.confirmRun) return ((state.del = undefined), (state.confirmRun = ''), render())
  if (state.screen.name === 'report' || state.screen.name === 'guide') return go(state.screen.from ?? { name: 'home' }, 'back')
  if (state.screen.name === 'page') return go({ name: 'home' }, `page:${state.screen.id}`)
})

void (async () => {
  try { await call('events.subscribe', { events: ['service.progress'] }) } catch { /* 권한 없음 */ }
  await load()
  try { state.progress = await tool('progress') } catch { /* 서버 없음 */ }
  render()
})()

// 켜 둔 동안 15초마다 · 다시 보일 때 — AI 가 대화에서 쓴 증적을 조용히 반영한다(바뀐 게 있을 때만 다시 그림)
let refreshing = false
async function quietRefresh() {
  if (refreshing || document.hidden || state.env || state.del || state.confirmRun || running()) return
  refreshing = true
  try { await load(true) } finally { refreshing = false }
}
setInterval(quietRefresh, 15000)
document.addEventListener('visibilitychange', () => void quietRefresh())
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리센느 키우기</title>
<style>
/* 리센느 키우기 — 방향: "공연 직전의 대기실". 무대 조명과 거울 전구가 켜진 따뜻한 방.
   서명 = 전구(bulb) + 리본 배지. 주황빛 전구 한 가지가 무대 발밑 조명 · 대기실 거울 · 무대 받침 · 먹이 받는 중 표시에 같이 나오고,
   단계는 이미지 위에 겹치는 리본(별 개수)으로만 보인다. 강조색은 장미 한 가지, 졸업만 금색.
   컷아웃이 주인공 — UI 는 흰 카드 + 얇은 선으로 절제한다. */
:root {
  color-scheme: light;
  --paper:#f7f2f1; --sheet:#fffdfc; --well:#f2eaea;
  --rule:rgba(70,30,45,.10); --rule-strong:rgba(70,30,45,.20);
  --ink:#2b2125; --ink-2:#67585e; --ink-3:#76666d;
  --rose:#c13a64; --rose-strong:#a92b53; --on-rose:#ffffff; --rose-wash:#fce8ee; --rose-ring:rgba(193,58,100,.38);
  --gold:#e8b64a; --on-gold:#3a2600; --gold-text:#7a5400; --gold-wash:#fff3d4; --gold-ring:rgba(170,120,10,.42);
  --bad:#c0332b; --bad-wash:#fdecea;
  --glass:rgba(255,253,252,.9); --curtain:rgba(169,43,83,.17);
  --bulb:#ffd37a; --bulb-glow:rgba(255,184,70,.75);
  --wall-1:#f1e8ec; --wall-2:#e6dae0; --floor-1:#dcc7c1; --floor-2:#cfb5ae;
  --spot:rgba(255,249,238,.95); --cone:rgba(255,246,225,.6);
  --mirror-1:#fbf7fa; --mirror-2:#d9cbd6; --sofa:#b98a9a; --sofa-2:#a47585; --door:#d5c3c8; --rug:rgba(193,58,100,.13);
  --pod-1:#fff9f2; --pod-2:#e9d6cf; --fig-shadow:rgba(50,20,35,.26);
  --lift-sm:0 1px 2px rgba(40,15,25,.12),0 8px 22px rgba(40,15,25,.16);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper:#151013; --sheet:#201a1e; --well:#191316;
    --rule:rgba(255,225,235,.09); --rule-strong:rgba(255,225,235,.18);
    --ink:#f4ecef; --ink-2:#c0b1b7; --ink-3:#9b8c93;
    --rose:#f08cab; --rose-strong:#f08cab; --on-rose:#2b0f19; --rose-wash:#3a1824; --rose-ring:rgba(240,140,171,.42);
    --gold:#e8b64a; --on-gold:#2c1d00; --gold-text:#f0c565; --gold-wash:#3a2d12; --gold-ring:rgba(240,197,101,.42);
    --bad:#f2928b; --bad-wash:#3a1e1c;
    --glass:rgba(32,26,30,.88); --curtain:rgba(240,140,171,.13);
    --bulb:#ffd37a; --bulb-glow:rgba(255,184,70,.85);
    --wall-1:#2b2228; --wall-2:#241b21; --floor-1:#3b2e2f; --floor-2:#2f2425;
    --spot:rgba(255,214,170,.20); --cone:rgba(255,214,170,.09);
    --mirror-1:#3e3542; --mirror-2:#2a222e; --sofa:#6b4655; --sofa-2:#593846; --door:#3d3036; --rug:rgba(240,140,171,.12);
    --pod-1:#4a3b40; --pod-2:#352a2e; --fig-shadow:rgba(0,0,0,.45);
    --lift-sm:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.45);
  }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-font-smoothing:antialiased; }
html,body { margin:0; }
body { background:var(--paper); color:var(--ink); font:13.5px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; }
button { font:inherit; color:inherit; }
h1,h2,h3,p { margin:0; }
h1,h2,h3 { text-wrap:balance; }
p { text-wrap:pretty; }
img { -webkit-user-drag:none; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }


.panel { max-width:520px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
.hallwrap { max-width:1040px; margin:0 auto; padding:16px; }
.card { background:var(--sheet); border-radius:12px; box-shadow:0 0 0 1px var(--rule); }

/* 단추 */
.btn { height:40px; padding:0 16px; border-radius:10px; border:0; background:var(--sheet); box-shadow:0 0 0 1px var(--rule-strong); font-size:13.5px; font-weight:650; display:inline-flex; align-items:center; justify-content:center; gap:7px; cursor:pointer; white-space:nowrap; transition:transform .12s cubic-bezier(.23,1,.32,1), filter .12s, background .12s; }
.btn:hover:not(:disabled) { background:var(--well); }
.btn:active:not(:disabled) { transform:scale(.97); }
.btn:focus-visible, .link:focus-visible, .w:focus-visible, .dcard .face:focus-visible { outline:2px solid var(--rose-strong); outline-offset:2px; }
.btn.primary { background:var(--rose-strong); color:var(--on-rose); box-shadow:none; }
.btn.primary:hover:not(:disabled) { background:var(--rose-strong); filter:brightness(1.08); }
.btn.ghost { background:transparent; }
.btn.sm { height:34px; padding:0 12px; font-size:12.5px; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.link { border:0; background:none; padding:0 4px; min-height:40px; color:var(--rose-strong); font-size:12.5px; font-weight:650; cursor:pointer; border-radius:6px; display:inline-flex; align-items:center; gap:4px; }
.link:active { transform:scale(.97); }
.chip { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px 0 4px; border-radius:99px; background:var(--well); color:var(--ink-2); font-size:12px; font-weight:600; white-space:nowrap; }
.chip.nopad { padding:0 10px; }
.chip img { width:18px; height:18px; border-radius:99px; object-fit:cover; object-position:50% 20%; background:var(--sheet); }
.chip.rose { background:var(--rose-wash); color:var(--rose-strong); box-shadow:0 0 0 1px var(--rose-ring); }
.chip.gold { background:var(--gold-wash); color:var(--gold-text); box-shadow:0 0 0 1px var(--gold-ring); }
.chip.dash { background:transparent; box-shadow:inset 0 0 0 1px var(--rule-strong); color:var(--ink-3); }
.lab { font-size:11.5px; font-weight:600; letter-spacing:.06em; color:var(--ink-3); }

/* 단계 리본 — 이미지 위에 겹치는 소품. 별 개수 = 단계. 졸업이면 금색 + "졸업" */
.bdg { display:inline-flex; align-items:center; gap:2px; height:22px; padding:0 11px 0 7px; background:var(--rose-strong); color:var(--on-rose); border-radius:6px 0 0 6px; font-size:11.5px; font-weight:700; clip-path:polygon(0 0,100% 0,calc(100% - 6px) 50%,100% 100%,0 100%); white-space:nowrap; flex:none; }
.bdg svg { width:12px; height:12px; fill:currentColor; }
.bdg.grad { background:var(--gold); color:var(--on-gold); }
.bdg.sm { height:18px; padding:0 9px 0 5px; }
.bdg.sm svg { width:10px; height:10px; }
.bdg .t { margin-left:3px; }

/* ── 무대 ── */
.stagecard { overflow:hidden; }
.stagebox { position:relative; height:340px; overflow:hidden; background:linear-gradient(to right,var(--curtain) 0,transparent 20%,transparent 80%,var(--curtain) 100%),linear-gradient(to bottom,var(--wall-1) 0,var(--wall-2) 72%,var(--floor-1) 72%,var(--floor-2) 100%); }
.stagebox::before { content:""; position:absolute; inset:0; background:radial-gradient(ellipse 52% 88% at 50% 22%,var(--spot),transparent 72%); pointer-events:none; }
.stagebox::after { content:""; position:absolute; left:0; right:0; bottom:0; height:92px; background:linear-gradient(to top,color-mix(in srgb,var(--bulb) 38%,transparent),transparent); pointer-events:none; opacity:.8; }
.lights { position:absolute; left:14px; right:14px; bottom:10px; z-index:4; display:flex; justify-content:space-between; pointer-events:none; }
.lights i { width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#fffbe8,var(--bulb) 70%); box-shadow:0 0 8px 2px var(--bulb-glow); animation:tw 3.2s ease-in-out infinite; }
.lights i:nth-child(odd) { animation-delay:-1.6s; }
@keyframes tw { 50% { opacity:.62; } }
.hero { position:absolute; left:50%; bottom:34px; width:200px; height:220px; margin-left:-100px; z-index:2; }
.hero::before { content:""; position:absolute; left:26px; right:26px; bottom:-6px; height:20px; border-radius:50%; background:radial-gradient(closest-side,var(--fig-shadow),transparent); }
.hero img { position:relative; display:block; width:200px; height:220px; animation:bob 3.6s ease-in-out infinite; transform-origin:50% 100%; }
.hero .bdg { position:absolute; left:calc(50% + 28px); bottom:78px; z-index:3; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
@keyframes bob { 50% { transform:translateY(-2px); } }
.bubbles { position:absolute; top:12px; left:14px; right:14px; height:96px; z-index:5; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; pointer-events:none; }
.bub { position:relative; max-width:min(300px,100%); padding:9px 13px 13px; border-radius:14px; background:var(--sheet); box-shadow:0 0 0 1px var(--rule-strong),0 3px 10px rgba(40,15,25,.12); font-size:13.5px; line-height:1.45; animation:bin .22s cubic-bezier(.23,1,.32,1); }
.bub.old { padding:5px 11px; font-size:12px; color:var(--ink-2); opacity:.78; border-radius:12px; max-width:min(260px,100%); }
.bub.old span { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.bub .tm { position:absolute; left:13px; right:13px; bottom:5px; height:2px; border-radius:2px; background:var(--rose); transform-origin:left; animation:drain 30s linear forwards; opacity:.85; }
.bub.new::after { content:""; position:absolute; left:50%; top:100%; width:10px; height:10px; margin:-5px 0 0 -5px; background:var(--sheet); transform:rotate(45deg); box-shadow:2px 2px 2px -1px var(--rule-strong); }
@keyframes bin { from { opacity:0; transform:translateY(6px) scale(.97); } }
@keyframes drain { to { transform:scaleX(0); } }
.fx { position:absolute; top:150px; left:50%; z-index:6; margin-left:-30px; padding:2px 10px; border-radius:99px; background:var(--rose-wash); color:var(--rose-strong); box-shadow:0 0 0 1px var(--rose-ring); font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; animation:rise 2.4s cubic-bezier(.2,.7,.3,1) infinite; opacity:0; }
.fx:nth-of-type(2) { margin-left:22px; animation-delay:1.2s; }
@keyframes rise { 0% { opacity:0; transform:translateY(24px); } 15% { opacity:1; } 80% { opacity:1; } 100% { opacity:0; transform:translateY(-34px); } }
.st-loading .hero img, .st-error .hero img { filter:saturate(.3); opacity:.55; animation:none; }
.st-loading .hero img { animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.3; } }
.st-empty .hero { display:none; }
.slot { position:absolute; left:50%; bottom:40px; width:168px; height:32px; margin-left:-84px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--rule-strong); border:0; background:radial-gradient(closest-side,color-mix(in srgb,var(--bulb) 30%,transparent),transparent); z-index:2; }
.slot::after { content:"비어 있음"; position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; font-size:11.5px; font-weight:600; color:var(--ink-3); }

.who { padding:16px 16px 4px; }
.who-top { display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; }
.who h1 { font-size:19px; line-height:1.2; font-weight:700; letter-spacing:-.018em; }
.who h1 small { font-size:12.5px; font-weight:500; color:var(--ink-3); letter-spacing:0; margin-left:4px; }
.gr-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:16px; }
.gr-head .l { font-size:13px; color:var(--ink-2); }
.gr-head .l b { color:var(--ink); font-weight:650; }
.gr-head .pct { font-size:15px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.rail { position:relative; height:16px; margin:10px 8px 0; }
.rail .trk { position:absolute; left:0; right:0; top:6px; height:4px; border-radius:4px; background:var(--well); box-shadow:inset 0 0 0 1px var(--rule); }
.rail .fill { position:absolute; left:0; top:6px; height:4px; border-radius:4px; background:var(--rose); width:calc(var(--p) * 100%); transition:width .4s cubic-bezier(.23,1,.32,1); }
.rail.done .fill { background:var(--gold); }
.rail .nd { position:absolute; top:0; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--sheet); box-shadow:inset 0 0 0 1.5px var(--rule-strong); display:grid; place-items:center; color:var(--on-rose); }
.rail .nd svg { width:9px; height:9px; fill:currentColor; }
.rail .nd.on { background:var(--rose); box-shadow:none; }
.rail.done .nd.on { background:var(--gold); color:var(--on-gold); }
.rail .nd.now { box-shadow:0 0 0 3px var(--rose-wash),0 0 0 4.5px var(--rose-ring); }
.rail .nd.end { color:var(--ink-3); }
.rail .nd.end.on { color:var(--on-gold); }
.rlabs { position:relative; height:18px; margin:5px 8px 0; font-size:11.5px; color:var(--ink-3); }
.rlabs span { position:absolute; top:0; white-space:nowrap; }
.rlabs span.cur { color:var(--ink); font-weight:650; }
.gr-foot { margin-top:8px; font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.acts { display:flex; gap:8px; padding:12px 16px 16px; }
.acts .btn.primary { flex:1; }
.st-note { margin:16px 16px 0; }

.note { display:grid; grid-template-columns:20px minmax(0,1fr); gap:10px; padding:12px 14px; border-radius:10px; background:var(--well); font-size:12.5px; color:var(--ink-2); }
.note b { display:block; color:var(--ink); font-size:13.5px; font-weight:650; margin-bottom:2px; }
.note svg { margin-top:1px; color:var(--ink-3); }
.note .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.note.rose { background:var(--rose-wash); box-shadow:0 0 0 1px var(--rose-ring); }
.note.rose svg { color:var(--rose-strong); }
.note.gold { background:var(--gold-wash); box-shadow:0 0 0 1px var(--gold-ring); }
.note.gold svg { color:var(--gold-text); } .note.gold b { color:var(--gold-text); }
.note.bad { background:var(--bad-wash); box-shadow:0 0 0 1px color-mix(in srgb,var(--bad) 40%,transparent); }
.note.bad b, .note.bad svg { color:var(--bad); }
.note ol { margin:6px 0 0; padding-left:18px; }

.dexlink { display:flex; align-items:center; gap:12px; padding:12px 14px; width:100%; border:0; text-align:left; cursor:pointer; transition:transform .12s cubic-bezier(.23,1,.32,1); }
.dexlink:active { transform:scale(.985); }
.dexlink:focus-visible { outline:2px solid var(--rose-strong); outline-offset:2px; }
.dexlink .faces { display:flex; }
.dexlink .faces img { width:32px; height:32px; border-radius:50%; object-fit:cover; object-position:50% 20%; background:var(--well); box-shadow:0 0 0 2px var(--sheet); margin-left:-8px; }
.dexlink .faces img:first-child { margin-left:0; }
.dexlink .faces .emp { width:32px; height:32px; margin-left:-8px; border-radius:50%; background:var(--sheet); box-shadow:0 0 0 2px var(--sheet), inset 0 0 0 1.5px var(--rule-strong); }
.dexlink .tx { flex:1; min-width:0; }
.dexlink b { display:block; font-size:14px; font-weight:650; }
.dexlink span.s { font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; }

/* ── 도감 ── */
.top { display:flex; align-items:center; gap:10px; }
.top h1 { font-size:19px; font-weight:700; letter-spacing:-.018em; }
.top .n { font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.back { height:40px; padding:0 14px 0 10px; border-radius:10px; border:0; background:transparent; box-shadow:0 0 0 1px var(--rule-strong); font-size:13px; font-weight:650; display:inline-flex; align-items:center; gap:4px; cursor:pointer; transition:transform .12s cubic-bezier(.23,1,.32,1); }
.back:active { transform:scale(.97); }
.back:focus-visible { outline:2px solid var(--rose-strong); outline-offset:2px; }
.lead { font-size:12.5px; color:var(--ink-2); margin-top:-4px; }
.mgrp { display:flex; flex-direction:column; gap:10px; }
.mhead { display:flex; align-items:center; gap:10px; padding:2px 2px 0; }
.mhead img { width:30px; height:30px; border-radius:50%; object-fit:cover; object-position:50% 20%; background:var(--well); box-shadow:0 0 0 2px var(--sheet),0 0 0 3px var(--rule-strong); }
.mhead h2 { font-size:14.5px; font-weight:650; }
.mhead .c { margin-left:auto; font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.mhead::after { content:none; }
.dgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:0; padding:0; list-style:none; }
.dcard { display:flex; flex-direction:column; padding:8px 8px 10px; border-radius:12px; background:var(--sheet); box-shadow:0 0 0 1px var(--rule); min-width:0; }
.dcard.g { box-shadow:0 0 0 1.5px var(--gold-ring); }
.dart { position:relative; height:176px; border-radius:8px; overflow:hidden; background:radial-gradient(ellipse 80% 70% at 50% 28%,var(--spot),transparent 75%),linear-gradient(to bottom,var(--wall-1) 0,var(--wall-2) 100%); box-shadow:inset 0 0 0 1px var(--rule); }
.dart::after { content:""; position:absolute; left:0; right:0; bottom:0; height:30px; background:linear-gradient(to top,color-mix(in srgb,var(--bulb) 30%,transparent),transparent); }
.dart img.fig { position:absolute; left:50%; bottom:8px; width:152px; height:167px; margin-left:-76px; z-index:1; }
.dart .bdg { position:absolute; left:8px; bottom:12px; z-index:3; }
.dart .loc { position:absolute; right:6px; top:6px; z-index:3; }
.dart .loc .chip { height:22px; padding:0 9px; font-size:11.5px; background:var(--glass); box-shadow:0 0 0 1px var(--rule); }
.dart .loc .chip.rose { background:var(--rose-wash); box-shadow:0 0 0 1px var(--rose-ring); }
.dart .loc .chip.dash { background:var(--glass); }
.dcard.lk .dart .ph { border-color:var(--rule); }
.dart .stamp { position:absolute; left:8px; top:8px; z-index:3; }
.ph { position:absolute; inset:10px; border-radius:8px; border:1.5px dashed var(--rule-strong); display:grid; place-content:center; justify-items:center; gap:4px; color:var(--ink-3); font-size:12px; text-align:center; z-index:1; }
.ph svg { width:24px; height:24px; opacity:.6; }
.dmeta { padding:10px 4px 0; display:flex; flex-direction:column; gap:3px; min-width:0; }
.dmeta .nm { display:flex; align-items:baseline; gap:6px; min-width:0; }
.dmeta .nm b { font-size:14.5px; font-weight:650; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dmeta .nm small { font-size:12px; color:var(--ink-3); white-space:nowrap; }
.dmeta .pg { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; margin-top:2px; }
.dmeta .bar { flex:1; height:4px; border-radius:4px; background:var(--well); box-shadow:inset 0 0 0 1px var(--rule); overflow:hidden; min-width:24px; }
.dmeta .bar i { display:block; height:100%; background:var(--rose); border-radius:4px; }
.dmeta .gd { font-size:12px; color:var(--gold-text); font-weight:600; margin-top:2px; }
.dmeta .ed { margin-top:4px; margin-left:-4px; align-self:flex-start; }
.nf { display:grid; gap:6px; margin-top:4px; }
.nf .row { position:relative; }
.nf input { width:100%; height:40px; border-radius:10px; border:0; background:var(--well); box-shadow:inset 0 0 0 1px var(--rule-strong); padding:0 40px 0 12px; font:inherit; font-size:14px; color:var(--ink); }
.nf input:focus-visible { outline:2px solid var(--rose-strong); outline-offset:1px; }
.nf.err input { box-shadow:inset 0 0 0 1.5px var(--bad); }
.nf .cnt { position:absolute; right:10px; top:0; height:40px; display:flex; align-items:center; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.nf.err .cnt { color:var(--bad); font-weight:700; }
.nf .em { font-size:12px; color:var(--bad); font-weight:600; }
.nf .bt { display:flex; gap:6px; }
.nf .bt .btn { flex:1; padding:0 8px; }

/* ── 대기실 ── */
.hall { border-radius:16px; overflow:hidden; background:var(--sheet); box-shadow:0 0 0 1px var(--rule); }
.scene { position:relative; height:540px; overflow:hidden; background:linear-gradient(to bottom,var(--wall-1) 0,var(--wall-2) 58%,var(--floor-1) 58%,var(--floor-2) 100%); isolation:isolate; }
.scene::before { content:""; position:absolute; left:0; right:0; top:58%; height:5px; background:linear-gradient(to bottom,rgba(0,0,0,.10),transparent); z-index:0; }
.cone { position:absolute; top:0; width:30%; height:66%; background:linear-gradient(to bottom,var(--cone),transparent); clip-path:polygon(42% 0,58% 0,100% 100%,0 100%); pointer-events:none; z-index:0; }
.cone.a { left:20%; } .cone.b { left:50%; opacity:.7; }

     그래서 쓰는 프레임을 모두 여기 정적으로 적고, 스크립트는 이 img 의 src 를 읽어 쓴다.
     ★ 캐릭터를 추가하면(game.js CHARACTERS · assets/<id>/) 이 목록에 그 캐릭터의 프레임 12장을 더한다. 빠지면 화면에 이니셜 대체 표시가 보인다. -->
<div hidden aria-hidden="true" id="art">
  <img data-art="woni-a/idle" src="assets/woni-a/idle.webp" alt=""><img data-art="woni-a/walk1" src="assets/woni-a/walk1.webp" alt=""><img data-art="woni-a/walk2" src="assets/woni-a/walk2.webp" alt=""><img data-art="woni-a/walk3" src="assets/woni-a/walk3.webp" alt=""><img data-art="woni-a/closed" src="assets/woni-a/closed.webp" alt=""><img data-art="woni-a/open" src="assets/woni-a/open.webp" alt=""><img data-art="woni-a/happy" src="assets/woni-a/happy.webp" alt=""><img data-art="woni-a/surprise" src="assets/woni-a/surprise.webp" alt=""><img data-art="woni-a/f_normal" src="assets/woni-a/f_normal.webp" alt=""><img data-art="woni-a/f_smile" src="assets/woni-a/f_smile.webp" alt=""><img data-art="woni-a/f_laugh" src="assets/woni-a/f_laugh.webp" alt=""><img data-art="woni-a/f_surprise" src="assets/woni-a/f_surprise.webp" alt="">
  <img data-art="woni-b/idle" src="assets/woni-b/idle.webp" alt=""><img data-art="woni-b/walk1" src="assets/woni-b/walk1.webp" alt=""><img data-art="woni-b/walk2" src="assets/woni-b/walk2.webp" alt=""><img data-art="woni-b/walk3" src="assets/woni-b/walk3.webp" alt=""><img data-art="woni-b/closed" src="assets/woni-b/closed.webp" alt=""><img data-art="woni-b/open" src="assets/woni-b/open.webp" alt=""><img data-art="woni-b/happy" src="assets/woni-b/happy.webp" alt=""><img data-art="woni-b/surprise" src="assets/woni-b/surprise.webp" alt=""><img data-art="woni-b/f_normal" src="assets/woni-b/f_normal.webp" alt=""><img data-art="woni-b/f_smile" src="assets/woni-b/f_smile.webp" alt=""><img data-art="woni-b/f_laugh" src="assets/woni-b/f_laugh.webp" alt=""><img data-art="woni-b/f_surprise" src="assets/woni-b/f_surprise.webp" alt="">
  <img data-art="met/idle" src="assets/met/idle.webp" alt=""><img data-art="met/walk1" src="assets/met/walk1.webp" alt=""><img data-art="met/walk2" src="assets/met/walk2.webp" alt=""><img data-art="met/walk3" src="assets/met/walk3.webp" alt=""><img data-art="met/closed" src="assets/met/closed.webp" alt=""><img data-art="met/open" src="assets/met/open.webp" alt=""><img data-art="met/happy" src="assets/met/happy.webp" alt=""><img data-art="met/surprise" src="assets/met/surprise.webp" alt=""><img data-art="met/f_normal" src="assets/met/f_normal.webp" alt=""><img data-art="met/f_smile" src="assets/met/f_smile.webp" alt=""><img data-art="met/f_laugh" src="assets/met/f_laugh.webp" alt=""><img data-art="met/f_surprise" src="assets/met/f_surprise.webp" alt="">
  <img data-art="mei/idle" src="assets/mei/idle.webp" alt=""><img data-art="mei/walk1" src="assets/mei/walk1.webp" alt=""><img data-art="mei/walk2" src="assets/mei/walk2.webp" alt=""><img data-art="mei/walk3" src="assets/mei/walk3.webp" alt=""><img data-art="mei/closed" src="assets/mei/closed.webp" alt=""><img data-art="mei/open" src="assets/mei/open.webp" alt=""><img data-art="mei/happy" src="assets/mei/happy.webp" alt=""><img data-art="mei/surprise" src="assets/mei/surprise.webp" alt=""><img data-art="mei/f_normal" src="assets/mei/f_normal.webp" alt=""><img data-art="mei/f_smile" src="assets/mei/f_smile.webp" alt=""><img data-art="mei/f_laugh" src="assets/mei/f_laugh.webp" alt=""><img data-art="mei/f_surprise" src="assets/mei/f_surprise.webp" alt="">
</div>
<main id="main"></main>
<script src="game.js"></script>
<script src="persona.js"></script>
<script>
// 패널은 화면만 맡는다 — 상태와 저장은 서비스가 하고, 패널은 service.call 로 묻고 service.update 소식으로 받는다(표준 25번).
const G = globalThis.RISENE_PET_GAME
const P = globalThis.RISENE_PET_PERSONA

// ── 앱 통로 (postMessage) ──
let next = 0
const waiting = new Map()
function call(method, params) {
  const id = ++next
  parent.postMessage({ litecode: 1, id, method, params }, '*')
  return new Promise((resolve, reject) => waiting.set(id, { resolve, reject }))
}
addEventListener('message', ({ data }) => {
  if (!data || data.litecode !== 1) return
  if (data.event) return data.event === 'service.update' && apply(data.data)
  const w = waiting.get(data.id)
  if (!w) return
  waiting.delete(data.id)
  data.ok ? w.resolve(data.result) : w.reject(new Error(String(data.error)))
})
const serviceCall = (name, params) => call('service.call', { name, params })

// ── 도우미 ──
const $ = (s, r = document) => r.querySelector(s)
const still = matchMedia('(prefers-reduced-motion: reduce)').matches
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const clamp = (v, a, b) => Math.min(Math.max(v, a), b)
// 컷아웃 — #art 의 정적 <img> 가 앱에서 data: 주소로 바뀐 것만 쓴다. 없거나 아직 상대경로면 이니셜 대체 그림
const art = {}
document.querySelectorAll('img[data-art]').forEach((img) => { const src = img.getAttribute('src') || ''; if (src.startsWith('data:')) art[img.dataset.art] = src })
const stand = (id) => {
  const ch = G.CHARACTERS[id]
  const label = ([...(ch?.name ?? id)][0] ?? '?').replace(/[<>&]/g, '')
  return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220"><ellipse cx="100" cy="206" rx="46" ry="8" fill="#000" opacity=".12"/><circle cx="100" cy="112" r="66" fill="#c13a64" opacity=".16"/><text x="100" y="134" text-anchor="middle" font-size="72" font-weight="700" font-family="sans-serif" fill="#a92b53">${label}</text></svg>`)}`
}
const frame = (id, f) => art[`${id}/${f}`] ?? art[`${id}/idle`] ?? stand(id)
const star = '<svg aria-hidden="true"><use href="#star"/></svg>'
const ico = (n, cls = '') => `<svg class="${cls}" width="16" height="16" aria-hidden="true"><use href="#${n}"/></svg>`
const man = (n) => {
  if (n < 10000) return Math.round(n).toLocaleString()
  const v = n / 10000
  return `${v >= 100 ? Math.round(v).toLocaleString() : String(Math.round(v * 10) / 10)}만`
}
const dateText = (at) => { const d = new Date(at); return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}` }
/** 같은 글이면 건드리지 않는다 — 말풍선 타이머 · 입력 · 애니메이션이 다시 시작하지 않게 */
function setHTML(el, html) { if (!el || el._h === html) return false; el._h = html; el.innerHTML = html; return true }

// ── 상태 ──
let state = G.fresh()
let svcError = null
let said = null
let saidAt = 0
let firstApply = true
const ui = { view: 'stage', loaded: false, off: '', evt: null, unl: null, talkErr: '', newSet: [], dismissed: false }
/** 무대 · 대기실 · 칩에는 준비중(soon) 멤버를 넣지 않는다 — 도감만 전부 보인다 */
const roster = () => G.roster(state).filter((m) => !m.soon)
/** '새로 열림' 은 열렸고 아직 안 키운 캐릭터만 — 졸업한 쪽은 '졸업' 으로만 보인다 */
const isFresh = (c) => c.isNew && !c.locked && !c.graduated && !c.soon
const charOf = (m) => m.characters.find((c) => c.id === m.current)
const activeM = () => roster().find((m) => m.active)
const gradAt = (id) => state.graduated.find((g) => g.id === id)?.at
const badge = (c, sm, room) => {
  const n = c.graduated ? 3 : (c.stage ?? 0) + 1
  return `<span class="bdg${c.graduated ? ' grad' : ''}${sm ? ' sm' : ''}" role="img" aria-label="${c.graduated ? '졸업' : n + '단계'}">${star.repeat(n)}${c.graduated && !room ? '<span class="t">졸업</span>' : ''}</span>`
}
/** 단계 안의 진행(0~1) — stageOf 의 from/to 로 */
function progressOf(c) {
  if (c.graduated) return 1
  const s = G.stageOf(state, c.id)
  return clamp((c.feed - s.from) / (s.to - s.from), 0, 1)
}
const pctOf = (c) => Math.floor(progressOf(c) * 100)

function apply(snap) {
  if (!snap || !snap.state) return
  const before = state
  state = { ...G.fresh(), ...snap.state }
  svcError = snap.error || null
  ui.off = ''
  ui.loaded = true
  said = snap.said || null
  if (snap.event && !firstApply) onEvent(snap, before)
  if (said && said.at > saidAt) {
    saidAt = said.at
    if (!firstApply && ui.view === 'stage' && activeM() && said.by?.id === G.activeCharacter(state)) {
      speak(splitText(said.text), said.action, { strong: true, cap: 40 })
    }
  }
  firstApply = false
  render()
}

// 먹이 · 진화 · 졸업이 일어났을 때
function onEvent(snap, before) {
  const id = snap.id
  const fed = id ? (state.progress[id]?.feed ?? 0) - (before.progress[id]?.feed ?? 0) : 0
  if (snap.event === 'graduate') {
    const m = roster().find((x) => x.characters.some((c) => c.id === id))
    ui.dismissed = false
    ui.unl = { oldId: id, newId: snap.unlocked || null, member: m?.name ?? '' }
    ui.evt = null
    const fxs = $('#fxs'); if (fxs) fxs.innerHTML = ''
  } else {
    ui.evt = { kind: snap.event, until: Date.now() + 4000 }
    setTimeout(() => { if (ui.evt && Date.now() >= ui.evt.until) { ui.evt = null; renderStage() } }, 4100)
    if (ui.view === 'stage' && id === G.activeCharacter(state)) {
      pose('happy', 2500)
      if (fed > 0) fxFloat(`+${man(fed)}`)
      if (snap.event === 'evolve') { const b = $('.hero .bdg'); if (b) requestAnimationFrame(() => b.classList.add('pop')) }
    }
  }
}

// ── 그리기 ──
function render() {
  if (!ui.loaded && !ui.off) return
  if (ui.view === 'stage') renderStage()
  else if (ui.view === 'dex') renderDex()
  else syncRoom()
}
function go(view, extra = {}) {
  leaveRoom()
  resetSpeech()
  ui.view = view
  Object.assign(ui, extra)
  if (view === 'stage') buildStage()
  else if (view === 'dex') {
    ui.newSet = state.news.slice()
    ui.newSet.forEach((id) => serviceCall('seenDex', { id }).then(apply).catch(() => {}))
    renderDex()
  } else buildRoom()
  scrollTo(0, 0)
}
function setRoom(on) {
  if (on) { go('room'); serviceCall('fullscreen', { on: true }).catch(() => {}) }
  else { go('stage'); serviceCall('fullscreen', { on: false }).catch(() => {}) }
}

// ── 무대 ──
const LIGHTS = '<i></i>'.repeat(12)
function buildStage() {
  $('#main').innerHTML = `<div class="panel">
    <section class="card stagecard" aria-label="무대">
      <div id="mswSlot"></div><div id="unlSlot"></div>
      <div class="stagebox" id="sbox">
        <div class="bubbles" id="bubbles" aria-live="polite" aria-label="말풍선"></div>
        <div class="fxs" id="fxs" aria-hidden="true"></div>
        <div id="heroSlot"></div><div class="slot" id="slotEmpty" aria-hidden="true" hidden></div>
        <div class="lights" aria-hidden="true">${LIGHTS}</div>
      </div>
      <div id="whoSlot"></div><div id="msgSlot"></div><div id="actsSlot"></div>
    </section>
    <button class="card dexlink" id="dexOpen" type="button"></button>
  </div>`
  hero = null
  renderStage()
}
let hero = null // { id, el, img }
function switcherHTML(ms) {
  const anyOn = ms.some((m) => m.active)
  return `<div class="msw"><span class="lab" id="mlab">키우는 멤버</span><div class="mgrid" role="radiogroup" aria-labelledby="mlab">${ms.map((m, i) => {
    const c = charOf(m)
    const sub = m.active ? (m.finished ? '완주 · 안 자라요' : '키우는 중') : m.finished ? '완주' : '멈춤'
    return `<button type="button" class="mchip${m.finished ? ' fin' : ''}" role="radio" aria-checked="${m.active}" tabindex="${m.active || (!anyOn && i === 0) ? 0 : -1}" data-m="${esc(m.memberId)}">
      <span class="av"><img src="${frame(c.id, 'f_normal')}" alt=""></span><span class="tx"><b>${esc(m.name)}</b><small>${sub}</small></span></button>`
  }).join('')}</div></div>`
}
function renderStage() {
  if (ui.view !== 'stage') return
  const ms = roster()
  const m = ms.find((x) => x.active)
  const c = m ? charOf(m) : null
  const fin = !!m?.finished
  const dead = !!ui.off
  const sbox = $('#sbox')
  sbox.className = `stagebox ${!ui.loaded ? 'st-loading' : dead ? 'st-error' : c ? 'st-ok' : 'st-empty'}`
  setHTML($('#mswSlot'), ui.loaded && ms.length > 1 ? switcherHTML(ms) : '')
  setHTML($('#unlSlot'), unlHTML())
  syncHero(c)
  $('#slotEmpty').hidden = !!c
  let who = '', msg = '', acts = ''
  if (c) {
    const g = c.graduated
    const s = G.stageOf(state, c.id)
    const cur = g ? 3 : (c.stage ?? 0) + 1
    const p = g ? 1 : ((c.stage ?? 0) + progressOf(c)) / 3
    const pos = (i) => `left:${(i / 3) * 100}%`
    const nodes = [0, 1, 2].map((i) => `<span class="nd ${g || i < cur ? 'on' : ''} ${!g && i === cur - 1 ? 'now' : ''}" style="${pos(i)}">${star}</span>`).join('')
      + `<span class="nd end ${g ? 'on' : ''}" style="${pos(3)}"><svg width="10" height="10"><use href="#i-cap"/></svg></span>`
    const labs = ['1단계', '2단계', '3단계', '졸업'].map((t, i) => `<span class="${(i === cur - 1 && !g) || (g && i === 3) ? 'cur' : ''}" style="left:${(i / 3) * 100}%;transform:${i === 0 ? 'none' : i === 3 ? 'translateX(-100%)' : 'translateX(-50%)'}">${t}</span>`).join('')
    const head = g
      ? `<div class="gr-head"><span class="l"><b>졸업했어요</b> · ${dateText(gradAt(c.id))}</span><span class="pct" style="color:var(--gold-text)">100%</span></div>`
      : `<div class="gr-head"><span class="l"><b>${cur}단계</b> 에서 ${cur < 3 ? cur + 1 + '단계' : '졸업'}까지</span><span class="pct">${pctOf(c)}%</span></div>`
    const foot = g ? '3단계를 모두 먹고 졸업했어요.' : `${man(c.feed - s.from)} / ${man(s.to - s.from)} 토큰 · 캐시로 읽은 토큰은 반만 쳐요`
    const eating = ui.evt?.kind === 'eat' || ui.evt?.kind === 'evolve'
    const idx = m.characters.findIndex((x) => x.id === c.id) + 1
    who = `<div class="who">
      <div class="who-top"><h1>${esc(c.name)}</h1><span class="chip nopad">${esc(m.name)} · ${idx}/${m.characters.length}번째</span>
        ${eating ? `<span class="chip rose nopad">${ui.evt.kind === 'evolve' ? '진화했어요!' : '먹이 받는 중'}</span>` : ''}${isFresh(c) ? '<span class="chip rose nopad">새 친구</span>' : ''}</div>
      ${head}
      <div class="rail ${g ? 'done' : ''}" style="--p:${p}" role="img" aria-label="${g ? '졸업' : cur + '단계 ' + pctOf(c) + '%'}"><i class="trk"></i><i class="fill"></i>${nodes}</div>
      <div class="rlabs" aria-hidden="true">${labs}</div>
      <p class="gr-foot">${foot}</p></div>`
    if (fin) msg = `<div class="note gold st-note">${ico('i-check')}<div><b>${esc(m.name)}는 모든 캐릭터를 졸업했어요</b>먹이는 더 받지 않아요. 새 캐릭터가 추가되면 다시 자라요. 다른 멤버를 골라 키울 수 있어요.</div></div>`
    acts = `<div class="acts"><button type="button" class="btn primary" id="talk" ${dead ? 'disabled' : ''}>말 걸기</button><button type="button" class="btn" id="stop" ${dead ? 'disabled' : ''}>${ico('i-pause')}키우기 멈춤</button><button type="button" class="btn" id="full" aria-label="전체 화면">${ico('i-full')}</button></div>`
    if (ui.talkErr) acts += `<p class="st-note" role="alert" style="margin:-4px 16px 14px;font-size:12.5px;color:var(--bad)">${esc(ui.talkErr)}</p>`
  } else if (ui.loaded) {
    const one = ms.length === 1
    msg = one
      ? `<div class="note rose st-note" style="margin-bottom:12px">${ico('i-info')}<div><b>키우기를 멈췄어요</b>지금은 먹이를 받는 캐릭터가 없어요. 시작하면 ${esc(ms[0].name)}의 현재 캐릭터가 다시 자라요.<div class="row"><button type="button" class="btn sm primary" id="start" data-start="${esc(ms[0].memberId)}">키우기 시작</button></div>${ui.talkErr ? `<p role="alert" style="margin:6px 0 0;color:var(--bad)">${esc(ui.talkErr)}</p>` : ''}</div></div>`
      : `<div class="note rose st-note" style="margin-bottom:12px">${ico('i-info')}<div><b>키울 멤버를 골라 주세요</b>먹이는 고른 멤버의 현재 캐릭터만 받아요. 위에서 멤버를 고르면 바로 자라기 시작해요.</div></div>`
    acts = `<div class="acts"><button type="button" class="btn" id="full" style="flex:1">${ico('i-full')}전체 화면 (대기실)</button></div>`
  } else {
    msg = '<p class="st-note" style="margin:12px 16px 0;font-size:12.5px;color:var(--ink-3)" role="status">상태를 불러오는 중이에요…</p>'
  }
  if (ui.off) {
    msg = `<div class="note bad st-note" role="alert">${ico('i-warn')}<div><b>리센느 상태를 불러오지 못했어요</b>서비스가 응답하지 않아요: ${esc(ui.off)}<ol><li>설정 &gt; 플러그인에서 리센느 키우기를 껐다 켜세요.</li><li>그래도 안 되면 앱을 다시 시작하세요.</li></ol><div class="row"><button type="button" class="btn sm" id="retry">다시 시도</button></div></div></div>`
  } else if (svcError) {
    msg += `<div class="note bad st-note" role="alert">${ico('i-warn')}<div><b>사용량을 읽지 못했어요</b>그동안은 먹이가 쌓이지 않아요. (${esc(svcError)})</div></div>`
  }
  setHTML($('#whoSlot'), who)
  setHTML($('#msgSlot'), msg)
  setHTML($('#actsSlot'), acts)
  const all = ms.flatMap((x) => x.characters)
  const faces = all.slice(0, 6).map((x) => `<img src="${frame(x.id, 'f_normal')}" alt="" style="${x.locked ? 'filter:grayscale(1);opacity:.5' : ''}">`).join('')
  setHTML($('#dexOpen'), `<span class="faces" aria-hidden="true">${faces}</span><span class="tx"><b>도감</b><span class="s">졸업 ${all.filter((x) => x.graduated).length} · 전체 ${all.length}</span></span>${ms.flatMap((x) => x.characters).filter(isFresh).length ? `<span class="chip rose nopad nwdot">새 친구 ${ms.flatMap((x) => x.characters).filter(isFresh).length}</span>` : ''}${ico('i-next')}`)
}
function unlHTML() {
  const u = ui.unl
  if (!u || ui.dismissed) return ''
  const face = (id) => `<img src="${frame(id, 'f_normal')}" alt="">`
  const nm = (id) => G.CHARACTERS[id].name
  if (u.newId) return `<div class="unl" role="status"><span class="pair">${face(u.oldId)}${ico('i-next')}${face(u.newId)}</span><div><b>새 친구가 열렸어요</b><p>${esc(nm(u.oldId))} 졸업! 이제 ${esc(nm(u.newId))}를 키워요.</p></div><button type="button" class="x" id="unlX" aria-label="닫기">✕</button></div>`
  return `<div class="unl" role="status"><span class="pair">${face(u.oldId)}</span><div><b>${esc(nm(u.oldId))} 졸업!</b><p>${esc(u.member)}는 모든 캐릭터를 졸업했어요.</p></div><button type="button" class="x" id="unlX" aria-label="닫기">✕</button></div>`

  const ms = roster()
  if (ms.length !== RM.n) { leaveRoom(); buildRoom(); return }
  ms.forEach((m) => {
    const w = RM.w[m.memberId], c = charOf(m)
    if (!w) return
    if (w.swapping) return
    if (w.c.id !== c.id) swapWalker(w, m, c)
    else tag(w, m)
  })
  if (RM.sel) selectChar(RM.sel, true)
}
function swapWalker(w, m, c) {
  w.swapping = true
  const g = RM.g, s = RM.slots[m.memberId]
  toast(`${w.c.name} 졸업 — 새 친구 ${c.name}가 열렸어요`)
  door()
  moveTo(w, g.doorX, g.minB + 12, () => {
    w.el.classList.add('leave'); w.tg.classList.add('leave')
    RM.timers.push(setTimeout(() => {
      w.el.remove(); w.tg.remove(); delete RM.w[m.memberId]
      if (!RM.run) return
      const w2 = mkWalker(m, c, { x: g.doorX, b: g.minB + 12 }, 'enter')
      RM.timers.push(setTimeout(() => moveTo(w2, (s.lo + s.hi) / 2, s.b, () => { roam(w2); RM.timers.push(setTimeout(() => shout(w2), 2000)) }), 150))
    }, 420))
  })
}
/** 파이리는 대기실에서도 가끔 "파아~" 하며 불꽃을 뿜는다 — 잠깐 서서, 말풍선 조각과 함께 */
function shout(w) {
  if (!RM.run || RM.w[w.id] !== w || w.c.id !== 'woni-b') return
  if (RM.sel !== w.id && !w.swapping) {
    clearTimeout(w.to); w.walking = false; setFrame(w, 'idle'); w.el.classList.remove('flip')
    const bub = document.createElement('span'); bub.className = 'say'; bub.textContent = '파아~'
    const fig = $('.fig', w.el)
    fig.insertAdjacentHTML('beforeend', flameHTML())
    const f = fig.lastElementChild; f.style.setProperty('--u', RM.g.sz / 200)
    w.el.append(bub)
    RM.timers.push(setTimeout(() => { bub.remove(); f.remove(); w.to = setTimeout(() => roam(w), 400) }, 1500))
  }
  RM.timers.push(setTimeout(() => shout(w), 4500 + Math.random() * 2000))
}
function toast(t) {
  const e = $('#evt'); if (!e) return
  e.hidden = false; e.innerHTML = `<i class="dot"></i>${esc(t)}`
  clearTimeout(RM.evtT); RM.evtT = setTimeout(() => { e.hidden = true }, 3200)
}
function door() { const d = $('#door'); if (!d) return; d.classList.add('open'); setTimeout(() => d.classList.remove('open'), 1700) }
function selectChar(memberId, refresh) {
  const w = RM.w[memberId]; if (!w) return
  const m = roster().find((x) => x.memberId === memberId); if (!m) return
  const c = w.c, fin = m.finished
  RM.sel = memberId
  document.querySelectorAll('.w').forEach((e) => e.classList.toggle('sel', e.dataset.id === memberId))
  clearTimeout(w.to)
  const g = RM.g, pop = $('#pop')
  const stateChip = m.active && !fin ? '<span class="chip rose nopad">키우는 중 · 먹이 받아요</span>' : fin ? '<span class="chip gold nopad">완주 · 안 자라요</span>' : '<span class="chip nopad">멈춤 · 진행률 그대로</span>'
  const sub = fin ? '모든 캐릭터 졸업' : `${(c.stage ?? 0) + 1}단계 · ${pctOf(c)}%`
  const btn = m.active ? '<button type="button" class="btn" data-a="stop">키우기 멈춤</button>' : `<button type="button" class="btn primary" data-a="pick" ${fin ? 'disabled' : ''}>이 멤버 키우기</button>`
  pop.className = 'pop'; pop.hidden = false
  pop.innerHTML = `<div class="hd"><img src="${frame(c.id, 'f_normal')}" alt=""><div><b>${esc(c.name)}</b><span>${esc(m.name)} · ${sub}</span></div></div>
    <div class="st">${badge(c, true)}${stateChip}</div><div class="bt">${btn}</div>
    ${fin && !m.active ? '<p class="why">완주한 멤버는 먹이를 받지 않아요. 새 캐릭터가 추가되면 다시 자라요.</p>' : ''}
    <p class="why" id="popErr" role="alert" style="color:var(--bad)" hidden></p>`
  const pw = 216, cx = w.x + g.sz / 2, left = Math.max(8, Math.min(g.W - pw - 8, cx - pw / 2))
  pop.style.left = `${left}px`; pop.style.setProperty('--ax', `${cx - left}px`)
  pop.style.bottom = `${w.b + g.sz * 1.1 + 40}px`
  pop.onclick = (e) => {
    e.stopPropagation()
    const a = e.target.closest('[data-a]'); if (!a || a.disabled) return
    const pick = a.dataset.a === 'pick'
    serviceCall(pick ? 'select' : 'deselect', pick ? { member: memberId } : undefined).then((snap) => {
      toast(pick ? `${m.name}를 키워요` : '키우기를 멈췄어요 — 먹이를 받는 멤버가 없어요')
      apply(snap); closePop()
    }).catch((err) => { const p = $('#popErr'); if (p) { p.hidden = false; p.textContent = `바꾸지 못했어요: ${err.message}` } })
  }
  if (!refresh) { const f = pop.querySelector('.btn'); f && f.focus({ preventScroll: true }) }
}
function closePop() {
  const p = $('#pop'); if (p) p.hidden = true
  const id = RM.sel; RM.sel = null
  document.querySelectorAll('.w').forEach((e) => e.classList.remove('sel'))
  if (id && RM.w[id]) { const w = RM.w[id]; clearTimeout(w.to); w.to = setTimeout(() => roam(w), 900) }
}

// ── 입력 ──
const main = $('#main')
main.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t || t.disabled) return
  if (t.id === 'dexOpen') return go('dex')
  if (t.id === 'back') return go('stage')
  if (t.id === 'full') return setRoom(true)
  if (t.id === 'roomBack') return setRoom(false)
  if (t.id === 'unlX') { ui.dismissed = true; return renderStage() }
  if (t.id === 'retry') return load()
  if (t.id === 'stop') return void serviceCall('deselect').then(apply).catch(() => {})
  if (t.id === 'talk') {
    ui.talkErr = ''
    return void serviceCall('talk').then(() => renderStage()).catch((error) => {
      const msg = String(error.message)
      ui.talkErr = msg.includes('permission') ? '말 걸기는 chat 권한이 필요합니다 — 플러그인을 다시 설치해 허용해 주세요.' : '프로젝트를 연 상태에서 다시 눌러 주세요.'
      renderStage()
    })
  }
  if (t.dataset.start) return void serviceCall('select', { member: t.dataset.start }).then(apply).catch((err) => { ui.talkErr = `시작하지 못했어요: ${err.message}`; renderStage() })
  if (t.dataset.m) return void serviceCall('select', { member: t.dataset.m }).then(apply).catch((err) => { ui.talkErr = `멤버를 바꾸지 못했어요: ${err.message}`; renderStage() })
})
main.addEventListener('keydown', (e) => {
  const chip = e.target.closest && e.target.closest('[data-m]'); if (!chip) return
  const all = [...document.querySelectorAll('[data-m]')], i = all.indexOf(chip)
  const n = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? i + 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? i - 1 : null
  if (n === null) return
  e.preventDefault()
  const t = all[(n + all.length) % all.length]
  serviceCall('select', { member: t.dataset.m }).then((s) => { apply(s); const b = document.querySelector(`[data-m="${t.dataset.m}"]`); b && b.focus() }).catch(() => {})
})
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (ui.view === 'room') { if (RM.sel) { const id = RM.sel; closePop(); const b = document.querySelector(`.w[data-id="${id}"]`); b && b.focus() } else setRoom(false) }
  else if (ui.view === 'dex') go('stage')
})

// ── 시작 ──
async function load() {
  try { apply(await serviceCall('state')) } catch (error) {
    // service-off: 서비스가 아직 안 떴다(켜 주세요) · not-on: 이 프로젝트에서 켜지 않았다 — docs/guides/troubleshooting.md
    ui.off = String(error.message); ui.loaded = true; firstApply = false
    if (ui.view === 'stage') renderStage()
  }
}
;(async () => {
  go('stage')
  try { await call('events.subscribe', { events: ['service.update'] }) } catch { /* 권한 없음 */ }
  await load()
  document.addEventListener('visibilitychange', () => !document.hidden && serviceCall('state').then(apply).catch(() => {}))
})()
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQL 튜닝</title>
<style>
/* 토큰 · 규칙은 .interface-design/system.md. 색은 여기 토큰으로만 쓰고 다크는 값만 바꾼다 */
:root{--paper:#eef0f4;--sheet:#ffffff;--well:#f5f6f9;--rule:rgba(20,28,46,.10);--rule-strong:rgba(20,28,46,.18);--ink:#141a29;--ink-2:#566077;--ink-3:#8a93a6;--probe:#2d4fd6;--probe-wash:#eef1fd;--probe-ring:rgba(45,79,214,.28);--pass:#167a3f;--pass-wash:#e4f5ea;--bad:#c0332b;--bad-wash:#fdecea;--warn:#8a5200;--warn-wash:#fff6e8;--lift-sm:0 0 0 1px rgba(20,28,46,.06),0 2px 4px -1px rgba(20,28,46,.06),0 16px 32px -10px rgba(20,28,46,.26);--ease:cubic-bezier(.23,1,.32,1);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#0e1118;--sheet:#161b26;--well:#1b2130;--rule:rgba(255,255,255,.08);--rule-strong:rgba(255,255,255,.16);--ink:#e9ecf4;--ink-2:#a2abc0;--ink-3:#6e788f;--probe:#8fa4ff;--probe-wash:#1f2745;--probe-ring:rgba(143,164,255,.35);--pass:#63d28f;--pass-wash:#15301f;--bad:#f2928b;--bad-wash:#3a1e1c;--warn:#f0a53a;--warn-wash:rgba(240,165,58,.14);--lift-sm:0 0 0 1px rgba(255,255,255,.08),0 16px 32px -10px rgba(0,0,0,.7);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--probe);outline-offset:2px}
code{font-family:var(--mono);font-size:11.5px}
svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h1,h2,p{text-wrap:balance}
.preview h1,.preview h2,.preview h3{text-wrap:balance}


/* ── 패널 ── */
main{display:flex;flex-direction:column;gap:14px;padding:16px}
.top h1{margin:0;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.018em}
.where{margin:4px 0 0;color:var(--ink-3);font-size:12px;text-wrap:pretty;overflow-wrap:anywhere}
.where code{color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.card{background:var(--sheet);border-radius:12px;box-shadow:0 0 0 1px var(--rule);display:grid;min-width:0;transition:opacity .2s}
.list>.r:last-child{border-radius:0 0 12px 12px}
.ch{padding:14px 14px 12px;display:grid;gap:4px;min-width:0}
.ch h2{margin:0;font-size:14.5px;font-weight:650;line-height:1.3}
.sumline{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:12.5px;color:var(--ink-2)}
.chip.run{background:var(--probe-wash);color:var(--probe)}

/* 도구줄 */
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:0 14px 12px}
.tools .seg{padding:2px;border-radius:10px}
.tools .seg button{height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;white-space:nowrap;transition:transform .12s var(--ease),background-color .15s,color .15s}
.tools .seg button:hover{color:var(--ink)}
.tools .seg button:active{transform:scale(.97)}
.tools .seg button[aria-pressed=true]{background:var(--sheet);color:var(--ink);font-weight:650;box-shadow:0 0 0 1px var(--rule-strong)}
.tools .seg button b{font-weight:700;margin-left:3px}
.tools .seg button.bad[aria-pressed=false] b{color:var(--bad)}
.tools .sortwrap{display:flex;align-items:center}
.tools .lbl{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin-right:6px}

/* 갱신 상태 줄 — 목록 위 한 줄 */
.fresh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 10px;min-height:30px;margin:0 14px 6px}
.fresh .st{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:12px;color:var(--ink-3);min-width:0}
.fresh .st .sub{flex-basis:100%;text-wrap:pretty}
.fresh .st .badtxt{color:var(--bad);font-weight:650}
.fresh .st .chip{height:20px;font-size:11.5px}
.fresh .tiny{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--rule-strong);border-top-color:var(--probe);animation:spin .8s linear infinite;flex:none}
.fresh .btn{height:28px;padding:0 9px;font-size:12px}
.fresh .again{background:var(--bad-wash);color:var(--bad);box-shadow:none;font-weight:650}
.fresh .again:hover{background:var(--bad-wash);filter:brightness(.97)}
.card.stale>.list,.card.stale>.tools{opacity:.72}

/* 줄 문법 — 판정 · 대상 · 시각 / 핵심 숫자 · 결과서 열기 / 보류 이유 */
.list{list-style:none;margin:0;padding:0;display:grid}
.r{position:relative;display:grid;grid-template-columns:66px minmax(0,1fr);column-gap:10px;padding:11px 14px 8px;border-top:1px solid var(--rule);transition:background-color .15s}
.r:hover{background:var(--well)}
.r .c1{padding-top:1px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.r .c2{min-width:0;display:grid;gap:3px}
.l1{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 10px}
.tgt{min-width:0;overflow-wrap:anywhere;font-family:var(--mono);font-size:12.5px;font-weight:650;letter-spacing:-.01em}
.r.ok .tgt{font-weight:600}
.tgt.plain{font-family:inherit;font-size:13.5px;letter-spacing:0}
.when{flex:none;margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.l2{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;min-height:30px}
.l2 .num{display:flex;flex-wrap:wrap;gap:0 8px;font-size:12.5px;color:var(--ink-2);align-items:baseline;padding:4px 0}
.l2 .num b{font-size:13px;font-weight:700;color:var(--ink)}
.r.ok .l2 .num b{font-weight:600;color:var(--ink-2)}
.l2 .num .gain{color:var(--pass);font-weight:700}
.l2 .num .dim{color:var(--ink-3)}
.l2 .acts{margin-left:auto;gap:2px}
.l2 .acts .btn{height:28px;padding:0 10px}
.r.ok .l2 .acts .btn:not(.danger),.r.old .l2 .acts .btn:not(.danger){background:none;box-shadow:none;color:var(--probe);font-weight:500;padding:0 4px;height:30px}
.r.ok .l2 .acts .btn:not(.danger):hover,.r.old .l2 .acts .btn:not(.danger):hover{background:none;text-decoration:underline;text-underline-offset:2px}
.l2 .acts{align-items:center}
.l2 .acts .btn.danger{font-weight:500;opacity:.9}
.l2 .acts .btn.danger:disabled{opacity:.45}
.r .confirm{margin:4px 0 4px}
.r .confirm .busy{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.r .inline-err{margin:4px 0}
.gone{font-size:12px;color:var(--ink-3);padding:0 4px;min-height:30px;display:inline-flex;align-items:center;gap:6px}
.gone::before{content:"";width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.reason{margin:2px 0 4px;padding:7px 10px;border-radius:8px;background:var(--warn-wash);font-size:12.5px;line-height:1.5;display:grid;gap:2px;text-wrap:pretty}
.reason .at{font-weight:700;color:var(--warn)}
.reason .msg{color:var(--ink);overflow-wrap:anywhere}
.note{margin:0 0 4px;font-size:12px;color:var(--ink-3);text-wrap:pretty}
.note.warn{color:var(--warn)}
.note b{font-weight:650}
.chip.new{height:18px;padding:0 7px;font-size:11px;background:var(--probe-wash);color:var(--probe);box-shadow:inset 0 0 0 1px var(--probe-ring)}
.chip.new.fade{animation:fadeout .4s ease-out forwards}
@keyframes fadeout{to{opacity:0}}
.listnote{margin:0;padding:10px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3);text-wrap:pretty}

/* 비어 있음 · 읽는 중 · 오류 */
.empty{display:grid;gap:6px;padding:16px 14px;border-top:1px solid var(--rule)}
.empty b{font-size:13.5px;font-weight:650}
.empty p{margin:0;font-size:12.5px;color:var(--ink-2);text-wrap:pretty}
.empty .ex{margin-top:4px;padding:9px 12px;border-radius:8px;background:var(--well);box-shadow:inset 0 0 0 1px var(--rule);font-size:12.5px;display:grid;gap:3px}
.empty .ex span{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.empty .ex code{font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.svc,.errbox{padding:12px 14px;border-radius:12px;background:var(--bad-wash);display:grid;gap:8px;font-size:12.5px}
.svc b,.errbox b{color:var(--bad);font-size:13.5px;font-weight:650}
.svc p,.errbox p{margin:0;color:var(--ink);text-wrap:pretty;overflow-wrap:anywhere}
.loading{display:flex;align-items:center;gap:10px;padding:16px 14px;color:var(--ink-2);font-size:12.5px;border-top:1px solid var(--rule)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--rule-strong);border-top-color:var(--probe);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* 연결 · 표준 한 줄 (눌러서 펼침) */
.strip{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 6px 4px 12px;border-radius:12px;background:var(--well);box-shadow:inset 0 0 0 1px var(--rule);font-size:12.5px}
.strip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink-3);box-shadow:0 0 0 3px var(--rule)}
.strip .dot.ok{background:var(--pass);box-shadow:0 0 0 3px var(--pass-wash)}
.strip .dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-wash)}
.strip .txt{flex:1;min-width:0;color:var(--ink-2);overflow-wrap:anywhere;text-wrap:pretty}
.strip .txt b{color:var(--ink);font-weight:650}
.strip.bad{background:var(--bad-wash)}
.strip.bad .txt b{color:var(--bad)}
.strip .btn{flex:none}
.detail{display:grid;gap:8px;margin-top:-6px}
.drow{display:flex;align-items:center;gap:6px 10px;padding:8px 8px 8px 12px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--rule);background:var(--sheet);font-size:12.5px;flex-wrap:wrap}
.drow .nm{flex:1 1 160px;min-width:0;display:grid}
.drow .nm span{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.drow .nm .w{color:var(--warn);font-weight:600}
.drow .nm .w2{color:var(--bad)}
.detail .fallback{margin:0 2px}
.detail .fallback code{color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border:0;border-radius:8px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule-strong);font-size:12.5px;font-weight:600;white-space:nowrap;transition:transform .12s var(--ease),background-color .15s,box-shadow .15s,filter .15s,color .15s}
.btn:hover{background:var(--well)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;background:var(--sheet)}
.btn.primary{background:var(--probe);color:var(--sheet);box-shadow:none}
.btn.primary:hover{background:var(--probe);filter:brightness(1.1)}
.btn.primary:disabled{background:var(--probe);filter:none}
.btn.tint{background:var(--probe-wash);color:var(--probe);box-shadow:inset 0 0 0 1px var(--probe-ring)}
.btn.tint:hover{background:var(--probe-wash);box-shadow:inset 0 0 0 1px var(--probe)}
.btn.ghost{background:none;box-shadow:none;color:var(--ink-2);font-weight:500}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.btn.danger{color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 45%,var(--rule))}
.btn.danger:hover{background:var(--bad-wash)}
.btn.solid-bad{background:var(--bad);color:var(--sheet);box-shadow:none}
.btn.solid-bad:hover{background:var(--bad);filter:brightness(1.08)}
.btn.out{color:var(--probe)}
.btn.out.tint{background:var(--probe-wash)}
.link{border:0;background:none;padding:0 2px;min-height:28px;color:var(--probe);font-size:12px;font-weight:500;text-align:left;border-radius:4px}
.link:hover{text-decoration:underline;text-underline-offset:2px}
.link:active{opacity:.7}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.bad{background:var(--bad-wash);color:var(--bad)}
.chip.ok{background:var(--pass-wash);color:var(--pass)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.off{background:var(--well);color:var(--ink-2);font-weight:600;box-shadow:inset 0 0 0 1px var(--rule)}
.fallback{margin:-4px 2px 0;font-size:12px;color:var(--ink-3);text-wrap:pretty}
/* 규칙 */
.rules{display:grid}
.rules .lh{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);padding:0 2px 4px}
.rule{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;padding:6px 2px;border-top:1px solid var(--rule);font-size:12.5px;align-items:baseline}
.rule b{font:600 11.5px var(--mono);color:var(--ink)}
.rule span{color:var(--ink-2);text-wrap:pretty}
.rules .scroll{max-height:216px;overflow:auto}
.more{justify-self:start;margin:2px 0 -2px}
/* 확인 상자 */
.confirm{padding:12px;border-radius:8px;background:var(--bad-wash);display:grid;gap:10px;font-size:12.5px}
.confirm.caution{background:var(--warn-wash)}
.confirm b{display:block;color:var(--bad);font-size:13.5px;font-weight:650;margin-bottom:2px}
.confirm.caution b{color:var(--warn)}
.confirm p{margin:0;color:var(--ink);text-wrap:pretty}
.confirm .acts{justify-content:flex-end}
.inline-err{padding:8px 12px;border-radius:8px;background:var(--bad-wash);color:var(--bad);font-size:12.5px;text-wrap:pretty}
.inline-err b{font-weight:650}
.inline-err span{display:block;color:var(--ink);margin-top:1px}
/* 알림 한 줄 */
.toasts{position:fixed;left:16px;right:16px;bottom:16px;z-index:5;pointer-events:none}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;background:var(--sheet);box-shadow:var(--lift-sm);border-radius:12px;font-size:12.5px;overflow:hidden}
.toast .mk{flex:none;width:18px;height:18px;border-radius:50%;background:var(--pass-wash);color:var(--pass);display:grid;place-items:center}
.toast .mk svg{width:11px;height:11px;stroke-width:2.4}
.toast span.t{flex:1;min-width:0;text-wrap:pretty}
.toast .x{flex:none;width:26px;height:26px;border:0;background:none;border-radius:6px;color:var(--ink-3);display:grid;place-items:center}
.toast .x:hover{background:var(--well);color:var(--ink)}
.toast .life{position:absolute;left:0;bottom:0;height:2px;background:var(--pass);width:100%;transform-origin:left;animation:life 8s linear forwards}
@keyframes life{to{transform:scaleX(0)}}
/* 고치기 화면 */
.ed{display:flex;flex-direction:column;min-height:100vh}
.ed-top{display:flex;align-items:center;gap:10px;padding:12px 16px;box-shadow:inset 0 -1px 0 var(--rule);background:var(--sheet);flex-wrap:wrap}
.ed-top .tt{flex:1 1 200px;min-width:0}
.ed-top b{display:block;font-size:14.5px;font-weight:650}
.ed-top code{color:var(--ink-3);font-size:11.5px;overflow-wrap:anywhere}
.seg{display:inline-flex;background:var(--well);border-radius:8px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1px var(--rule)}
.seg button{height:26px;padding:0 11px;border:0;background:none;color:var(--ink-2);font-size:12px;border-radius:6px;transition:background-color .15s}
.seg button[aria-checked=true]{background:var(--sheet);color:var(--ink);font-weight:650;box-shadow:0 0 0 1px var(--rule-strong)}
.ed-body{flex:1;padding:14px 16px 0;display:grid;min-height:0}
textarea{width:100%;height:100%;min-height:310px;border:0;border-radius:12px;padding:12px;font:12.5px/1.65 var(--mono);resize:none;background:var(--sheet);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
textarea:focus{outline:0;box-shadow:0 0 0 1.5px var(--probe),0 0 0 4px var(--probe-wash)}
.preview{border-radius:12px;padding:4px 14px 10px;background:var(--sheet);box-shadow:0 0 0 1px var(--rule);min-height:310px;font-size:13px}
.preview h1,.preview h2,.preview h3{font-size:14.5px;margin:12px 0 4px}
.preview p{margin:6px 0}
.preview code{background:var(--well);border-radius:4px;padding:0 4px}
.preview ul{margin:4px 0;padding-left:18px}
.preview li{margin:3px 0}
.preview li b{font:600 11.5px var(--mono)}
.ed-note{padding:12px 16px 0}
.ed-foot{padding:12px 16px 16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.spin{animation:none}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z"/><path d="M14 3.5V8h4M9.5 12.5h5M9.5 16h5"/></symbol>

</svg>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<input id="picker" type="file" accept=".md,.markdown,text/markdown" hidden>

<script>
// SQL 튜닝 패널 (#1232, 목록 시안 2026-11-10) — 튜닝 이력 목록이 주인공: 프로젝트 sql-tuning-reports/ 의 결과서마다 meta.json 한 줄. 연결 · 사내 SQL 표준은 맨 위 한 줄(눌러서 펼침).
// 이력은 서비스의 `reports` 소식(결과서 폴더가 바뀜)과 패널이 다시 보일 때 읽는다. 규격은 .interface-design/system.md.
// 표준: 프로젝트 파일 `.litecode/sql-standard.md`(팀이 커밋해 같이 씀, 권한 projectWrite) 가 있으면 그것, 없으면 zip 에 든 스킬의
// references/sql-standard.md(플러그인 기본). 스킬도 같은 순서로 읽는다. 연결: 앱이 가진 설정 칸 값의 요약(비밀번호는 저장됐나만) ·
// [연결 확인](settingsCheck) · [연결 정보 고치기](앱의 설정 폼 — 값을 쓰는 입력칸은 패널에 없다). 앱과는 통로로만 말한다:
// parent.postMessage({ litecode: 1, id, method, params }) — 서비스의 service.call 한 가지

const PROJECT_FILE = '.litecode/sql-standard.md'
const BUNDLED = { skill: 'sql-tuning', path: 'references/sql-standard.md' }
const RULE_ID = /\b[A-Z]{2,5}-\d{1,4}\b/
const PREVIEW_RULES = 3
const REPORTS = 'sql-tuning-reports'
const REPORT_LIMIT = 30 // 최신 이만큼의 meta.json 만 읽는다
const QUIET_MS = 1500 // 마지막 소식 뒤 이만큼 조용하면 읽는다
const MAX_WAIT_MS = 5000 // 소식이 계속 와도 첫 소식 뒤 이 안에는 읽는다
const SLOW_MS = 300 // 읽기가 이보다 오래 걸릴 때만 "읽는 중…"
const MARK_MS = 6000 // 새로 · 바뀜 칩이 보이는 시간
const DB_NAMES = { oracle: 'Oracle', postgres: 'PostgreSQL' }
const LABELS = { db: 'DB 종류', host: '호스트', port: '포트', service: '서비스 이름', user: '아이디', password: '비밀번호', schema: '스키마' }
const ERRORS = {

const errorText = (error) => ERRORS[error?.message] || error?.message || String(error)
const isOff = (error) => error?.message === 'service-off'

let seq = 0
const waiting = new Map()
addEventListener('message', (event) => {
  const data = event.data
  if (event.source !== parent || !data || data.litecode !== 1) return
  if (data.event) {
    if (data.event === 'service.reports') onReportsNews()
    return
  }
  if (!waiting.has(data.id)) return
  const done = waiting.get(data.id)
  waiting.delete(data.id)
  done(data)
})
/** 앱 통로 한 번 — 실패면 Error(code) */
function rawCall(method, params) {
  const id = ++seq
  return new Promise((resolve, reject) => {
    waiting.set(id, (reply) => (reply.ok ? resolve(reply.result) : reject(new Error(reply.error))))
    parent.postMessage({ litecode: 1, id, method, params }, '*')
  })
}
// 앱과는 서비스(service.mjs)의 service.call 한 통로로만 말한다 — 서비스가 같은 이름의 앱 호출로 중계한다(service/index.mjs RELAY)
const RELAY = {
  'project.listDir': 'listDir',
  'project.readFile': 'readFile',
  'project.fileInfo': 'fileInfo',
  'project.writeFile': 'writeFile',
  'project.removeFile': 'removeFile',
  'project.openFile': 'openFile',
  'project.info': 'projectInfo',
  'settings.summary': 'settingsSummary',
  'settings.check': 'settingsCheck',
  'settings.open': 'settingsOpen',
  'skills.readFile': 'bundledFile',
  'reports.delete': 'deleteReport',
}
/** 호출 — 실패면 Error(code). 서비스가 앱 호출의 오류 코드를 { ok: false, code } 로 돌려준다 */
async function call(method, params) {
  const reply = await rawCall('service.call', { name: RELAY[method], params })
  if (!reply.ok) throw new Error(reply.code)
  return reply.value
}
/** 읽기용 호출 — 실패는 없는 것으로 보되, 서비스가 꺼진 것은 "읽지 못함" 이라 그대로 던진다 */
const soft = (promise) =>
  promise.catch((error) => {
    if (isOff(error)) throw error
    return undefined
  })

const state = {
  load: 'loading', // 'loading' | 'ready' | 'off'(서비스 꺼짐 — 표준 · 연결 · 이력을 읽지 못함)
  project: '',
  std: undefined, // { source: 'project' | 'bundled' | 'none', text, modified? }
  bundledRules: 0,
  conn: undefined, // settings.summary 또는 { error, code }
  check: undefined, // { text, isError } — 마지막 [연결 확인] 결과
  checkAt: undefined,
  busy: '',
  message: undefined, // { title, text? } — 표준 오류 한 줄
  connMessage: undefined, // 연결 오류 한 줄 (확인 · 설정 열기 호출이 던진 것)
  confirm: undefined, // { kind: 'reset' } | { kind: 'replace', name, text }
  more: false,
  edit: undefined, // { text, mode: 'edit' | 'preview' }
  fatal: undefined,

  filter: 'all', // 'all' | 'hold'

  marks: {}, // { 폴더이름: '새로' | '바뀜' } — 직전 읽기와 비교, 6초 뒤 사라진다
  markFade: false,
  openError: undefined,
  del: undefined, // { id, phase: 'ask' | 'busy' | 'error', text? } — 결과서 삭제 확인 · 진행 · 실패 (한 번에 한 줄)
}

/** 규칙 — 규칙 번호가 든 줄마다 첫 번호 하나 (같은 번호는 한 번) */
function rulesOf(text) {
  const seen = new Set()
  const rules = []
  for (const line of text.split('\n')) {
    const match = RULE_ID.exec(line)
    if (!match || seen.has(match[0])) continue
    seen.add(match[0])
    const rest = line.slice(match.index + match[0].length).replace(/^[\s*_:.)\]—-]+/, '').replace(/[*_`]/g, '').trim()
    rules.push({ id: match[0], text: rest })
  }
  return rules
}

const pad = (n) => String(n).padStart(2, '0')
const day = (ms) => {
  const date = new Date(ms)
  return `${pad(date.getMonth() + 1)}-${pad(date.getDate())}`
}
const clock = (ms) => {
  const date = new Date(ms)
  return `${pad(date.getHours())}:${pad(date.getMinutes())}`
}

async function loadStandard() {
  const [own, info, bundled] = await Promise.all([
    soft(call('project.readFile', { path: PROJECT_FILE })),
    soft(call('project.fileInfo', { path: PROJECT_FILE })),
    soft(call('skills.readFile', BUNDLED)),
  ])
  // zip 에 든 것(또는 0.7.0 패널이 덧씌운 것 — 스킬 폴더에 그대로 실린다)
  const shipped = typeof bundled?.text === 'string' && bundled.text.trim() ? bundled.text : ''
  state.bundledRules = shipped ? rulesOf(shipped).length : 0
  if (typeof own === 'string') state.std = { source: 'project', text: own, modified: info?.modified }
  else if (shipped) state.std = { source: 'bundled', text: shipped }
  else state.std = { source: 'none', text: '' }
}

async function loadConnection() {
  state.conn = await call('settings.summary').catch((error) => {
    if (isOff(error)) throw error
    return { error: errorText(error), code: error?.message }
  })
}

async function load() {
  state.load = 'loading'
  state.fatal = undefined
  render()
  void readReports()
  try {
    const info = await soft(call('project.info'))
    state.project = info?.name ?? ''
    await Promise.all([loadStandard(), loadConnection()])
    state.load = 'ready'
  } catch (error) {
    if (isOff(error)) state.load = 'off'
    else {
      state.load = 'ready'
      state.fatal = errorText(error)
    }
  }
  render()
}

/** 일을 하나 — 도는 동안 단추를 막고, 실패는 그 카드 안 한 줄 */
async function run(name, task, where = 'message') {
  state.busy = name
  state[where] = undefined
  render()
  try {
    await task()
  } catch (error) {
    if (isOff(error)) {
      state.load = 'off'
      state.edit = undefined
      state.confirm = undefined
    } else {
      state.detail = true
      state[where] = { title: where === 'connMessage' ? '연결 정보를 다루지 못했습니다' : '처리하지 못했습니다', text: errorText(error) }
    }
  }
  state.busy = ''
  render()
}

let toastTimer

    state.confirm = undefined
    await loadStandard()
    toast(state.std.source === 'bundled' ? '이 프로젝트 파일을 지웠습니다 — 새 대화부터 플러그인 기본 표준을 씁니다' : '이 프로젝트 파일을 지웠습니다 — 표준 없이 답합니다')

const picker = document.getElementById('picker')
picker.addEventListener('change', () => {
  const file = picker.files?.[0]
  picker.value = ''
  if (!file) return
  state.message = undefined
  if (!/\.(md|markdown)$/i.test(file.name)) {
    state.message = { title: '.md 파일이 아닙니다', text: 'Markdown(.md) 문서만 넣을 수 있습니다. Word · PDF · HWP 는 먼저 Markdown 으로 바꿔 주세요.' }
    return render()
  }
  const reader = new FileReader()
  reader.onload = () => {
    const text = String(reader.result ?? '')
    if (!text.trim()) state.message = { title: `${file.name} 가 비어 있습니다` }
    else state.confirm = { kind: 'replace', name: file.name, text }
    render()
  }
  reader.onerror = () => {
    state.message = { title: `${file.name} 를 읽지 못했습니다` }
    render()
  }
  reader.readAsText(file)
})

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === false) continue
    if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
    else if (key === 'class') node.className = value
    else node.setAttribute(key, value === true ? '' : value)
  }
  for (const child of children.flat(Infinity)) if (child !== undefined && child !== null && child !== false) node.append(child)
  return node
}
function icon(name) {
  const holder = document.createElement('template')
  holder.innerHTML = `<svg class="i" aria-hidden="true"><use href="#i-${name}"/></svg>`
  return holder.content.firstChild
}
/** 단추 — kind: primary · tint · ghost · danger · solid-bad · '' / out: 바깥(설정 · 파일)으로 나가는 화살표 / fk: 다시 그려도 포커스를 되돌릴 이름 */
const button = (text, onclick, { kind = '', out = false, disabled = false, fk } = {}) =>
  el('button', { type: 'button', class: ['btn', kind, out && 'out'].filter(Boolean).join(' '), disabled: disabled || !!state.busy, 'data-fk': fk, onclick }, text, out && icon('out'))
const inlineError = (item) => item && el('div', { class: 'inline-err', role: 'alert' }, el('b', {}, item.title), item.text && el('span', {}, item.text))
const offOnly = () => state.load === 'off'

function cancelConfirm() {
  const kind = state.confirm?.kind
  state.confirm = undefined
  render()
  document.querySelector(kind === 'reset' ? '[data-fk=resetask]' : '[data-fk=pick]')?.focus()
}

// --- 튜닝 이력 (sql-tuning-reports/<YYYYMMDD-HHMMSS>[-n]/ 의 meta.json 을 읽어 줄로 — 최신 30개만) ---

const FOLDER_NAME = /^\d{8}-\d{6}(-\d+)?$/
const reportFile = (id) => `${REPORTS}/${id}/index.html`
/** 폴더 이름의 시각 — 옛 결과서(meta.json 없음)의 시각 */
const atOfFolder = (id) => new Date(+id.slice(0, 4), +id.slice(4, 6) - 1, +id.slice(6, 8), +id.slice(9, 11), +id.slice(11, 13), +id.slice(13, 15))
function parseMeta(text) {
  try {
    const meta = JSON.parse(text)
    if (meta?.v !== 1 || (meta.verdict !== 'ok' && meta.verdict !== 'hold') || typeof meta.target !== 'string' || !(Date.parse(meta.at) > 0)) return undefined
    return meta
  } catch {
    return undefined
  }
}

async function fetchReports() {
  let names
  let truncated = false
  try {
    const listing = await call('project.listDir', { path: REPORTS })
    names = (listing?.entries ?? []).filter((entry) => entry.dir && FOLDER_NAME.test(entry.name)).map((entry) => entry.name)
    truncated = listing?.truncated === true
  } catch (error) {
    if (isOff(error)) throw error
    // 폴더가 아직 없는 것(튜닝한 적 없음)과 읽지 못한 것을 가른다 — 없으면 fileInfo 가 null, 있는데 못 읽으면 던진다
    const gone = await call('project.fileInfo', { path: REPORTS }).then(() => true, (inner) => (isOff(inner) ? Promise.reject(inner) : false))
    if (!gone) throw error
    names = []
  }
  names.sort().reverse()
  const rows = await Promise.all(
    names.slice(0, REPORT_LIMIT).map(async (id) => {
      const [text, info] = await Promise.all([soft(call('project.readFile', { path: `${REPORTS}/${id}/meta.json` })), soft(call('project.fileInfo', { path: reportFile(id) }))])
      const meta = typeof text === 'string' ? parseMeta(text) : undefined
      return { id, at: meta ? new Date(meta.at) : atOfFolder(id), meta, file: !!info && typeof info === 'object' }
    }),
  )
  return { rows, total: names.length, truncated, readAt: Date.now() }
}

const signature = (row) => JSON.stringify([row.file, row.meta && [row.meta.verdict, row.meta.target, row.meta.cost, row.meta.compare, row.meta.cause, row.meta.index_proposed]])
let markTimer
function markChanges(before, after) {
  if (!before) return
  const old = new Map(before.rows.map((row) => [row.id, signature(row)]))
  const marks = {}
  for (const row of after.rows) {
    if (!old.has(row.id)) marks[row.id] = '새로'
    else if (old.get(row.id) !== signature(row)) marks[row.id] = '바뀜'
  }
  if (Object.keys(marks).length === 0) return
  state.marks = marks
  state.markFade = false
  clearTimeout(markTimer)
  markTimer = setTimeout(() => {
    state.markFade = true
    render()
    markTimer = setTimeout(() => ((state.marks = {}), (state.markFade = false), render()), 400)
  }, MARK_MS)
}

let reading = false
let rereads = false
let slowTimer
/** 이력 읽기 — 겹치면 끝난 뒤 한 번 더. 실패는 자동 재시도 없이 낡은 목록으로 남긴다 */
async function readReports() {
  if (state.load === 'off') return
  if (reading) {
    rereads = true
    return
  }
  reading = true
  clearTimeout(slowTimer)
  slowTimer = setTimeout(() => ((state.slow = true), renderFresh()), SLOW_MS)
  try {
    const next = await fetchReports()
    markChanges(state.list, next)
    state.list = next
    if (state.del && state.del.phase !== 'busy' && !next.rows.some((row) => row.id === state.del.id)) state.del = undefined
    state.readFailed = false
    state.listError = undefined
  } catch (error) {
    if (isOff(error)) {
      state.load = 'off'
      state.edit = undefined
      state.confirm = undefined
    } else if (state.list) state.readFailed = true
    else state.listError = errorText(error)
  }
  reading = false
  state.slow = false
  clearTimeout(slowTimer)
  render()
  if (rereads) {
    rereads = false
    void readReports()
  }
}

// 서비스의 `reports` 소식 — 마지막 소식 뒤 1.5초 조용하면 한 번, 계속 와도 첫 소식 뒤 5초 안에는 반드시 한 번 읽는다
let firstNews
let debounce
function onReportsNews() {
  const now = Date.now()
  firstNews ??= now
  clearTimeout(debounce)
  debounce = setTimeout(() => {
    firstNews = undefined
    if (!document.hidden) void readReports()
  }, Math.max(0, Math.min(QUIET_MS, firstNews + MAX_WAIT_MS - now)))
}

const ago = (ms) => {
  const minutes = Math.floor((Date.now() - ms) / 60000)
  return minutes < 1 ? '방금' : minutes < 60 ? `${minutes}분 전` : `${Math.floor(minutes / 60)}시간 전`
}
function when(date) {
  const start = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime()
  const gap = start(new Date()) - start(date)
  return gap === 0 ? `오늘 ${clock(date)}` : gap === 864e5 ? `어제 ${clock(date)}` : `${day(date)} ${clock(date)}`
}
const num = (n) => Number(n).toLocaleString('en-US')

function freshView() {
  const list = state.list
  const refresh = (disabled) => el('button', { type: 'button', class: 'btn ghost', 'data-fk': 'refresh', disabled, 'aria-label': '튜닝 이력 새로 고침', onclick: () => void readReports() }, icon('retry'), '새로 고침')
  let left
  let right
  if (state.slow) {
    left = [el('span', { class: 'tiny', 'aria-hidden': 'true' }), el('span', {}, '읽는 중…')]
    right = refresh(true)
  } else if (state.readFailed) {
    left = [el('span', { class: 'chip warn' }, '낡은 목록'), el('span', { class: 'badtxt' }, '갱신하지 못했습니다'), el('span', { class: 'sub' }, `${clock(list.readAt)} 에 읽은 튜닝 이력을 보이고 있습니다. 대화에서 바뀐 것은 아직 안 보일 수 있습니다.`)]
    right = el('button', { type: 'button', class: 'btn again', 'data-fk': 'refresh', onclick: () => void readReports() }, icon('retry'), '다시')
  } else {
    left = el('span', {}, `${ago(list.readAt)} 갱신 · ${clock(list.readAt)}`)
    right = refresh(false)
  }
  return el('div', { class: 'fresh', role: 'status', 'aria-live': 'polite' }, el('div', { class: 'st' }, left), right)
}
/** 갱신 상태 줄만 다시 그린다 — 60초 타이머 · 읽는 중 표시 */
function renderFresh() {
  const node = document.querySelector('.fresh')
  if (!node || !state.list) return
  const keep = document.activeElement?.dataset?.fk === 'refresh'
  node.replaceWith(freshView())
  if (keep) document.querySelector('.fresh [data-fk=refresh]:not(:disabled)')?.focus()
}

/** 결과서 삭제 — [삭제] 를 누르면 줄 안에 확인 상자(포커스는 [취소]), 확인하면 서비스가 폴더째 지우고 패널은 바로 목록을 다시 읽는다 */
function askDelete(id) {
  if (state.del?.phase === 'busy') return
  state.del = { id, phase: 'ask' }
  render()
  document.querySelector('[data-fk=delcancel]')?.focus()
}
function cancelDelete() {
  const id = state.del?.id
  state.del = undefined
  render()
  document.querySelector(`[data-fk="del:${CSS.escape(id ?? '')}"]`)?.focus()
}
async function confirmDelete() {
  const id = state.del?.id
  if (!id || state.del.phase === 'busy') return
  state.del = { id, phase: 'busy' }
  render()
  try {
    await call('reports.delete', { id })
    toast('결과서를 삭제했습니다')
  } catch (error) {
    if (isOff(error)) {
      state.load = 'off'
      state.del = undefined
      return render()
    }
    if (error?.message === 'not-found') {
      state.del = undefined
      toast('이미 없는 결과서입니다')
    } else state.del = { id, phase: 'error', text: '다시 해 보세요' }
  }
  await readReports()
  if (state.del?.phase === 'busy') state.del = undefined
  render()
}
const deleteBox = (row, label, del) => {
  const busy = del.phase === 'busy'
  return el(
    'div',
    { class: 'confirm', role: 'alertdialog', 'aria-labelledby': 'del-t' },
    el('div', {}, el('b', { id: 'del-t' }, `${row.meta ? `"${label}"` : when(row.at)} 결과서를 삭제할까요?`), busy ? el('p', { class: 'busy', role: 'status' }, el('span', { class: 'spin', 'aria-hidden': 'true' }), '삭제하는 중…') : el('p', {}, '결과서 폴더의 파일이 모두 지워집니다. 되돌릴 수 없습니다.')),
    el('div', { class: 'acts' }, el('button', { type: 'button', class: 'btn', 'data-fk': 'delcancel', disabled: busy, onclick: cancelDelete }, '취소'), el('button', { type: 'button', class: 'btn solid-bad', 'data-fk': 'delgo', disabled: busy, onclick: () => void confirmDelete() }, '삭제')),

addEventListener('keydown', (event) => {
  if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return
  const here = event.target?.closest?.('[data-nav]')
  if (!here) return
  const all = [...document.querySelectorAll('[data-nav]')]
  const to = all[all.indexOf(here) + (event.key === 'ArrowDown' ? 1 : -1)]
  if (!to) return
  event.preventDefault()
  to.focus()
  to.scrollIntoView({ block: 'nearest' })
})

/** 아주 작은 Markdown 미리보기 — 제목 · 목록 · 굵게 · 코드만 (글은 모두 이스케이프한다) */
function markdown(text) {
  const box = el('div', { class: 'preview', role: 'document', 'aria-label': '미리보기' })
  let list
  const inline = (line) => {
    const parts = line.split(/(\*\*[^*]+\*\*|`[^`]+`)/)
    return parts.map((part) => (/^\*\*.+\*\*$/.test(part) ? el('b', {}, part.slice(2, -2)) : /^`.+`$/.test(part) ? el('code', {}, part.slice(1, -1)) : part))
  }
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd()
    const heading = /^(#{1,3})\s+(.*)$/.exec(line)
    const item = /^\s*[-*+]\s+(.*)$/.exec(line) ?? /^\s*\d+[.)]\s+(.*)$/.exec(line)
    if (item) {
      if (!list) box.append((list = el('ul')))
      list.append(el('li', {}, inline(item[1])))
      continue
    }
    list = undefined
    if (heading) box.append(el(`h${heading[1].length}`, {}, inline(heading[2])))
    else if (line.trim()) box.append(el('p', {}, inline(line)))
  }
  return box
}

    ),
    el('div', { class: 'ed-body' }, edit.mode === 'edit' ? area : markdown(edit.text)),
    el('div', { class: 'ed-note' }, el('div', { class: 'confirm caution' }, el('p', {}, el('b', { style: 'display:inline' }, '저장하면 이 프로젝트 파일이 바뀝니다.'), ' 새 대화부터 적용되고, 커밋하면 팀원에게도 같은 표준이 쓰입니다.'))),
    state.message && el('div', { class: 'ed-note' }, inlineError(state.message)),
    el(
      'div',
      { class: 'ed-foot' },
      button('취소', leave),
      el(
        'div',
        { class: 'acts' },
        button('파일로 열기', () => void call('project.openFile', { path: PROJECT_FILE }).catch((error) => ((state.message = { title: '파일을 열지 못했습니다', text: errorText(error) }), render())), { kind: 'ghost', out: true, disabled: !own }),
        button(state.busy === 'save' ? '저장하는 중…' : '저장', () => void run('save', () => saveStandard(edit.text, () => (state.edit = undefined))), { kind: 'primary', disabled: !edit.text.trim(), fk: 'save' }),
      ),
    ),
  )
}

function mainView() {
  const off = offOnly()
  return el(
    'main',
    {},
    el('header', { class: 'top' }, el('h1', {}, 'SQL 튜닝'), el('p', { class: 'where' }, state.project ? ['프로젝트 ', el('code', {}, state.project), ' 의 튜닝 결과입니다.'] : '이 프로젝트의 튜닝 결과입니다.')),
    off &&
      el(
        'div',
        { class: 'svc', role: 'alert' },
        el('b', {}, 'SQL 튜닝 서비스가 꺼져 있습니다'),
        el('p', {}, '설정 › 기능 › 플러그인 에서 SQL 튜닝을 켠 뒤 [다시 확인] 을 누르세요. 켜기 전에는 튜닝 이력과 연결 정보를 읽을 수 없습니다.'),
        el('div', { class: 'acts' }, el('button', { type: 'button', class: 'btn', 'data-fk': 'retry', onclick: () => void load() }, '다시 확인')),
      ),
    state.fatal && inlineError({ title: '화면을 그리지 못했습니다', text: state.fatal }),
    off || state.fatal ? undefined : [stripView(), state.detail && state.load !== 'loading' && detailView(), historyCard()],
  )
}

function render() {
  const app = document.getElementById('app')
  const fk = document.activeElement?.dataset?.fk
  app.replaceChildren(state.edit ? editView() : mainView())
  if (state.confirm && fk !== 'cancel') app.querySelector('[data-fk=cancel]')?.focus()
  else if (fk) {
    const target = app.querySelector(`[data-fk="${CSS.escape(fk)}"]`)
    if (target && !target.disabled) target.focus()
  }
}
addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && state.confirm) cancelConfirm()
  else if (event.key === 'Escape' && state.del?.phase === 'ask') cancelDelete()
})
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return
  void readReports()
  renderFresh()
})
setInterval(() => {
  if (!document.hidden) renderFresh()
}, 60000)

void load()
void rawCall('events.subscribe', { events: ['service.reports'] }).catch(() => {})
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SQL 튜닝</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1f26;--sub:#5f6470;--faint:#80868f;--line:#e3e5ea;--soft:#eef0f4;--ok:#23774a;--ok-bg:#e9f6ee;--bad:#a12a2f;--bad-bg:#fdecec;--warn:#8a5200;--warn-bg:#fff6e8;--btn:#1c1f26;--btn-text:#fff;--accent:#3566d6;--accent-bg:#e4edfd;--rule:#6b4cc6}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--card:#1f2228;--text:#e8eaf0;--sub:#b0b6c1;--faint:#8a909c;--line:#2e323a;--soft:#2a2e36;--ok:#6fd39b;--ok-bg:#1d3327;--bad:#ff8a8f;--bad-bg:#3a2224;--warn:#f0a53a;--warn-bg:rgba(240,165,58,.14);--btn:#e8eaf0;--btn-text:#16181d;--accent:#7ea4f4;--accent-bg:rgba(107,151,242,.18);--rule:#b29cf3;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{display:flex;flex-direction:column;gap:12px;padding:14px;min-height:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{margin:0;font-size:12px;font-weight:600;color:var(--sub)}
.sub{font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.faint{color:var(--faint)}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent);white-space:nowrap}
.tag.off{background:var(--soft);color:var(--sub)}
code{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border-radius:5px;padding:0 5px}
.rule{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--line)}
.rule b{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--rule)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;overflow-wrap:anywhere}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
button{font:inherit;font-size:12.5px;cursor:pointer;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);white-space:nowrap}
button.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-text);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.msg{padding:8px 10px;border-radius:8px;font-size:12.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.note{margin:0;font-size:11.5px;color:var(--faint)}
/* 고치기 */
.edit{display:flex;flex-direction:column;height:100vh}
.edit-top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.edit-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.edit-title b{font-size:13.5px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px}
.seg button{height:26px;padding:0 10px;border:0;background:transparent;color:var(--sub);font-size:12px;border-radius:6px}
.seg button[aria-checked=true]{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.edit-body{flex:1;display:flex;min-height:0;padding:12px 14px}
textarea{flex:1;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;resize:none;background:var(--card);color:var(--text)}
textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.preview{flex:1;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:var(--card);font-size:13px}
.preview h1,.preview h2,.preview h3{color:var(--text);margin:12px 0 4px}
.preview h1{font-size:15px}.preview h2{font-size:14px}.preview h3{font-size:13px}
.preview ul{margin:4px 0;padding-left:18px}
.preview p{margin:6px 0}
.edit-note{padding:0 14px 8px}
.edit-foot{padding:10px 14px 14px;display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"><main><div class="card sub">불러오는 중…</div></main></div>
<input id="picker" type="file" accept=".md,.markdown,text/markdown" hidden>
<script>
// SQL 튜닝 패널 (#1232, 시안 FfLzCjANQdZ6FMwVV8ekUV ④ · ④-2) — 카드 두 개: 이 프로젝트에 쓰이는 사내 SQL 표준 · DB 연결.
// 표준: 프로젝트 파일 `.litecode/sql-standard.md`(팀이 커밋해 같이 씀, 권한 projectWrite) 가 있으면 그것, 없으면 zip 에 든 스킬의
// references/sql-standard.md(플러그인 기본). 스킬도 같은 순서로 읽는다. 연결: 앱이 가진 설정 칸 값의 요약(비밀번호는 저장됐나만) ·
// [연결 확인](settingsCheck) · [연결 정보 고치기](앱의 설정 폼). 앱과는 통로로만 말한다: parent.postMessage({ litecode: 1, id, method, params }) — 서비스의 service.call 한 가지

const PROJECT_FILE = '.litecode/sql-standard.md'
const BUNDLED = { skill: 'sql-tuning', path: 'references/sql-standard.md' }
const RULE_ID = /\b[A-Z]{2,5}-\d{1,4}\b/
const PREVIEW_RULES = 3
const DB_NAMES = { oracle: 'Oracle', postgres: 'PostgreSQL' }
const LABELS = { db: 'DB 종류', host: '호스트', port: '포트', service: '서비스 이름', user: '아이디', password: '비밀번호', schema: '스키마' }
const ERRORS = {
  'no-project': '열린 프로젝트가 없습니다',
  'not-on': '이 프로젝트에서 SQL 튜닝이 꺼져 있습니다',
  'permission-missing': '이 버전의 플러그인에 필요한 권한이 없습니다 — 다시 설치해 주세요',
  'path-unsafe': '.litecode 폴더가 프로젝트 밖을 가리키거나 파일이 링크라서 쓰지 않았습니다',
  'file-too-large': '문서가 너무 큽니다 (512KB 까지)',
  'not-text': 'UTF-8 글이 아닙니다',
  'no-settings': '연결 정보 칸이 없습니다',
  'io-failed': '앱이 요청을 처리하지 못했습니다',
  'check-unavailable': '이 버전의 앱은 서비스가 등록한 서버의 [연결 확인] 을 아직 지원하지 않습니다',
  'no-window': '이 플러그인 탭이 보이는 상태에서 다시 눌러 주세요',
  'service-off': 'SQL 튜닝 서비스가 켜져 있지 않습니다 — 설정 › 기능 › 플러그인에서 켜 주세요',
  'service-failed': '서비스가 요청을 처리하지 못했습니다',
}
const errorText = (error) => ERRORS[error?.message] || error?.message || String(error)

let seq = 0
const waiting = new Map()
addEventListener('message', (event) => {
  const data = event.data
  if (event.source !== parent || !data || data.litecode !== 1 || !waiting.has(data.id)) return
  const done = waiting.get(data.id)
  waiting.delete(data.id)
  done(data)
})
/** 앱 통로 한 번 — 실패면 Error(code) */
function rawCall(method, params) {
  const id = ++seq
  return new Promise((resolve, reject) => {
    waiting.set(id, (reply) => (reply.ok ? resolve(reply.result) : reject(new Error(reply.error))))
    parent.postMessage({ litecode: 1, id, method, params }, '*')
  })
}
// 앱과는 서비스(service.mjs)의 service.call 한 통로로만 말한다 — 서비스가 같은 이름의 앱 호출로 중계한다(service/index.mjs RELAY)
const RELAY = {
  'project.readFile': 'readFile',
  'project.fileInfo': 'fileInfo',
  'project.writeFile': 'writeFile',
  'project.removeFile': 'removeFile',
  'project.openFile': 'openFile',
  'project.info': 'projectInfo',
  'settings.summary': 'settingsSummary',
  'settings.check': 'settingsCheck',
  'settings.open': 'settingsOpen',
  'skills.readFile': 'bundledFile',
}
/** 호출 — 실패면 Error(code). 서비스가 앱 호출의 오류 코드를 { ok: false, code } 로 돌려준다 */
async function call(method, params) {
  const reply = await rawCall('service.call', { name: RELAY[method], params })
  if (!reply.ok) throw new Error(reply.code)
  return reply.value
}

const state = {
  project: '',
  std: undefined, // { source: 'project' | 'bundled' | 'none', text, modified? }
  bundledRules: 0,
  conn: undefined, // settings.summary
  check: undefined, // { text, isError }
  busy: '',
  message: undefined, // { tone, text } — 표준 카드
  connMessage: undefined,
  confirm: undefined, // { kind: 'reset' } | { kind: 'replace', name, text }
  edit: undefined, // { text, mode: 'edit' | 'preview' }
}

/** 규칙 — 규칙 번호가 든 줄마다 첫 번호 하나 (같은 번호는 한 번) */
function rulesOf(text) {
  const seen = new Set()
  const rules = []
  for (const line of text.split('\n')) {
    const match = RULE_ID.exec(line)
    if (!match || seen.has(match[0])) continue
    seen.add(match[0])
    const rest = line.slice(match.index + match[0].length).replace(/^[\s*_:.)\]—-]+/, '').replace(/[*_`]/g, '').trim()
    rules.push({ id: match[0], text: rest })
  }
  return rules
}

const day = (ms) => {
  const date = new Date(ms)
  return `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`
}

async function loadStandard() {
  const [own, info, bundled] = await Promise.all([
    call('project.readFile', { path: PROJECT_FILE }).catch(() => undefined),
    call('project.fileInfo', { path: PROJECT_FILE }).catch(() => undefined),
    call('skills.readFile', BUNDLED).catch(() => undefined),
  ])
  // zip 에 든 것(또는 0.7.0 패널이 덧씌운 것 — 스킬 폴더에 그대로 실린다)
  const shipped = typeof bundled?.text === 'string' && bundled.text.trim() ? bundled.text : ''
  state.bundledRules = shipped ? rulesOf(shipped).length : 0
  if (typeof own === 'string') state.std = { source: 'project', text: own, modified: info?.modified }
  else if (shipped) state.std = { source: 'bundled', text: shipped }
  else state.std = { source: 'none', text: '' }
}

async function loadConnection() {
  state.conn = await call('settings.summary').catch((error) => ({ error: errorText(error) }))
}

async function load() {
  const info = await call('project.info').catch(() => undefined)
  state.project = info?.name ?? ''
  await Promise.all([loadStandard(), loadConnection()])
  render()
}

/** 일을 하나 — 도는 동안 버튼을 막고, 실패는 그 카드 아래 한 줄 */
async function run(name, task, where = 'message') {
  state.busy = name
  state[where] = undefined
  render()
  try {
    await task()
  } catch (error) {
    state[where] = { tone: 'bad', text: errorText(error) }
  }
  state.busy = ''
  render()
}

async function saveStandard(text, done) {
  await call('project.writeFile', { path: PROJECT_FILE, text })
  await loadStandard()
  state.message = { tone: 'ok', text: `${PROJECT_FILE} 를 저장했습니다 — 새 대화부터 적용됩니다` }
  done?.()
}

function resetStandard() {
  return run('reset', async () => {
    await call('project.removeFile', { path: PROJECT_FILE })
    state.confirm = undefined
    await loadStandard()
    state.message = { tone: 'ok', text: state.std.source === 'bundled' ? '이 프로젝트 파일을 지웠습니다 — 새 대화부터 플러그인 기본 표준을 씁니다' : '이 프로젝트 파일을 지웠습니다 — 표준 없이 답합니다' }
  })
}

const picker = document.getElementById('picker')
picker.addEventListener('change', () => {
  const file = picker.files?.[0]
  picker.value = ''
  if (!file) return
  if (!/\.(md|markdown)$/i.test(file.name)) {
    state.message = { tone: 'bad', text: 'Markdown(.md) 문서만 넣을 수 있습니다 — Word · PDF · HWP 는 먼저 Markdown 으로 바꿔 주세요' }
    return render()
  }
  const reader = new FileReader()
  reader.onload = () => {
    const text = String(reader.result ?? '')
    if (!text.trim()) state.message = { tone: 'bad', text: `${file.name} 가 비어 있습니다` }
    else state.confirm = { kind: 'replace', name: file.name, text }
    render()
  }
  reader.onerror = () => {
    state.message = { tone: 'bad', text: `${file.name} 를 읽지 못했습니다` }
    render()
  }
  reader.readAsText(file)
})

// --- 그리기 ---

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === false) continue
    if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
    else if (key === 'class') node.className = value
    else node.setAttribute(key, value === true ? '' : value)
  }
  for (const child of children.flat()) if (child !== undefined && child !== null && child !== false) node.append(child)
  return node
}
const button = (text, onclick, { primary = false, disabled = false } = {}) => el('button', { type: 'button', class: primary ? 'primary' : undefined, disabled: disabled || !!state.busy, onclick }, text)
const message = (item) => item && el('div', { class: `msg ${item.tone}`, role: item.tone === 'bad' ? 'alert' : 'status' }, item.text)

function standardCard() {
  const std = state.std
  const rules = rulesOf(std.text)
  const own = std.source === 'project'
  const where =
    std.source === 'project'
      ? [el('code', {}, PROJECT_FILE), ` · 규칙 ${rules.length}개`, std.modified ? ` · ${day(std.modified)} 수정` : '']
      : std.source === 'bundled'
        ? ['플러그인 기본 표준 (zip) · 규칙 ', String(rules.length), '개']
        : ['표준 없음 — AI 는 표준 판정 없이 답합니다']
  const fallback = own ? (state.bundledRules ? `이 파일이 없으면 플러그인 기본 표준(zip, 규칙 ${state.bundledRules}개)을 씁니다` : '이 파일이 없으면 표준 없이 답합니다') : `${PROJECT_FILE} 를 만들면 이 프로젝트는 그 표준을 씁니다`
  const confirm = state.confirm
  return el(
    'section',
    { class: 'card', 'aria-labelledby': 'std-title' },
    el('div', { class: 'head' }, el('h2', { id: 'std-title' }, '사내 SQL 표준 — 이 프로젝트'), el('span', { class: own ? 'tag' : 'tag off' }, own ? '팀 공유' : std.source === 'bundled' ? '플러그인 기본' : '없음')),
    el('div', { class: 'sub' }, ...where, el('br'), el('span', { class: 'faint' }, fallback)),
    rules.length > 0 &&
      el(
        'div',
        {},
        rules.slice(0, PREVIEW_RULES).map((rule) => el('div', { class: 'rule' }, el('b', {}, rule.id), el('span', {}, rule.text))),
        rules.length > PREVIEW_RULES && el('div', { class: 'rule faint' }, el('span'), el('span', {}, `… ${rules.length - PREVIEW_RULES}개 더`)),
      ),
    confirm?.kind === 'reset' &&
      el(
        'div',
        { class: 'msg warn', role: 'alertdialog', 'aria-label': '플러그인 기본으로' },
        `${PROJECT_FILE} 를 지웁니다 — ${state.bundledRules ? '새 대화부터 플러그인 기본 표준을 씁니다' : '플러그인 기본 표준이 없어 표준 없이 답합니다'}. 커밋한 파일이면 지운 것도 커밋해야 팀에 반영됩니다.`,
        el('div', { class: 'row', style: 'margin-top:8px' }, button('취소', () => ((state.confirm = undefined), render())), button('지우기', () => void resetStandard(), { primary: true })),
      ),
    confirm?.kind === 'replace' &&
      el(
        'div',
        { class: 'msg warn', role: 'alertdialog', 'aria-label': '.md 로 바꾸기' },
        `${confirm.name} (규칙 ${rulesOf(confirm.text).length}개) 로 ${PROJECT_FILE} 를 ${own ? '바꿉니다' : '만듭니다'} — 새 대화부터 적용되고, 커밋하면 팀에도 쓰입니다.`,
        el(
          'div',
          { class: 'row', style: 'margin-top:8px' },
          button('취소', () => ((state.confirm = undefined), render())),
          button(own ? '바꾸기' : '만들기', () => void run('replace', () => saveStandard(confirm.text, () => (state.confirm = undefined))), { primary: true }),
        ),
      ),
    !confirm &&
      el(
        'div',
        { class: 'row' },
        button('고치기', () => ((state.edit = { text: std.text, mode: 'edit' }), (state.message = undefined), render()), { primary: true }),
        button('.md 로 바꾸기', () => picker.click()),
        own && button('플러그인 기본으로', () => ((state.confirm = { kind: 'reset' }), (state.message = undefined), render())),
      ),
    message(state.message),
  )
}

/** 연결 요약 한 줄 — Oracle · tuner@127.0.0.1:1521/FREEPDB1 · 스키마 COM · 비밀번호 저장됨 */
function connectionLine(view) {
  const v = view.values
  const db = DB_NAMES[v.db] ?? v.db
  const address = v.host ? `${v.user ? `${v.user}@` : ''}${v.host}${v.port ? `:${v.port}` : ''}${v.service ? `/${v.service}` : ''}` : ''
  const password = `비밀번호 ${view.saved.includes('password') ? '저장됨' : '없음'}`
  return [db, address, v.schema && `스키마 ${v.schema}`, password].filter(Boolean).join(' · ')
}

function connectionCard() {
  const view = state.conn
  const check = state.check
  const missing = view && !view.error ? view.missing : []
  return el(
    'section',
    { class: 'card', 'aria-labelledby': 'conn-title' },
    el('h2', { id: 'conn-title' }, '연결'),
    view?.error
      ? message({ tone: 'bad', text: view.error })
      : el(
          'div',
          { class: 'conn' },
          el('span', { class: `dot${check ? (check.isError ? ' bad' : ' ok') : ''}`, 'aria-hidden': 'true' }),
          el('span', {}, connectionLine(view), view.target === 'project' && el('span', { class: 'faint' }, ' (이 프로젝트 값)')),
        ),
    missing.length > 0 && el('div', { class: 'sub' }, `넣어야 할 칸: ${missing.map((key) => LABELS[key] ?? key).join(', ')}`),
    el(
      'div',
      { class: 'row' },
      button(state.busy === 'check' ? '확인하는 중…' : '연결 확인', () =>
        void run(
          'check',
          async () => {
            state.check = undefined
            state.check = await call('settings.check')
          },
          'connMessage',
        ),
      ),
      button('연결 정보 고치기', () =>
        void run(
          'open',
          async () => {
            const { saved } = await call('settings.open')
            if (!saved) return
            state.check = undefined
            await loadConnection()
          },
          'connMessage',
        ),
      ),
    ),
    check && message({ tone: check.isError ? 'bad' : 'ok', text: check.text || (check.isError ? '연결 실패' : '연결됨') }),
    message(state.connMessage),
  )
}

/** 아주 작은 Markdown 미리보기 — 제목 · 목록 · 굵게 · 코드만 (글은 모두 이스케이프한다) */
function markdown(text) {
  const box = el('div', { class: 'preview', role: 'document', 'aria-label': '미리보기' })
  let list
  const inline = (line) => {
    const parts = line.split(/(\*\*[^*]+\*\*|`[^`]+`)/)
    return parts.map((part) => (/^\*\*.+\*\*$/.test(part) ? el('b', {}, part.slice(2, -2)) : /^`.+`$/.test(part) ? el('code', {}, part.slice(1, -1)) : part))
  }
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd()
    const heading = /^(#{1,3})\s+(.*)$/.exec(line)
    const item = /^\s*[-*+]\s+(.*)$/.exec(line) ?? /^\s*\d+[.)]\s+(.*)$/.exec(line)
    if (item) {
      if (!list) box.append((list = el('ul')))
      list.append(el('li', {}, inline(item[1])))
      continue
    }
    list = undefined
    if (heading) box.append(el(`h${heading[1].length}`, {}, inline(heading[2])))
    else if (line.trim()) box.append(el('p', {}, inline(line)))
  }
  return box
}

function editView() {
  const edit = state.edit
  const own = state.std.source === 'project'
  const seg = (mode, label) =>
    el('button', { type: 'button', role: 'radio', 'aria-checked': String(edit.mode === mode), onclick: () => ((edit.mode = mode), render()) }, label)
  const area = el('textarea', { 'aria-label': '표준 문서 내용', spellcheck: 'false', placeholder: '# 사내 SQL 개발 표준\n\n- **SQL-01** 규칙 …' })
  area.value = edit.text
  area.addEventListener('input', () => (edit.text = area.value))
  return el(
    'div',
    { class: 'edit' },
    el(
      'div',
      { class: 'edit-top' },
      el('div', { class: 'edit-title' }, el('b', {}, '사내 SQL 표준 고치기'), el('span', { class: 'sub' }, el('code', {}, PROJECT_FILE), state.project ? ` · ${state.project}` : '')),
      el('div', { class: 'seg', role: 'radiogroup', 'aria-label': '보기' }, seg('edit', '편집'), seg('preview', '미리보기')),
    ),
    el('div', { class: 'edit-body' }, edit.mode === 'edit' ? area : markdown(edit.text)),
    el('div', { class: 'edit-note' }, el('p', { class: 'msg warn', style: 'margin:0' }, '저장하면 이 프로젝트 파일이 바뀝니다 — ', el('b', {}, '새 대화부터'), ' 적용되고, 커밋하면 팀원에게도 같은 표준이 쓰입니다.')),
    state.message?.tone === 'bad' && el('div', { class: 'edit-note' }, message(state.message)),
    el(
      'div',
      { class: 'edit-foot' },
      button('취소', () => ((state.edit = undefined), (state.message = undefined), render())),
      el(
        'div',
        { class: 'row' },
        button('파일로 열기', () => void call('project.openFile', { path: PROJECT_FILE }).catch((error) => ((state.message = { tone: 'bad', text: errorText(error) }), render())), { disabled: !own }),
        button(state.busy === 'save' ? '저장하는 중…' : '저장', () => void run('save', () => saveStandard(edit.text, () => (state.edit = undefined))), { primary: true, disabled: !edit.text.trim() }),
      ),
    ),
  )
}

function render() {
  const app = document.getElementById('app')
  if (state.edit) return app.replaceChildren(editView())
  app.replaceChildren(
    el(
      'main',
      {},
      state.std ? standardCard() : el('div', { class: 'card sub' }, '불러오는 중…'),
      state.conn ? connectionCard() : undefined,
      el('p', { class: 'note' }, '이 패널은 SQL 튜닝을 켠 프로젝트에서만 보입니다. 표준과 연결 정보도 이 프로젝트 것입니다.'),
    ),
  )
}

void load().catch((error) => {
  document.getElementById('app').replaceChildren(el('main', {}, message({ tone: 'bad', text: errorText(error) })))
})
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빛톨 키우기</title>
<style>
/* 빛톨 키우기 (이슈 #1182) — 패널: 걷는 몬스터 무대 · 이름/진행 · 오늘 · 도감. 전체 화면(⤢): 무대가 창 전체가 되고 도감 친구들과 돌아다닌다 */
:root {
  --bg: #ffffff; --panel: #f5f6f7; --module: #eceef1; --text: #0f1115; --text-2: #61666b; --text-3: #81858c; --border: rgba(0,0,0,.1);
  --accent: #4176e6; --sky: #cfe4ff; --grass: #8cc56f; --grass-top: #a8d98a; --danger: #d64545;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151517; --panel: #1f1f21; --module: #2c2c2e; --text: #f9fafb; --text-2: #cfd3d6; --text-3: #9aa0a6; --border: rgba(255,255,255,.1); --accent: #6b97f2; --sky: #23324d; --grass: #3f6b35; --grass-top: #4f8242; --danger: #f06a6a; color-scheme: dark }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
canvas { image-rendering: pixelated; display: block; }
.app { display: flex; flex-direction: column; gap: 12px; padding: 12px; max-width: 560px; margin: 0 auto; }
.stage { position: relative; height: 220px; border-radius: 14px; overflow: hidden; background: linear-gradient(to bottom, var(--sky) 0 64%, var(--grass-top) 64% 66%, var(--grass) 66%); }
.deco { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.deco span { position: absolute; }
.walker { position: absolute; left: 0; top: 0; cursor: pointer; will-change: transform; z-index: 1; }
.say { position: absolute; bottom: 100%; left: 50%; transform: translate(-30%, -4px); background: #fff; color: #333; border: 2px solid #2e1a0c; border-radius: 10px; padding: 2px 8px; font-size: 12px; width: max-content; max-width: 220px; white-space: normal; opacity: 0; transition: opacity .2s; pointer-events: none; }
.fx { position: absolute; left: 70%; top: -6px; font-size: 16px; pointer-events: none; animation: rise 1.2s ease-out forwards; }
@keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-36px); } }
/* 행동 (0.2.0) — 페르소나가 고른 것. 몸(canvas)만 움직이고 위치는 walker 가 쥔다 */
.a-zap { animation: zap .6s steps(2) 2; }
@keyframes zap { 50% { filter: brightness(1.8) drop-shadow(0 0 6px #ffd23f); } }
.a-doze { animation: doze 1.6s ease-in-out; transform-origin: 50% 100%; }
@keyframes doze { 30%, 70% { transform: translateY(3px) rotate(-10deg); } }
.a-spin { animation: spin .8s ease; }
@keyframes spin { to { transform: rotate(360deg); } }
.a-shy { animation: shy 1s ease; transform-origin: 50% 100%; }
@keyframes shy { 40% { transform: scale(.85); filter: saturate(1.4) hue-rotate(-12deg); } }
.a-nod { animation: nod 1.2s ease; }
@keyframes nod { 25%, 75% { transform: translateY(5px); } 50% { transform: translateY(0); } }
.a-dash { animation: dash .5s ease; }
@keyframes dash { 50% { transform: skewX(-14deg); filter: blur(.6px); } }
@media (prefers-reduced-motion: reduce) { .fx, [class^="a-"] { animation: none !important; } }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bgs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
.bgs button { font: inherit; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.bgs button i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
.bgs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.bgs button:disabled { opacity: .5; cursor: default; }
.talkbtn { font: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
.bgs button:focus-visible, .talkbtn:focus-visible, .full:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.walker.talk .say { opacity: 1; }
.walker.edge-l .say { left: 0; transform: translate(0, -4px); }
.walker.edge-r .say { left: auto; right: 0; transform: translate(0, -4px); }
.full { position: absolute; top: 8px; left: 8px; z-index: 3; width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.92); color: #333; cursor: pointer; font-size: 14px; }
.who { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.who b { font-size: 16px; margin-right: 2px; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--module); color: var(--text-2); }
.bar { height: 8px; border-radius: 99px; background: var(--module); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #f0974a, #ffd23f); transition: width .4s; }
.barline { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-3); margin-top: 4px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel); border-radius: 10px; padding: 7px 10px; }
.stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--text-3); }
h2 { font-size: 13.5px; margin: 4px 0 0; }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.dex div { aspect-ratio: 1; border-radius: 10px; background: var(--panel); display: grid; place-items: center; }
.dex canvas { max-width: 82%; max-height: 82%; }
.dex .unknown canvas { filter: brightness(0); opacity: .16; }
.note { font-size: 12px; color: var(--text-3); }
.error { font-size: 12.5px; color: var(--danger); }
.error:empty { display: none; }
/* 전체 화면 — 무대가 창 전체 */
body.field .app { max-width: none; height: 100%; padding: 0; gap: 0; }
body.field .app > :not(.stage) { display: none; }
body.field .stage { height: 100%; border-radius: 0; background: linear-gradient(to bottom, var(--sky) 0 26%, var(--grass-top) 26% 27%, var(--grass) 27%); }
</style>
</head>

<div class="app">
  <div class="stage" id="stage"><div class="deco" id="deco"></div><button type="button" class="full" id="full" title="전체 화면" aria-label="전체 화면">⤢</button></div>
  <div class="tools">
    <div class="bgs" id="bgs" role="group" aria-label="배경"></div>
    <button type="button" class="talkbtn" id="talk" title="새 대화를 '빛톨아, ' 로 채워 엽니다">💬 말 걸기</button>
  </div>
  <div>
    <div class="who" id="who"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="barline"><span id="barLabel"></span><span id="barValue"></span></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="todayTokens">—</b><span>오늘 토큰</span></div>
    <div class="stat"><b id="todayTurns">—</b><span>오늘 턴</span></div>
    <div class="stat"><b id="days">—</b><span>함께한 날</span></div>
  </div>
  <p class="error" id="error"></p>
  <h2 id="dexTitle">도감</h2>
  <div class="dex" id="dex"></div>
  <p class="note">설치한 뒤에 AI 에 쓴 토큰을 먹고 자랍니다. 캐시로 읽은 토큰은 반만 칩니다. 빛톨을 누르거나 대화창에서 "빛톨아" 하고 불러 보세요. 기록은 이 PC 에만 남습니다.</p>
</div>

  { id: 'sunset', name: '노을', sw: '#f29e6b', need: 0, css: (h) => `linear-gradient(to bottom, #ffcf99 0, #f29e6b ${h * 0.6}%, #c46a7e ${h - 2}%, #8a6a4a ${h - 2}% ${h}%, #6e553c ${h}%)`, deco: 'sun' },
  { id: 'server', name: '서버실', sw: '#2b3a4a', need: 1, css: (h) => `linear-gradient(to bottom, #233140 0 ${h}%, #3c4c5e ${h}%)`, deco: 'racks' },
  { id: 'sea', name: '바다', sw: '#5bb4e0', need: 2, css: (h) => `linear-gradient(to bottom, #bfe6ff 0 ${h * 0.55}%, #5bb4e0 ${h * 0.55}% ${h}%, #f2dca5 ${h}%)`, deco: 'waves' },
  { id: 'snow', name: '눈밭', sw: '#e9f1fb', need: 3, css: (h) => `linear-gradient(to bottom, #c9d8ea 0 ${h}%, #ffffff ${h}%)`, deco: 'snow' },
]
const bgOf = (id) => BGS.find((b) => b.id === id) ?? BGS[0]
const unlocked = (b) => state.graduated.length >= b.need

// ── 앱 통로 (postMessage) ──
let next = 0
const waiting = new Map()
function call(method, params) {
  const id = ++next
  parent.postMessage({ litecode: 1, id, method, params }, '*')
  return new Promise((resolve, reject) => waiting.set(id, { resolve, reject }))
}
addEventListener('message', ({ data }) => {
  if (data && data.litecode === 1 && data.event) return onEvent(data.event, data.data)
  const w = data && data.litecode === 1 && waiting.get(data.id)
  if (!w) return
  waiting.delete(data.id)
  data.ok ? w.resolve(data.result) : w.reject(new Error(data.error))
})
/** 서비스 소식 (service.update) — 서비스가 먹이를 주거나 AI 가 say 로 말하면 지금 모습이 온다 */
function onEvent(event, data) {
  if (event === 'service.update') apply(data)
}

// ── 상태 — 서비스가 들고 있는 것을 받아 그린다 (패널은 저장하지 않는다) ──
let state = window.TOKEN_PET_GAME.fresh()
let today = null
let said = null
let saidAt = 0
const serviceCall = (name, params) => call('service.call', { name, params })

/** 서비스가 준 지금 모습(state · today · error · said · event)을 받는다 */
function apply(snapshot) {
  if (!snapshot || !snapshot.state) return
  state = { ...window.TOKEN_PET_GAME.fresh(), ...snapshot.state }
  today = snapshot.today
  const error = document.getElementById('error')
  error.textContent = snapshot.error ? (snapshot.error.includes('permission') ? '사용량을 읽을 권한이 없습니다 — 플러그인을 다시 설치해 usage 권한을 허락해 주세요.' : '사용량을 읽지 못했습니다. 잠시 뒤 다시 봅니다.') : ''
  if (snapshot.event && hero) react(snapshot.event)
  // AI 가 say 로 남긴 말 — 새 말이면 빛톨이 말풍선으로 한다
  if (snapshot.said && snapshot.said.at > saidAt) {
    saidAt = snapshot.said.at
    if (hero && !firstApply) { hero.talk(snapshot.said.text, 6); if (snapshot.said.action) hero.act(snapshot.said.action) } // 처음 한 번은 기준만 잡는다(열자마자 지난 말을 보이지 않게)
  }
  firstApply = false
  render()
}
let firstApply = true

// ── 그리기 ──
function drawSprite(canvas, sp, stage, frame = 0, scale = 4, flip = false) {
  const rows = sp.stages[stage].px
  const w = Math.max(...rows.map((r) => r.length)), h = rows.length
  if (canvas.width !== w * scale || canvas.height !== h * scale) { canvas.width = w * scale; canvas.height = h * scale }
  const ctx = canvas.getContext('2d')
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x]
      if (ch === '.' || ch === ' ') continue
      if ((ch === 'L' && frame === 1) || (ch === 'R' && frame === 0)) continue
      const color = sp.pal[ch]
      if (!color) continue
      ctx.fillStyle = color
      ctx.fillRect((flip ? w - 1 - x : x) * scale, y * scale, scale, scale)
    }
  })
}
const compact = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(n >= 1e5 ? 0 : 1)}K` : String(n))

/** 지금 몬스터의 그림 · 단계 안 진행(0~1) */
function current() {
  const st = stageOf(state)
  const sp = state.species ? byId(state.species) : EGG
  const stage = state.species ? st.stage : 0
  const fed = state.species ? state.feed - HATCH : state.feed
  const progress = Math.min(1, Math.max(0, (fed - st.from) / (st.to - st.from)))
  return { sp, stage, progress, st, fed }
}

/** 몸 크기 — 단계 안에서 60%→100%, 도트라 정수 배율 */
function scaleFor(progress, field) {
  const [lo, hi] = field ? [5, 8] : [3, 5]
  return Math.round(lo + (hi - lo) * progress)
}

function render() {
  const { sp, stage, progress, st, fed } = current()
  const who = document.getElementById('who')
  const stageName = state.species ? `${stage + 1}단계` : '알'
  who.innerHTML = ''
  const b = document.createElement('b'); b.textContent = sp.stages[stage].name; who.appendChild(b)
  for (const text of [stageName, state.nature ? `${state.nature} 성격` : null, state.species ? `몸 크기 ${Math.round(60 + 40 * progress)}%` : null]) if (text) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = text; who.appendChild(c) }
  document.getElementById('bar').style.width = `${Math.round(progress * 100)}%`
  document.getElementById('barLabel').textContent = !state.species ? '부화까지' : stage === 2 ? '졸업까지' : '다음 진화까지'
  document.getElementById('barValue').textContent = `${Math.round(progress * 100)}% · ${compact(Math.max(0, st.to - fed))} tok 남음`
  document.getElementById('todayTokens').textContent = today ? compact(today.tokens) : '—'
  document.getElementById('todayTurns').textContent = today ? String(today.turns) : '—'
  document.getElementById('days').textContent = `${Math.max(1, Math.floor((Date.now() - state.startedAt) / 86_400_000) + 1)}일`
  // 도감은 졸업한(3단계) 몬스터만 (#1186) — 종마다 한 칸, 몇 번 졸업했는지 함께
  const dex = document.getElementById('dex')
  dex.innerHTML = ''
  let seen = 0
  for (const s of SPECIES) {
    const count = state.graduated.filter((g) => g.id === s.id).length
    if (count > 0) seen++
    const last = s.stages.length - 1
    const d = document.createElement('div'); if (!count) d.className = 'unknown'; d.title = count ? `${s.stages[last].name} · 졸업 ${count}번` : '???'
    const c = document.createElement('canvas'); drawSprite(c, s, last, 0, 2); d.appendChild(c); dex.appendChild(d)
  }
  document.getElementById('dexTitle').textContent = `도감 ${seen} / ${SPECIES.length}${state.graduated.length ? ` · 졸업 ${state.graduated.length}` : ''}`
  renderBgs()
  if (hero) hero.refresh()
  }

// ── 배경 ──
const bgsEl = document.getElementById('bgs')
function renderBgs() {
  const key = `${state.bg}:${state.graduated.length}`
  if (bgsEl.dataset.k === key) return
  bgsEl.dataset.k = key
  bgsEl.innerHTML = ''
  for (const b of BGS) {
    const btn = document.createElement('button'); btn.type = 'button'
    const open = unlocked(b)
    btn.disabled = !open
    btn.setAttribute('aria-pressed', String((state.bg ?? 'meadow') === b.id))
    btn.title = open ? b.name : `졸업 ${b.need}번에 열려요`
    const sw = document.createElement('i'); sw.style.background = b.sw; btn.append(sw, open ? b.name : `🔒 ${b.name}`)
    btn.addEventListener('click', () => { state.bg = b.id; applyBg(); renderBgs(); void serviceCall('setBg', { bg: b.id }).catch(() => {}) })
    bgsEl.appendChild(btn)
  }
  applyBg()
}
function applyBg() {
  const b = bgOf(state.bg)
  const pick = unlocked(b) ? b : BGS[0]
  const h = document.body.classList.contains('field') ? 27 : 66
  stageEl.style.background = pick.css(h)
  const deco = document.getElementById('deco')
  const key = `${pick.id}:${h}`
  if (deco.dataset.k === key) return
  deco.dataset.k = key
  deco.innerHTML = ''
  const dot = (css) => { const s = document.createElement('span'); s.style.cssText = css; deco.appendChild(s) }
  const rnd = (seed) => { let x = seed; return () => (x = (x * 9301 + 49297) % 233280) / 233280 } // 그릴 때마다 같은 자리
  const r = rnd(7)
  if (pick.deco === 'stars') for (let i = 0; i < 26; i++) dot(`left:${r() * 100}%;top:${r() * (h - 6)}%;width:3px;height:3px;background:#fff;opacity:${0.4 + r() * 0.6}`)
  if (pick.deco === 'sun') dot(`left:70%;top:${h * 0.45}%;width:40px;height:40px;border-radius:50%;background:#ffe08a;box-shadow:0 0 26px #ffd166`)
  if (pick.deco === 'racks') for (let i = 0; i < 5; i++) dot(`left:${6 + i * 19}%;top:${h * 0.15}%;width:13%;height:${h * 0.8}%;background:#1a2430;border:2px solid #4b5d72;background-image:repeating-linear-gradient(to bottom,transparent 0 9px,#2f3e4f 9px 11px);box-shadow:inset -4px 0 0 ${i % 2 ? '#52e08a' : '#ffcf4a'}`)
  if (pick.deco === 'waves') for (let i = 0; i < 6; i++) dot(`left:${i * 17 + 2}%;top:${h * 0.7 + (i % 2) * 6}%;width:36px;height:4px;background:#e8f7ff;opacity:.8`)
  if (pick.deco === 'snow') for (let i = 0; i < 28; i++) dot(`left:${r() * 100}%;top:${r() * h}%;width:4px;height:4px;border-radius:50%;background:#fff`)
}

// ── 걷는 몬스터 ──
const still = matchMedia('(prefers-reduced-motion: reduce)').matches
const stageEl = document.getElementById('stage')
function walker(get, { vertical = false } = {}) {
  const el = document.createElement('div'); el.className = 'walker'
  const cv = document.createElement('canvas'); el.appendChild(cv)
  const say = document.createElement('div'); say.className = 'say'; el.appendChild(say)
  stageEl.appendChild(el)
  const s = { x: 20 + Math.random() * 80, y: 0, tx: 0, ty: 0, wait: 0.5, jump: 0, t: 0, flip: false, frame: 0, talk: 0, key: '' }
  const ground = () => { const a = stageEl.getBoundingClientRect(); const grassTop = a.height * (document.body.classList.contains('field') ? 0.27 : 0.66); return { a, grassTop } }
  const draw = () => { const g = get(); drawSprite(cv, g.sp, g.stage, s.frame, g.scale, s.flip) }
  const pick = () => {
    const { a, grassTop } = ground()
    s.tx = Math.random() * Math.max(0, a.width - cv.width)
    const minY = vertical ? grassTop - cv.height * 0.6 : a.height - cv.height - 14
    const maxY = a.height - cv.height - 8
    s.ty = vertical ? minY + Math.random() * Math.max(0, maxY - minY) : Math.max(0, minY)
  }
  const talk = (text, secs = 2.4) => { say.textContent = text; el.classList.add('talk'); s.talk = secs }
  /** 행동 하나 — 몸(canvas)의 CSS 애니메이션 + 작은 효과. 대시는 반대쪽으로 빠르게 달린다 */
  const act = (name) => {
    if (name === 'hop' || !name) { s.jump = 1; if (!name) return }
    if (name === 'dash') { const { a } = ground(); s.tx = s.x < a.width / 2 ? a.width - cv.width - 4 : 4; s.boost = 0.7; s.wait = 0 }
    if (still) return
    cv.classList.remove(...[...cv.classList].filter((c) => c.startsWith('a-')))
    void cv.offsetWidth
    cv.classList.add(`a-${name}`)
    cv.addEventListener('animationend', () => cv.classList.remove(`a-${name}`), { once: true })
    const fx = document.createElement('span'); fx.className = 'fx'; fx.textContent = FX[name] ?? ''
    el.appendChild(fx); setTimeout(() => fx.remove(), 1300)
  }
  /** 누르면 페르소나대로 한마디 + 행동 (persona.js 가 없으면 단계 대사) */
  const poke = () => {
    const g = get()
    if (PERSONA && g.who) {
      const r = PERSONA.react(g.who.species, g.who.stage, g.who.nature, s.said)
      s.said = r.text
      talk(r.text)
      act(r.action)
    } else { s.jump = 1; talk(g.sp.stages[g.stage].line) }
  }
  el.addEventListener('click', poke)
  const api = {
    talk, act, poke, hop: () => (s.jump = 1),
    refresh: () => { const g = get(); const key = `${g.sp.id}:${g.stage}:${g.scale}`; if (key !== s.key) { s.key = key; draw(); pick(); s.y = s.ty; s.x = Math.min(s.x, s.tx + 40) } },
    remove: () => el.remove(),
    tick: (dt) => {
      const g = get()
      s.t += dt
      if (s.talk > 0 && (s.talk -= dt) <= 0) el.classList.remove('talk')
      let moving = false
      if (s.boost > 0) s.boost -= dt
      const speed = (g.speed ?? 30) * (document.body.classList.contains('field') ? 2 : 1) * (s.boost > 0 ? 5 : 1)
      if (s.wait > 0) s.wait -= dt
      else {
        const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy)
        if (d < 2) { s.wait = 0.8 + Math.random() * 2.6; const r = Math.random(); if (r < 0.25) s.jump = 1; else if (r < 0.45) { if (PERSONA && g.who) poke(); else if (g.lines) talk(g.lines[Math.floor(Math.random() * g.lines.length)]) } pick() }
        else { const step = Math.min(d, speed * dt); s.x += (dx / d) * step; s.y += (dy / d) * step; moving = true; if (Math.abs(dx) > 1) s.flip = dx < 0 }
      }
      const frame = moving ? Math.floor(s.t * Math.max(3, speed / 9)) % 2 : 0
      const flipKey = `${frame}:${s.flip}`
      if (cv.dataset.k !== flipKey) { s.frame = frame; cv.dataset.k = flipKey; draw() }
      if (s.jump > 0) s.jump = Math.max(0, s.jump - dt * 2.4)
      const hop = Math.sin(s.jump * Math.PI) * 20
      el.style.transform = `translate(${s.x}px, ${s.y - hop}px)`
      // 말풍선이 무대 밖으로 잘리지 않게 — 가장자리에선 풍선을 안쪽으로
      const width = stageEl.clientWidth
      el.classList.toggle('edge-l', s.x < 90)
      el.classList.toggle('edge-r', s.x + cv.width > width - 90 && s.x >= 90)
    },
  }
  api.refresh()
  return api
}

const heroInfo = () => {
  const { sp, stage, progress } = current()
  const field = document.body.classList.contains('field')
  return { sp, stage, scale: sp === EGG ? (field ? 6 : 4) : scaleFor(progress, field), speed: state.species ? SPEC[state.species].speed : 0, lines: state.species ? SPEC[state.species].lines : ['…두근두근', '따뜻해…'], who: { species: state.species, stage, nature: state.nature } }
}
let hero = null
let friends = []

function react(event) {
  if (!hero) return
  hero.refresh()
  hero.hop()
  if (event === 'hatch') hero.talk('태어났다!')
  else if (event === 'evolve') hero.talk('진화했다!')
  else if (event === 'graduate') hero.talk('졸업! 새 알이 왔어요')
  else hero.talk('냠!')
}

// 전체 화면 — 무대가 창 전체가 되고, 도감에 남긴(본) 친구들이 같이 나온다
function setField(on) {
  document.body.classList.toggle('field', on)
  document.getElementById('full').textContent = on ? '✕' : '⤢'
  document.getElementById('full').title = on ? '전체 화면 나가기' : '전체 화면'
  for (const f of friends) f.remove()
  friends = []
  if (on) {
    // 같이 노는 친구 = 졸업한 몬스터(3단계), 종마다 하나 (#1186)
    // 종마다 마지막 졸업의 성격으로 (옛 기록엔 성격이 없어 '차분한')
    const last = new Map(state.graduated.map((g) => [g.id, g.nature ?? '차분한']))
    const others = [...last.keys()].slice(-4)
    for (const id of others) {
      const sp = byId(id), st = sp.stages.length - 1
      friends.push(walker(() => ({ sp, stage: st, scale: 4, speed: SPEC[id].speed, lines: SPEC[id].lines, who: { species: id, stage: st, nature: last.get(id) } }), { vertical: true }))
    }
  }
  hero.remove()
  hero = walker(heroInfo, { vertical: on })
  applyBg()
  call('panel.fullscreen', { on }).catch(() => {})
}
document.getElementById('full').addEventListener('click', () => setField(!document.body.classList.contains('field')))
// 말 걸기 — 패널은 AI 를 직접 부르지 못해서 새 대화를 "빛톨아, " 로 채워 연다. 대답은 스킬 + persona · say 도구가 한다
document.getElementById('talk').addEventListener('click', () => {
  serviceCall('talk').catch((error) => {
    document.getElementById('error').textContent = String(error.message).includes('permission') ? '말 걸기는 chat 권한이 필요합니다 — 플러그인을 다시 설치해 허용해 주세요.' : '대화를 열지 못했습니다. 프로젝트를 연 상태에서 다시 눌러 주세요.'
  })
})
addEventListener('keydown', (e) => e.key === 'Escape' && document.body.classList.contains('field') && setField(false))

// ── 시작 ──
;(async () => {
  hero = walker(heroInfo)
  render()
  // 서비스 소식(service.update)을 받고, 지금 모습을 한 번 묻는다. 서비스가 아직 안 떴으면(service-off) 안내만 보인다
  try { await call('events.subscribe', { events: ['service.update'] }) } catch { /* 권한 없음 */ }
  try { apply(await serviceCall('state')) } catch (error) {
    document.getElementById('error').textContent = '빛톨 서비스가 켜져 있지 않습니다 — 설정 › 기능 › 플러그인에서 빛톨 키우기를 켜 주세요.'
  }
  document.addEventListener('visibilitychange', () => !document.hidden && serviceCall('state').then(apply).catch(() => {}))
  if (!still) {
    let last = performance.now()
    const tick = (now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!document.hidden) for (const w of [hero, ...friends]) w && w.tick(dt); requestAnimationFrame(tick) }
    requestAnimationFrame(tick)
  }
})()
</script>
</body>
</html>

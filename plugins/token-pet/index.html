<title>빛톨 키우기</title>
<style>
/* 빛톨 키우기 패널 — 방향: "온기 도트". 작은 생명이 사는 창.
   서명 = 온기(ember) + 도트 칸. 데워질수록 켜지는 호박색 하나가 무대 발밑 · 온기 막대 · 말풍선 남은 시간 · 새 답변 점 · 도감 · 먹이 태그에 같이 나온다.
   세계 안(무대 · 말풍선 · 막대 · 도감 칸)은 도트 모서리, 바깥 UI(카드 · 단추)는 둥근 모서리. */
:root {
  color-scheme: light;
  --paper: #f5f1ea; --sheet: #fffdfa; --well: #eee8de;
  --rule: rgba(70,45,20,.11); --rule-strong: rgba(70,45,20,.22);
  --ink: #2b2520; --ink-2: #5d5249; --ink-3: #7d7266;
  --ember: #e0792b; --ember-strong: #b4550f; --on-ember: #ffffff; --ember-wash: #fbeadb; --ember-ring: rgba(224,121,43,.4);
  --glow-1: rgba(255,200,100,.62); --glow-2: rgba(255,170,70,.36); --glow-3: rgba(255,150,60,.18);
  --bad: #b8352a; --bad-wash: #fceae7; --warn: #835000; --warn-wash: #fff2dc;
  --bubble: #fffdf8; --bubble-ink: #2b2520; --bubble-line: #2b2520;
  --glass: rgba(255,253,250,.9);
  --sil: rgba(70,45,20,.13);
  /* 무대 — 배경마다 이름 붙인 토큰 (다크에서는 초원만 어두워진다) */
  --meadow-sky: #cfe4ff; --meadow-sky-2: #eaf3ff; --meadow-top: #a8d98a; --meadow: #8cc56f; --meadow-deep: #75ad5a; --cloud: #ffffff;
  --night-sky: #0f1830; --night-sky-2: #1c2c55; --night-top: #2f4a3a; --night: #23382c; --night-deep: #1b2d22; --star: #ffffff; --moon: #fff1c2;
  --sunset-1: #ffd9a8; --sunset-2: #f29e6b; --sunset-3: #c46a7e; --sunset-top: #8a6a4a; --sunset: #6e553c; --sunset-deep: #5d4630; --sun: #ffe08a;
  --server-wall: #233140; --server-floor: #3c4c5e; --server-deep: #31404f; --rack: #1a2430; --rack-line: #4b5d72; --rack-slot: #2f3e4f; --led-a: #52e08a; --led-b: #ffcf4a;
  --sea-sky: #bfe6ff; --sea-sky-2: #dff2ff; --sea: #5bb4e0; --sand: #f2dca5; --sand-deep: #e2c98c; --foam: #e8f7ff;
  --snow-sky: #c9d8ea; --snow-sky-2: #e3ecf7; --snow: #ffffff; --snow-deep: #e4ecf5;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #16130f; --sheet: #211d18; --well: #1a1713;
    --rule: rgba(255,235,210,.09); --rule-strong: rgba(255,235,210,.18);
    --ink: #f1ebe3; --ink-2: #bdb1a4; --ink-3: #8f8376;
    --ember: #f0a24b; --ember-strong: #f0a24b; --on-ember: #1c1208; --ember-wash: #3a2814; --ember-ring: rgba(240,162,75,.45);
    --glow-1: rgba(255,200,100,.5); --glow-2: rgba(255,170,70,.3); --glow-3: rgba(255,150,60,.15);
    --bad: #f2928b; --bad-wash: #3a1e1c; --warn: #f0a53a; --warn-wash: #33260f;
    --glass: rgba(33,29,24,.86);
    --sil: rgba(255,235,210,.11);
    --meadow-sky: #1f2d47; --meadow-sky-2: #2d4266; --meadow-top: #4f8242; --meadow: #3f6b35; --meadow-deep: #335b2b; --cloud: #46587a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-font-smoothing: antialiased; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 13.5px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
canvas { image-rendering: pixelated; display: block; }
button { font: inherit; color: inherit; }
h1, h2, p { margin: 0; }
h1, h2 { text-wrap: balance; }
p { text-wrap: pretty; }
.n2{clip-path:polygon(0 4px,2px 4px,2px 2px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px))}.n3{clip-path:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px))}.n4{clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}.n3r{}
.btn.plain { background: var(--sheet); box-shadow: 0 0 0 1px var(--rule-strong); }

.app { display: flex; flex-direction: column; gap: 14px; padding: 16px; max-width: 520px; margin: 0 auto; }
[data-slot] { display: contents; }
.card { background: var(--sheet); border-radius: 12px; box-shadow: 0 0 0 1px var(--rule); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 무대 */
.stage-wrap { position: relative; padding: 1px; background: var(--rule-strong); }
.stage { --h: 66%; position: relative; height: 280px; overflow: hidden; }
.stage.bg-meadow { background: linear-gradient(to bottom, var(--meadow-sky) 0, var(--meadow-sky-2) calc(var(--h) - 2%), var(--meadow-top) calc(var(--h) - 2%) var(--h), var(--meadow) var(--h)); }
.stage.bg-night { background: linear-gradient(to bottom, var(--night-sky) 0, var(--night-sky-2) calc(var(--h) - 2%), var(--night-top) calc(var(--h) - 2%) var(--h), var(--night) var(--h)); }
.stage.bg-sunset { background: linear-gradient(to bottom, var(--sunset-1) 0, var(--sunset-2) calc(var(--h) * .6), var(--sunset-3) calc(var(--h) - 2%), var(--sunset-top) calc(var(--h) - 2%) var(--h), var(--sunset) var(--h)); }
.stage.bg-server { background: linear-gradient(to bottom, var(--server-wall) 0 var(--h), var(--server-floor) var(--h)); }
.stage.bg-sea { background: linear-gradient(to bottom, var(--sea-sky) 0, var(--sea-sky-2) calc(var(--h) * .5), var(--sea) calc(var(--h) * .5) var(--h), var(--sand) var(--h)); }
.stage.bg-snow { background: linear-gradient(to bottom, var(--snow-sky) 0, var(--snow-sky-2) var(--h), var(--snow) var(--h)); }
.deco { position: absolute; inset: 0; pointer-events: none; }
.deco > * { position: absolute; }
.deco svg { shape-rendering: crispEdges; display: block; }
.deco .c { fill: var(--cloud); } .deco .moon { fill: var(--moon); } .deco .sun { fill: var(--sun); }
.deco .tuft { background: var(--tuft); width: 4px; height: 4px; box-shadow: 8px 0 0 var(--tuft), 4px -4px 0 var(--tuft); }
.deco .star { width: 3px; height: 3px; background: var(--star); }
.deco .rack { background-color: var(--rack); border: 2px solid var(--rack-line); background-image: repeating-linear-gradient(to bottom, transparent 0 9px, var(--rack-slot) 9px 11px); }
.deco .rack i { position: absolute; right: 4px; top: 6px; width: 3px; height: 3px; background: var(--led-a); box-shadow: 0 12px 0 var(--led-b), 0 24px 0 var(--led-a), 0 36px 0 var(--led-b); }
.deco .wave { width: 36px; height: 4px; background: var(--foam); opacity: .8; }
.deco .flake { width: 4px; height: 4px; background: var(--snow); border-radius: 50%; }
.drift { animation: drift 120s linear infinite alternate; }
@keyframes drift { to { transform: translateX(46px); } }
.stage.dim .pet, .stage.dim .pool { filter: saturate(.35); opacity: .75; }

.stage-btns { position: absolute; top: 10px; right: 10px; z-index: 6; display: flex; gap: 6px; }
.sbtn { height: 36px; padding: 0 12px 0 10px; border-radius: 9px; border: 0; background: var(--glass); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; box-shadow: 0 0 0 1px var(--rule); transition: transform .12s cubic-bezier(.23,1,.32,1); }
.sbtn:active:not(:disabled) { transform: scale(.95); }
.sbtn:focus-visible { outline: 2px solid var(--ember-strong); outline-offset: 2px; }
.sbtn:disabled { opacity: .55; cursor: not-allowed; }
.full { flex: none; width: 36px; height: 36px; border-radius: 9px; border: 0; background: var(--glass); color: var(--ink); cursor: pointer; display: grid; place-items: center; box-shadow: 0 0 0 1px var(--rule); transition: transform .12s cubic-bezier(.23,1,.32,1); }
.full:active { transform: scale(.94); }
.full:focus-visible, .pet:focus-visible { outline: 2px solid var(--ember-strong); outline-offset: 2px; }
.plate { position: absolute; left: 12px; top: 12px; z-index: 6; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 99px; background: var(--glass); box-shadow: 0 0 0 1px var(--rule); font-size: 12.5px; }
.plate b { font-weight: 650; }
.plate span { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.esc { position: absolute; right: 12px; bottom: 12px; z-index: 6; padding: 4px 10px; border-radius: 99px; background: var(--glass); box-shadow: 0 0 0 1px var(--rule); font-size: 11.5px; color: var(--ink-2); }

.pet { position: absolute; left: 0; top: 0; z-index: 3; cursor: pointer; will-change: transform; }
.pet canvas.dropin { animation: dropin .95s cubic-bezier(.3,.1,.4,1) both; }
@keyframes dropin { 0% { transform: translateY(-300px); } 62% { transform: translateY(0); } 76% { transform: translateY(-16px); } 90% { transform: translateY(0); } 95% { transform: translateY(-4px); } 100% { transform: translateY(0); } }
.pool { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; border-radius: 50%; background: radial-gradient(closest-side, var(--glow-1) 0 36%, var(--glow-2) 36% 68%, var(--glow-3) 68% 99%, transparent 100%); opacity: var(--w, .6); transition: opacity .4s; }
.ring { position: absolute; z-index: 2; pointer-events: none; border: 3px solid var(--ember); border-radius: 50%; opacity: 0; animation: ring 1.1s .75s ease-out both; }
@keyframes ring { 0% { opacity: .9; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.5); } }

/* 말풍선 — 도트 모서리. 남은 시간은 호박색 선이 줄어든다 */
.bubble { position: absolute; left: 0; top: 0; z-index: 5; width: max-content; max-width: min(292px, calc(100% - 24px)); padding: 10px 13px 14px; background: var(--bubble); color: var(--bubble-ink); font-size: 13.5px; line-height: 1.5; pointer-events: none; box-shadow: 0 -3px 0 0 var(--bubble-line), 0 3px 0 0 var(--bubble-line), -3px 0 0 0 var(--bubble-line), 3px 0 0 0 var(--bubble-line); }
.bubble .bt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; overflow-wrap: anywhere; text-wrap: pretty; }
.bubble.weak { padding: 5px 10px 6px; font-size: 12.5px; box-shadow: 0 -2px 0 0 var(--bubble-line), 0 2px 0 0 var(--bubble-line), -2px 0 0 0 var(--bubble-line), 2px 0 0 0 var(--bubble-line); }
.bubble.weak .timer { display: none; }
.bubble .timer { position: absolute; left: 10px; right: 10px; bottom: 5px; height: 3px; background: var(--ember); transform-origin: left; animation: drain var(--secs, 30s) linear forwards; }
@keyframes drain { to { transform: scaleX(0); } }
.bubble .tail { position: absolute; top: 100%; width: 12px; height: 6px; margin: 0 0 0 -6px; }
.tail .l { fill: var(--bubble-line); } .tail .f { fill: var(--bubble); }
.nom { position: absolute; z-index: 5; pointer-events: none; padding: 3px 10px; border-radius: 99px; background: var(--ember-wash); color: var(--ember-strong); box-shadow: 0 0 0 1px var(--ember-ring); font-size: 12px; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; animation: rise 1.6s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }

/* 행동 (0.2.0) — 페르소나가 고른 것. 몸(canvas)만 움직이고 위치는 .pet 이 쥔다 */
.fx { position: absolute; left: 70%; top: -6px; z-index: 4; font-size: 16px; pointer-events: none; animation: rise 1.2s ease-out forwards; }
.a-zap { animation: zap .6s steps(2) 2; }
@keyframes zap { 50% { filter: brightness(1.8) drop-shadow(0 0 6px var(--ember)); } }
.a-doze { animation: doze 1.6s ease-in-out; transform-origin: 50% 100%; }
@keyframes doze { 30%, 70% { transform: translateY(3px) rotate(-10deg); } }
.a-spin { animation: spin .8s ease; }
@keyframes spin { to { transform: rotate(360deg); } }
.a-shy { animation: shy 1s ease; transform-origin: 50% 100%; }
@keyframes shy { 40% { transform: scale(.85); filter: saturate(1.4) hue-rotate(-12deg); } }
.a-nod { animation: nod 1.2s ease; }
@keyframes nod { 25%, 75% { transform: translateY(5px); } 50% { transform: translateY(0); } }
.a-dash { animation: dash .5s ease; }
@keyframes dash { 50% { transform: skewX(-14deg); filter: blur(.6px); } }
.dpet:focus-visible { outline: 2px solid var(--ember-strong); outline-offset: 2px; }

/* 도구 줄 */
.tools { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.lab { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); }
.lab b { letter-spacing: 0; color: var(--ink); font-weight: 650; margin-left: 4px; }
.bgs { display: flex; gap: 6px; margin-top: 7px; }
.sw { position: relative; width: 34px; height: 34px; border: 0; padding: 0; border-radius: 9px; cursor: pointer; background: linear-gradient(to bottom, var(--a) 0 60%, var(--b) 60%); box-shadow: 0 0 0 1px var(--rule-strong); transition: transform .12s cubic-bezier(.23,1,.32,1), box-shadow .12s; }
.sw:hover:not(:disabled) { transform: translateY(-1px); }
.sw:active:not(:disabled) { transform: scale(.94); }
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ember-strong); }
.sw:focus-visible { outline: 2px solid var(--ember-strong); outline-offset: 3px; }
.btn { height: 40px; padding: 0 16px 0 14px; border-radius: 10px; border: 0; font-size: 13.5px; font-weight: 650; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; white-space: nowrap; transition: transform .12s cubic-bezier(.23,1,.32,1), filter .12s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--ember-strong); outline-offset: 2px; }
.btn.primary { background: var(--ember-strong); color: var(--on-ember); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; box-shadow: 0 0 0 1px var(--rule-strong); height: 30px; padding: 0 12px; font-size: 12.5px; }

/* 마지막 답변 */
.said { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 14px; align-items: start; transition: box-shadow .2s; }
.said.live { box-shadow: 0 0 0 1.5px var(--ember-ring), 0 0 0 4px var(--ember-wash); }
.av { width: 44px; height: 44px; background: var(--well); display: grid; place-items: center; }
.said-top { display: flex; align-items: baseline; gap: 6px 8px; flex-wrap: wrap; }
.said-top b { font-weight: 650; font-size: 13.5px; }
.said-top .lab { letter-spacing: .02em; font-weight: 500; font-size: 12px; }
.said-top time { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.said p.t { margin-top: 5px; font-size: 14px; line-height: 1.62; color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.said.open p.t { -webkit-line-clamp: unset; }
.more { margin-top: 2px; border: 0; background: none; padding: 6px 0 0; color: var(--ember-strong); font-size: 12.5px; font-weight: 650; cursor: pointer; }
.more:focus-visible { outline: 2px solid var(--ember-strong); outline-offset: 2px; border-radius: 4px; }
.livetag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; color: var(--ember-strong); }
.livetag i { width: 6px; height: 6px; background: var(--ember); }
.said.empty { background: var(--well); box-shadow: none; }
.said.empty p.t { color: var(--ink-3); font-size: 13px; line-height: 1.55; }
.said.empty .av { background: var(--sheet); }

/* 이름 · 온기 막대 */
.who { padding: 16px; }
.who-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.who h1 { font-size: 19px; line-height: 1.2; font-weight: 700; letter-spacing: -.018em; margin-right: 2px; }
.tag { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--well); color: var(--ink-2); }
.tag.ember { background: var(--ember-wash); color: var(--ember-strong); }
.tag.warn { background: var(--warn-wash); color: var(--warn); }
.rt { display: inline-flex; align-items: center; gap: 12px; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 10px; height: 10px; background: var(--well); box-shadow: inset 0 0 0 1.5px var(--rule-strong); }
.pips i.on { background: var(--ember); box-shadow: none; }
.heat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 16px; }
.heat-head .lab b { margin-left: 0; }
.pct { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.meter { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; margin-top: 7px; padding: 4px; background: var(--well); }
.meter i { height: 11px; background: var(--rule-strong); }
.meter i.on { background: var(--ember); }
.meter i.head { background: var(--ember); opacity: .5; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .95; } }
.heat-foot { margin-top: 7px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.who.stalled .meter i.on, .who.stalled .meter i.head { background: var(--ink-3); animation: none; opacity: .6; }
.who.unknown .meter i { background: var(--rule); }

/* 오늘 */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 2px 0; }
.st { padding: 12px 14px; min-width: 0; }
.st + .st { box-shadow: inset 1px 0 0 var(--rule); }
.st b { display: block; font-size: 21px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.st span { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.st span i { width: 6px; height: 6px; background: var(--ember); flex: none; }
.stats.muted b { color: var(--ink-3); }
.hint { padding: 11px 14px; background: var(--well); border-radius: 10px; font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }
.hint i { width: 6px; height: 6px; margin-top: 7px; background: var(--ember); flex: none; }

/* 졸업 기록 */
.grad { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--ember-wash); box-shadow: 0 0 0 1px var(--ember-ring); border-radius: 12px; }
.grad .av { width: 52px; height: 52px; background: var(--sheet); }
.grad b { display: block; font-size: 14.5px; font-weight: 650; }
.grad p { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }

.note { font-size: 11.5px; color: var(--ink-3); line-height: 1.6; }

/* 오류 */
.alert { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--bad-wash); color: var(--ink); box-shadow: 0 0 0 1px color-mix(in srgb, var(--bad) 40%, transparent); }
.alert.warn { background: var(--warn-wash); box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn) 40%, transparent); }
.alert svg { margin-top: 1px; color: var(--bad); }
.alert.warn svg { color: var(--warn); }
.alert b { display: block; font-size: 13.5px; font-weight: 650; color: var(--bad); }
.alert.warn b { color: var(--warn); }
.alert p { margin-top: 3px; font-size: 12.5px; color: var(--ink); }

.app.field { padding: 0; gap: 0; max-width: none; }

.app.field .stage-wrap { padding: 0; background: none; clip-path: none; }
.app.field .stage { --h: 27%; height: 100vh; min-height: 320px; clip-path: none; }


.thumb { width: 40px; height: 40px; background: var(--well); display: grid; place-items: center; flex: none; }
.mates { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: -4px; }
.mates .lab b { color: var(--ember-strong); margin-left: 6px; font-variant-numeric: tabular-nums; }
.mate { display: inline-flex; align-items: center; gap: 8px; padding: 4px; border-radius: 99px; background: var(--sheet); box-shadow: 0 0 0 1px var(--rule-strong); font-size: 12.5px; font-weight: 650; }
.mate .thumb { width: 28px; height: 28px; border-radius: 99px; overflow: hidden; }
.mate button { height: 28px; border: 0; border-radius: 99px; padding: 0 11px; background: var(--well); color: var(--ink-2); font-size: 12px; font-weight: 600; cursor: pointer; }
.mate button:active { transform: scale(.96); }
.mate button:focus-visible { outline: 2px solid var(--ember-strong); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 19px; font-weight: 700; letter-spacing: -.018em; }
.top .n { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.top .r { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.back { height: 36px; padding: 0 12px 0 8px; border-radius: 10px; border: 0; background: transparent; box-shadow: 0 0 0 1px var(--rule-strong); font-size: 13px; font-weight: 650; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; transition: transform .12s cubic-bezier(.23,1,.32,1); }
.back:active { transform: scale(.97); }
.back:focus-visible { outline: 2px solid var(--ember-strong); outline-offset: 2px; }
.lead { font-size: 12.5px; color: var(--ink-2); margin-top: -4px; }
.dexgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.dt { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; padding: 14px 8px; border: 0; background: var(--sheet); color: inherit; text-align: center; cursor: pointer; transition: background .12s; }
.dt.unk { background: var(--well); }
.dt:hover { background: var(--ember-wash); }
.dt:focus-visible { outline: 0; box-shadow: inset 0 0 0 3px var(--ember-strong); }
.dt:active { transform: scale(.985); }
.dt .art { position: relative; display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 112px; }
.dt .art .gl { position: absolute; left: 8%; right: 8%; bottom: -6px; height: 20px; border-radius: 50%; background: radial-gradient(closest-side, var(--glow-1) 0 36%, var(--glow-2) 36% 68%, var(--glow-3) 68% 99%, transparent 100%); opacity: .85; }
.dt canvas { position: relative; }
.dt .meta { display: flex; flex-direction: column; align-items: center; gap: 3px; margin-top: 14px; min-width: 0; }
.dt .nm { font-size: 14px; font-weight: 650; line-height: 1.25; }
.dt.unk .nm { color: var(--ink-3); }
.dt .cnt { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dt .tag { margin-top: 3px; }
.status { min-height: 1.5em; font-size: 12.5px; color: var(--ink-2); padding: 0 2px; }
.empty-guide { padding: 14px; font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
.empty-guide b { color: var(--ink); font-size: 14.5px; font-weight: 650; }
.dstage-wrap { padding: 1px; background: var(--rule-strong); }
.dstage { --h: 66%; position: relative; height: 216px; overflow: hidden; }
.dstage .bubble { left: 50%; top: 16px; transform: translateX(-50%); }
.dstage .bubble .tail { left: 50%; }
.dpet { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 3; border: 0; background: none; padding: 0; cursor: pointer; }
.dpet canvas.hop { animation: dhop .4s cubic-bezier(.23,1,.32,1); }
@keyframes dhop { 40% { transform: translateY(-14px); } }
.dpool { position: absolute; left: 50%; bottom: 6px; width: 230px; height: 44px; transform: translateX(-50%); border-radius: 50%; z-index: 2; background: radial-gradient(closest-side, var(--glow-1) 0 36%, var(--glow-2) 36% 68%, var(--glow-3) 68% 99%, transparent 100%); opacity: .9; }
.dbody { padding: 16px; }
.dbody h1 { font-size: 19px; line-height: 1.2; font-weight: 700; letter-spacing: -.018em; }
.facts { margin: 12px 0 0; display: grid; }
.facts > div { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; padding: 9px 0; box-shadow: inset 0 1px 0 var(--rule); font-size: 13.5px; }
.facts dt { color: var(--ink-3); font-size: 12px; padding-top: 2px; }
.facts dd { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.facts .mock { color: var(--ink-3); font-size: 11.5px; }
.act { margin-top: 14px; display: grid; gap: 8px; }
.btn.block { width: 100%; justify-content: center; height: 44px; }
.btn.sub { background: transparent; box-shadow: 0 0 0 1px var(--rule-strong); color: var(--ink); }
.hintline { font-size: 12.5px; color: var(--ink-2); }
.hintline.warn { color: var(--warn); font-weight: 600; }

.sub { font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }

let next = 0

function call(method, params) {
  const id = ++next
  parent.postMessage({ litecode: 1, id, method, params }, '*')
  return new Promise((resolve, reject) => waiting.set(id, { resolve, reject }))
}
addEventListener('message', ({ data }) => {
  if (data && data.litecode === 1 && data.event) return data.event === 'service.update' && apply(data.data)
  const w = data && data.litecode === 1 && waiting.get(data.id)
  if (!w) return
  waiting.delete(data.id)
  data.ok ? w.resolve(data.result) : w.reject(new Error(data.error))
})

const graduatedIds = () => [...new Set(state.graduated.map((g) => g.id))].filter(byId)
const cntOf = (id) => state.graduated.filter((g) => g.id === id).length

/** 키우는 빛톨 — 그림 · 이름 · 단계 안 진행(0~1) · 남은 먹이 */
function cur() {
  const st = stageOf(state)
  const known = state.species && byId(state.species)
  const sp = known || EGG
  const stage = known ? st.stage : 0
  const fed = known ? state.feed - HATCH : state.feed
  const p = Math.min(1, Math.max(0, (fed - st.from) / (st.to - st.from)))
  return { sp, id: known ? sp.id : 'egg', stage, p, left: Math.max(0, st.to - fed), name: dispName(known ? sp.id : 'egg', stage) }
}
const stageLabel = () => (state.species ? `${cur().stage + 1}단계` : '알')
/** 몸 크기 — 단계 안에서 60%→100%, 도트라 정수 배율 */
const scaleFor = (p) => Math.round(3 + 2 * p)
const heroScale = () => { const c = cur(); return ui.field ? (state.species ? Math.round(5 + 2 * c.p) : 6) : state.species ? scaleFor(c.p) : 5 }
/** 지금 무대에 서서 말하는 친구 — 불러온 친구(전체 화면에선 아님)가 있으면 그 친구, 없으면 키우는 빛톨 */
const stageWho = () => {
  const m = ui.field ? null : mateId()
  if (m) return { id: m, stage: 2, nature: lastGraduation(state, m)?.nature ?? null, mate: true }
  const c = cur()
  return { id: c.id, stage: c.stage, nature: state.nature, mate: false }
}
const errorKind = () => (ui.off ? 'off' : svcError ? (svcError.includes('permission') ? 'perm' : 'fail') : null)
const hhmm = (t) => {
  const d = new Date(t), now = new Date(), pad = (n) => String(n).padStart(2, '0'), time = `${pad(d.getHours())}:${pad(d.getMinutes())}`
  if (d.toDateString() === now.toDateString()) return time
  return new Date(now - 86_400_000).toDateString() === d.toDateString() ? `어제 ${time}` : `${d.getMonth() + 1}월 ${d.getDate()}일 ${time}`
}

/** 서비스가 준 지금 모습(state · today · error · said · event)을 받는다 */
function apply(snapshot) {
  if (!snapshot || !snapshot.state) return
  const before = state
  state = { ...G.fresh(), ...snapshot.state }
  today = snapshot.today
  svcError = snapshot.error || null
  ui.off = false
  said = snapshot.said || null
  if (snapshot.event && !firstApply) onEvent(snapshot.event, before)
  // AI 가 say 로 남긴 말 — 새 말이면 무대의 친구가 말풍선으로 한다. 처음 한 번은 기준만 잡는다(열자마자 지난 말을 풍선으로 보이지 않게)
  if (said && said.at > saidAt) {
    saidAt = said.at
    if (!firstApply && ui.view === 'main' && hero) {
      say(said.text, { strong: true, secs: saySecs(said.text), who: hero, force: true })
      if (said.action) act(hero, said.action)
    }
  }
  firstApply = false
  render()
}
/** 답변 말풍선이 보이는 시간 — 글이 길수록 오래(10초 ~ 40초) */
const saySecs = (text) => Math.min(40, 10 + String(text).length * 0.3)

/** 먹이 · 부화 · 진화 · 졸업이 일어났을 때 — 무대에 불러온 친구가 있으면 무대는 그대로 두고 알약 + 성장 카드 줄로 알린다 */
function onEvent(event, before) {
  const m = ui.field ? null : mateId()
  const c = cur()
  let evt = null
  if (event === 'graduate') {
    const id = state.graduated[state.graduated.length - 1]?.id
    if (id && byId(id)) {
      ui.grad = { id }
      evt = { kind: 'graduate', id, short: '졸업! 새 알이 왔어요', long: `졸업! 도감에 ${nameOf(id)} 기록이 남았어요 · 새 알이 왔어요` }
      if (!m && !ui.field && ui.view === 'main') ui.scene = { id }
    }
  } else if (event === 'hatch') evt = { kind: 'hatch', id: c.id, short: '부화했어요!', bubble: '태어났어요!', long: `부화했어요! ${c.name}` }
  else if (event === 'evolve') evt = { kind: 'evolve', id: c.id, short: '진화했어요!', bubble: '진화했어요!', long: `진화했어요! ${stName(c.id, Math.max(0, stageOf(before).stage))} → ${stName(c.id, c.stage)}` }
  else if (event === 'eat') {
    const amt = compact(Math.max(0, state.feed - before.feed))
    evt = { kind: 'eat', id: c.id, short: `냠! +${amt}`, long: `${c.name} · 냠! +${amt} 먹었어요`, amt }
  }
  if (!evt) return
  if (m) {
    ui.evt = evt
    clearTimeout(evtT)
    if (!still) evtT = setTimeout(endEvt, 6000)
    return
  }
  // 불러온 친구가 없으면 키우는 빛톨이 직접 반응한다
  if (ui.view !== 'main') return
  const scene = !!ui.scene // 졸업 장면은 무대를 새로 꾸미면서 스스로 말한다
  queueMicrotask(() => {
    if (!hero) return
    if (event === 'eat') { hero.jump = 1; nom(evt.amt) }
    else if (event === 'graduate') { if (!scene) { hero.jump = 1; say(evt.short, { strong: true, secs: 3, who: hero, force: true }) } }
    else { hero.jump = 1; say(evt.bubble, { strong: true, secs: 3, who: hero, force: true }) }
  })
}

// ── 그림 ──
function drawSprite(canvas, sp, stage, frame = 0, scale = 4, flip = false, sil = null) {
  const rows = sp.stages[stage].px
  const w = Math.max(...rows.map((r) => r.length)), h = rows.length
  if (canvas.width !== w * scale || canvas.height !== h * scale) { canvas.width = w * scale; canvas.height = h * scale }
  const ctx = canvas.getContext('2d')
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x]
      if (ch === '.' || ch === ' ') continue
      if ((ch === 'L' && frame === 1) || (ch === 'R' && frame === 0)) continue
      const color = sil || sp.pal[ch]
      if (!color) continue
      ctx.fillStyle = color
      ctx.fillRect((flip ? w - 1 - x : x) * scale, y * scale, scale, scale)
    }
  })
}
const spriteSize = (sp, stage) => { const r = sp.stages[stage].px; return [Math.max(...r.map((x) => x.length)), r.length] }
function fit(cv, sp, stage, box) { const [w, h] = spriteSize(sp, stage), s = Math.max(1, Math.floor(box / Math.max(w, h))); drawSprite(cv, sp, stage, 0, s) }
const artCv = (id, own, max, box) => `<canvas data-sp="${esc(id)}" data-own="${own ? 1 : 0}" data-max="${max}" ${box ? `data-box="${box}"` : ''} aria-hidden="true"></canvas>`
function drawArt() {
  document.querySelectorAll('canvas[data-sp]').forEach((cv) => {
    const sp = cv.dataset.sp === 'egg' ? EGG : byId(cv.dataset.sp)
    if (!sp) return
    const si = Math.min(2, sp.stages.length - 1), w = spriteSize(sp, si)[0], max = +cv.dataset.max || 3
    const box = +cv.dataset.box || Math.min(cv.parentElement.clientWidth - 8, 150)
    drawSprite(cv, sp, si, 0, clamp(Math.floor(box / w), 1, max), false, cv.dataset.own === '1' ? null : cssv('--sil'))
  })
}
/** 마지막 답변을 한 친구 (없으면 지금 무대의 친구) */
function speaker() {
  const by = said?.by
  if (by) {
    const sp = by.species && byId(by.species) ? byId(by.species) : EGG
    const stage = clamp(by.stage ?? 0, 0, sp.stages.length - 1)
    return { sp, stage, name: by.name || dispName(sp.id, stage) }
  }
  const w = stageWho(), sp = w.id === 'egg' ? EGG : byId(w.id)
  return { sp, stage: w.stage, name: dispName(w.id, w.stage) }
}
function drawAv() { const cv = $('#av'); if (!cv) return; const c = speaker(); fit(cv, c.sp, c.stage, 32) }

function pxDisc(cells, cls, px = 4) {
  const r = cells / 2 - .5, rects = []
  for (let y = 0; y < cells; y++) { let a = -1; for (let x = 0; x <= cells; x++) { const inside = x < cells && Math.hypot(x - r, y - r) <= r + .2; if (inside && a < 0) a = x; if (!inside && a >= 0) { rects.push(`<rect x="${a * px}" y="${y * px}" width="${(x - a) * px}" height="${px}"/>`); a = -1 } } }
  return `<svg class="${cls}" width="${cells * px}" height="${cells * px}">${rects.join('')}</svg>`
}

  let x = 7; const r = () => (x = (x * 9301 + 49297) % 233280) / 233280 // 그릴 때마다 같은 자리
  const out = []
  const tufts = (v, n) => { for (let i = 0; i < n; i++) out.push(`<span class="tuft" style="--tuft:var(${v});left:${(r() * 94 + 2).toFixed(1)}%;top:${(h + 4 + r() * (100 - h - 10)).toFixed(1)}%"></span>`) }
  if (bg === 'meadow') { out.push(`<span class="drift" style="left:8%;top:12%">${cloud(5)}</span><span class="drift" style="left:62%;top:${h > 40 ? 24 : 8}%;animation-duration:150s">${cloud(4)}</span>`); tufts('--meadow-deep', h > 40 ? 9 : 22) }
  if (bg === 'night') { for (let i = 0; i < 30; i++) out.push(`<span class="star" style="left:${(r() * 97).toFixed(1)}%;top:${(r() * (h - 8)).toFixed(1)}%;opacity:${(.35 + r() * .65).toFixed(2)}"></span>`); out.push(`<span style="left:76%;top:9%">${pxDisc(7, 'moon', 4)}</span>`); tufts('--night-deep', h > 40 ? 9 : 22) }
  if (bg === 'sunset') { out.push(`<span style="left:68%;top:${h * .42}%">${pxDisc(11, 'sun', 4)}</span>`); tufts('--sunset-deep', h > 40 ? 9 : 22) }
  if (bg === 'server') { for (let i = 0; i < 5; i++) out.push(`<span class="rack" style="left:${6 + i * 19}%;top:${h * .12}%;width:13%;height:${h * .86}%"><i></i></span>`); tufts('--server-deep', h > 40 ? 6 : 14) }
  if (bg === 'sea') { for (let i = 0; i < 6; i++) out.push(`<span class="wave" style="left:${i * 17 + 2}%;top:${h * .62 + (i % 2) * 8}%"></span>`); tufts('--sand-deep', h > 40 ? 8 : 20) }
  if (bg === 'snow') { for (let i = 0; i < 26; i++) out.push(`<span class="flake" style="left:${(r() * 98).toFixed(1)}%;top:${(r() * 96).toFixed(1)}%"></span>`); tufts('--snow-deep', h > 40 ? 8 : 20) }
  return out.join('')
}

        <div><dt>졸업</dt><dd>${n}번</dd></div>
        <div><dt>마지막 졸업</dt><dd>${esc(last?.nature ?? '차분한')} 성격${when ? `<span class="mock">· ${when.getMonth() + 1}월 ${when.getDate()}일</span>` : ''}</dd></div>
        <div><dt>종</dt><dd>${esc(sp.name)}<span class="mock">· ${esc(String(sp.note).split(' · ')[0])}</span></dd></div>
      </dl>
      <div class="act" id="act">${actHTML(id)}</div>
      <p class="status" id="detStatus" role="status" style="margin-top:8px"></p>
    </div>
  </section>`
}

function renderSub() {
  const html = ui.view === 'dex' ? dexHTML() : detailHTML()
  const app = $('#app')
  if (setHTML(app, html)) {
    if (ui.view === 'detail') { $('#deco').innerHTML = decoHTML(bgOf(state.bg).id, 66); $('#dq .bt').textContent = ui.quote }
    drawArt()
  }
}
function render() {
  if (ui.view === 'main') renderMain()
  else if (ui.sel || ui.view === 'dex') renderSub()
  const a = ui.focus; if (a) { ui.focus = null; const el = $(a); if (el) el.focus() }
}

// ── 무대 · 걷기 · 말풍선 ──
let stageEl = null, pets = [], hero = null, raf = 0, bubTimer = 0, bub = { strong: false, text: '', who: null }, clock = 0, sig = ''
function makePet(o) {
  const el = document.createElement('div'); el.className = 'pet'; el.tabIndex = 0; el.setAttribute('role', 'button')
  const cv = document.createElement('canvas'); el.append(cv)
  let pool = null
  if (o.pool !== false) { pool = document.createElement('div'); pool.className = 'pool'; stageEl.append(pool) }
  stageEl.append(el)
  const p = { el, cv, pool, o, x: 0, y: 0, tx: 0, ty: 0, wait: .4, jump: 0, t: 0, flip: false, frame: 0, boost: 0 }
  const W = () => stageEl.clientWidth, H = () => stageEl.clientHeight
  const groundTop = () => H() * parseFloat(getComputedStyle(stageEl).getPropertyValue('--h')) / 100
  const floorY = () => (o.vertical ? clamp(p.y, 0, H() - cv.height - 8) : H() - cv.height - 14)
  p.pick = () => {
    p.tx = Math.random() * Math.max(0, W() - cv.width)
    if (o.vertical) { const min = groundTop() - cv.height * .6, max = H() - cv.height - 8; p.ty = min + Math.random() * Math.max(0, max - min) } else p.ty = floorY()
  }
  p.home = () => { p.x = Math.max(0, (W() - cv.width) * o.at); p.y = o.vertical ? clamp(groundTop() + (H() - groundTop()) * o.row - cv.height, 0, H() - cv.height - 8) : floorY(); p.tx = p.x; p.ty = p.y }
  p.rect = () => ({ x: p.x, y: p.y - Math.sin(p.jump * Math.PI) * 18, w: cv.width, h: cv.height })
  p.place = () => {
    const hop = Math.sin(p.jump * Math.PI) * 18, bob = p.moving && !still ? Math.round(-Math.abs(Math.sin(p.t * 8)) * 3) : 0
    el.style.transform = `translate(${Math.round(p.x)}px,${Math.round(p.y - hop + bob)}px)`
    if (pool) { const w = cv.width * 1.55, h = Math.max(18, cv.width * .26); pool.style.width = w + 'px'; pool.style.height = h + 'px'; pool.style.transform = `translate(${Math.round(p.x + cv.width / 2 - w / 2)}px,${Math.round(p.y + cv.height - h * .62)}px)` }
  }
  /** 그림 · 크기 · 온기가 바뀌었을 때 — 서 있던 자리는 그대로 */
  p.redraw = () => {
    drawSprite(cv, o.sp, o.stage, p.frame, o.scale, p.flip); cv.dataset.k = `${p.frame}:${p.flip}`
    el.setAttribute('aria-label', `${o.name} 누르기`)
    if (pool) pool.style.setProperty('--w', (.35 + .65 * (o.pool || 0)).toFixed(2))
    if (!o.vertical) { p.y = p.ty = floorY() }
    p.place()
  }
  p.tick = (dt) => {
    p.t += dt; p.moving = false
    if (p.jump > 0) p.jump = Math.max(0, p.jump - dt * 2.4)
    if (p.boost > 0) p.boost -= dt
    const speed = o.speed * (p.boost > 0 ? 5 : 1)
    if (p.wait > 0) p.wait -= dt
    else {
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy)
      if (d < 2) { p.wait = .8 + Math.random() * 2.6; const r = Math.random(); if (r < .25) p.jump = 1; else if (r < .45) o.onPoke(p); p.pick() }
      else { const st = Math.min(d, speed * dt); p.x += dx / d * st; p.y += dy / d * st; p.moving = true; if (Math.abs(dx) > 1) p.flip = dx < 0 }
    }
    const f = p.moving ? Math.floor(p.t * Math.max(3, speed / 9)) % 2 : 0, k = `${f}:${p.flip}`
    if (cv.dataset.k !== k) { p.frame = f; cv.dataset.k = k; drawSprite(cv, o.sp, o.stage, f, o.scale, p.flip) }
    p.place()
  }
  p.poke = () => { p.jump = 1; o.onPoke(p) }
  el.addEventListener('click', p.poke)
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); p.poke() } })
  drawSprite(cv, o.sp, o.stage, 0, o.scale)
  p.home(); p.redraw()
  return p
}
/** 누르면(또는 혼자 걷다가) 페르소나대로 한마디 + 행동. persona.js 가 없으면 단계 대사 */
function pokeBy(whoFn, lines) {
  return (p) => {
    const w = whoFn()
    if (PERSONA && w.id !== 'egg' && PERSONA.react) {
      const r = PERSONA.react(w.id, w.stage, w.nature, p.last)
      p.last = r.text
      say(r.text, { weak: true, secs: 2.4, who: p })
      act(p, r.action)
    } else say(lines[(Math.random() * lines.length) | 0], { weak: true, secs: 2.4, who: p })
  }
}
/** 행동 하나 — 몸(canvas)의 CSS 애니메이션 + 작은 효과. 대시는 반대쪽으로 빠르게 달린다 */
function act(p, name) {
  if (!name || name === 'hop') { p.jump = 1; if (!name) return }
  if (name === 'dash') { p.tx = p.x < stageEl.clientWidth / 2 ? stageEl.clientWidth - p.cv.width - 4 : 4; p.boost = .7; p.wait = 0 }
  if (still) return
  p.cv.classList.remove(...[...p.cv.classList].filter((c) => c.startsWith('a-')))
  void p.cv.offsetWidth
  p.cv.classList.add(`a-${name}`)
  p.cv.addEventListener('animationend', () => p.cv.classList.remove(`a-${name}`), { once: true })
  const fx = document.createElement('span'); fx.className = 'fx'; fx.textContent = FX[name] ?? ''
  p.el.appendChild(fx); setTimeout(() => fx.remove(), 1300)
}
/** 지금 무대에 설 몸의 값 — 불러온 친구면 그 친구(3단계), 아니면 키우는 빛톨 */
function heroOpts() {
  const w = stageWho(), c = cur(), off = ui.off
  if (w.mate) return { sp: byId(w.id), stage: 2, scale: 5, speed: specOf(w.id).speed, vertical: false, at: .5, row: .85, pool: off ? false : c.p, name: nameOf(w.id), onPoke: pokeBy(stageWho, specOf(w.id).lines) }
  return { sp: c.sp, stage: c.stage, scale: heroScale(), speed: state.species ? specOf(c.id).speed * (ui.field ? 2 : 1) : 0, vertical: ui.field, at: ui.field ? .5 : .4, row: .92, pool: off ? false : c.p, name: c.name, onPoke: pokeBy(stageWho, state.species ? specOf(c.id).lines : EGG_LINES) }
}
const wantSig = () => [ui.field, mateId() || '', ui.field ? graduatedIds().join(',') : '', ui.off].join('|')
function syncStage() {
  if (wantSig() !== sig || ui.scene) mountStage()
  else if (hero) { Object.assign(hero.o, heroOpts(), { at: hero.o.at }); hero.redraw() }
}
function mountStage() {
  stageEl = $('#stage'); sig = wantSig()
  const scene = ui.scene; ui.scene = null
  stageEl.querySelectorAll('.pet,.pool,.gpet,.ring,.nom').forEach((e) => e.remove())
  pets = []; hero = null; hideBubble(true)
  const o = heroOpts()
  if (ui.field) {
    // 전체 화면 — 도감에 남긴 친구(졸업한 종)가 전부 같이 돌아다닌다
    const ATS = [.04, .96, .5, .25, .75, .5]
    graduatedIds().forEach((id, i) => {
      const sp = byId(id), who = () => ({ id, stage: 2, nature: lastGraduation(state, id)?.nature ?? '차분한' })
      pets.push(makePet({ sp, stage: 2, scale: 4, speed: specOf(id).speed * 2, vertical: true, at: ATS[i % ATS.length], row: .42 + (i > 1 ? .2 : 0), pool: false, name: nameOf(id), onPoke: pokeBy(who, specOf(id).lines) }))
    })
  }
  if (scene) o.at = .66
  hero = makePet(o); pets.push(hero)
  if (scene) {
    const gc = document.createElement('canvas'); gc.className = 'gpet'; drawSprite(gc, byId(scene.id), 2, 0, 5); stageEl.append(gc)
    gc.style.left = Math.round((stageEl.clientWidth - gc.width) * .16) + 'px'; gc.style.top = (stageEl.clientHeight - gc.height - 14) + 'px'
    if (!still) { hero.cv.classList.add('dropin'); hero.cv.style.animationDelay = '1.1s' }
    stageEl.insertAdjacentHTML('beforeend', `<span class="ring" style="left:${hero.x + hero.cv.width / 2 - 40}px;top:${hero.y + hero.cv.height - 20}px;width:80px;height:26px;${still ? '' : 'animation-delay:1.85s'}"></span>`)
    const line = () => { if (ui.view === 'main' && hero) say('졸업! 새 알이 왔어요', { strong: true, secs: 8, who: hero, force: true }) }
    if (still) { line(); setTimeout(() => stageEl && stageEl.querySelectorAll('.gpet,.ring').forEach((e) => e.remove()), 6000) } else setTimeout(line, 1900)
  }
  if (ui.bubble) { say(ui.bubble, { weak: true, secs: 6, who: hero, force: true }); ui.bubble = null }
  placeBubble()
}
function say(text, { weak = false, strong = false, secs = 3, who = hero, force = false } = {}) {
  const b = $('#bub'); if (!b || !who) return false
  if (!force && !b.hidden && bub.strong && weak) return false // 답변이 떠 있으면 혼잣말은 건너뛴다 — 답변은 아래 줄에 남아 있다
  b.querySelector('.bt').textContent = text
  b.className = `bubble ${weak ? 'weak' : 'strong'}`; b.hidden = false
  b.style.setProperty('--secs', secs + 's')
  const t = b.querySelector('.timer'); if (t) { t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '' }
  bub = { strong: !weak, text, who }
  clearTimeout(bubTimer); bubTimer = setTimeout(hideBubble, secs * 1000)
  setLive(!!said && text === said.text)
  placeBubble(); return true
}
function hideBubble(silent = false) { const b = $('#bub'); if (b) b.hidden = true; bub = { strong: false, text: '', who: null }; if (silent) ui.live = false; else setLive(false) }
function setLive(on) {
  if (ui.live === on) return
  ui.live = on
  if (ui.view === 'main' && $('#said')) renderMain()
}
function placeBubble() {
  const b = $('#bub'); if (!b || b.hidden || !stageEl || !bub.who) return
  const p = bub.who.rect(), W = stageEl.clientWidth, bw = b.offsetWidth, bh = b.offsetHeight
  const cx = p.x + p.w / 2, left = clamp(cx - bw / 2, 10, W - bw - 10); let top = Math.max(10, p.y - bh - 14)
  const sb = $('.stage-btns'), ev = $('#evt'); if (top < 54 && ((sb && left + bw > W - sb.offsetWidth - 18) || (ev && left < ev.offsetWidth + 22))) top = 54
  b.style.transform = `translate(${Math.round(left)}px,${Math.round(top)}px)`
  const tail = b.querySelector('.tail'); tail.style.left = clamp(cx - left, 16, bw - 16) + 'px'
}
function nom(amount) {
  if (!hero) return
  const p = hero.rect(), el = document.createElement('span'); el.className = 'nom'; el.textContent = `냠! +${amount}`
  stageEl.append(el)
  el.style.left = clamp(p.x + p.w - 8, 8, stageEl.clientWidth - 86) + 'px'; el.style.top = Math.max(8, p.y + p.h * .35) + 'px'
  setTimeout(() => el.remove(), 1700)
}
function loop(now) {
  const dt = Math.min(.05, (now - (clock || now)) / 1000); clock = now
  if (!document.hidden) { pets.forEach((p) => p.tick(dt)); placeBubble() }
  raf = requestAnimationFrame(loop)
}

// ── 화면 전환 ──
function go(view, extra = {}) {
  cancelAnimationFrame(raf); clearTimeout(bubTimer)
  pets = []; hero = null; stageEl = null; sig = ''; bub = { strong: false, text: '', who: null }; ui.live = false
  Object.assign(ui, { view }, extra)
  const app = $('#app'); app._h = null
  app.className = `app${view === 'main' && ui.field ? ' field' : ''}`
  if (view === 'main') { app.innerHTML = mainHTML(); if (!still) raf = requestAnimationFrame(loop) }
  render()
  window.scrollTo(0, 0)
}
function setField(on) {
  ui.field = on; ui.evt = null
  go('main')
  serviceCall('fullscreen', { on }).catch(() => {})
}
const openDex = () => { ui.grad = null; go('dex', { focus: '.dt' }) }
function openDetail(id) {
  if (state.news.includes(id)) { state.news = state.news.filter((x) => x !== id); serviceCall('seenDex', { id }).then(apply).catch(() => {}) }
  go('detail', { sel: id, editing: false, saveErr: false, actErr: '', quote: byId(id).stages[2].line, focus: '#act1' })
}
function setMate(id) {
  ui.actErr = ''
  serviceCall('setMate', { id }).then((snap) => {
    apply(snap)
    go('main', { focus: '#dexOpen', bubble: id ? byId(id).stages[2].line : null })
  }).catch(() => { ui.actErr = '무대를 바꾸지 못했어요. 서비스가 켜져 있는지 확인하고 다시 눌러 주세요.'; render() })
}
function saveName(id, value) {
  const name = value.trim()
  serviceCall('setName', { id, name }).then((snap) => {
    ui.editing = false; ui.saveErr = false; apply(snap)
    $('#detStatus').textContent = name ? `이름을 “${name}”(으)로 저장했어요.` : `이름을 비워 종 이름(${stName(id, 2)})으로 돌아갔어요.`
    const r = $('#rename'); if (r) r.focus()
  }).catch(() => {
    ui.saveErr = true; render() // 입력한 글은 그대로 둔다
    const inp = $('#nameIn'); if (inp) { inp.value = value; $('#nameCnt').textContent = `${[...value].length}/${NAME_MAX}`; inp.focus() }
  })
}
function cancelEdit() { ui.editing = false; ui.saveErr = false; ui.focus = '#rename'; render() }

const app = $('#app')
app.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t || t.disabled) return
  if (t.id === 'dexOpen' || t.id === 'dexOpen2') return openDex()
  if (t.id === 'full') return setField(!ui.field)
  if (t.id === 'talk') {
    ui.talkErr = ''
    return void serviceCall('talk').then(() => render()).catch((error) => {
      ui.talkErr = String(error.message).includes('permission') ? '말 걸기는 chat 권한이 필요합니다 — 플러그인을 다시 설치해 허용해 주세요.' : '프로젝트를 연 상태에서 다시 눌러 주세요.'
      render()
    })
  }
  if (t.classList.contains('sw')) { state.bg = t.dataset.bg; applyBg(); void serviceCall('setBg', { bg: t.dataset.bg }).catch(() => {}); return }
  if (t.dataset.home) return setMate(null)
  if (t.id === 'more') { const open = $('#said').classList.toggle('open'); t.setAttribute('aria-expanded', open); t.textContent = open ? '접기' : '모두 보기'; return }
  if (t.id === 'back') return ui.view === 'detail' ? go('dex', { focus: `.dt[data-sp="${ui.sel}"]` }) : go('main', { focus: '#dexOpen' })
  if (t.classList.contains('dt')) {
    if (t.dataset.n === '0') { $('#dexStatus').textContent = '아직 못 만난 친구예요. 알에서 나와 3단계까지 자라 졸업하면 열려요.'; return }
    return openDetail(t.dataset.sp)
  }
  if (t.id === 'rename') { ui.editing = true; ui.saveErr = false; render(); $('#nameIn').focus(); return }
  if (t.id === 'nameNo') return cancelEdit()
  if (t.id === 'act1') return setMate(mateId() === ui.sel ? null : ui.sel)
  if (t.id === 'dpet') {
    const id = ui.sel, w = { id, stage: 2, nature: lastGraduation(state, id)?.nature ?? null }
    ui.quote = PERSONA && PERSONA.react ? PERSONA.react(w.id, 2, w.nature, ui.quote).text : specOf(id).lines[(Math.random() * 3) | 0] ?? ui.quote
    $('#dq .bt').textContent = ui.quote
    const cv = $('#dpet canvas'); cv.classList.remove('hop'); void cv.offsetWidth; cv.classList.add('hop')
  }
})
app.addEventListener('input', (e) => { if (e.target.id === 'nameIn') $('#nameCnt').textContent = `${[...e.target.value].length}/${NAME_MAX}` })
app.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.id === 'nameForm') saveName(ui.sel, $('#nameIn').value) })
app.addEventListener('keydown', (e) => {
  const grid = e.target.closest && e.target.closest('#dexgrid'); if (!grid) return
  const items = [...grid.querySelectorAll('.dt')], i = items.indexOf(document.activeElement); if (i < 0) return
  const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length
  const d = { ArrowLeft: -1, ArrowUp: -cols, ArrowRight: 1, ArrowDown: cols }[e.key]
  if (e.key === 'Home') items[0].focus(); else if (e.key === 'End') items[items.length - 1].focus()
  else if (d != null) items[clamp(i + d, 0, items.length - 1)].focus()
  else return
  e.preventDefault()
})
app.addEventListener('focusin', (e) => { const b = e.target.closest && e.target.closest('.dt'); if (b) app.querySelectorAll('.dt').forEach((x) => (x.tabIndex = x === b ? 0 : -1)) })
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (ui.view === 'main' && ui.field) setField(false)
  else if (ui.view === 'detail' && ui.editing) cancelEdit()
  else if (ui.view === 'detail') go('dex', { focus: `.dt[data-sp="${ui.sel}"]` })
  else if (ui.view === 'dex') go('main', { focus: '#dexOpen' })
})
let rz = 0
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawArt(); bindSaid(); pets.forEach((p) => { p.home(); p.place() }); placeBubble() }, 80) })
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(drawArt, 30))

// ── 시작 ──
;(async () => {
  go('main')
  // 서비스 소식(service.update)을 받고, 지금 모습을 한 번 묻는다. 서비스가 아직 안 떴으면(service-off) 안내만 보인다
  try { await call('events.subscribe', { events: ['service.update'] }) } catch { /* 권한 없음 */ }
  try { apply(await serviceCall('state')) } catch { ui.off = true; firstApply = false; render() }
  document.addEventListener('visibilitychange', () => !document.hidden && serviceCall('state').then(apply).catch(() => {}))
})()
</script>
</body>
